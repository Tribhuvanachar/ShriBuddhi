<!DOCTYPE html><html lang="sa"><head>
<meta charset="UTF-8">
<script src="../../js/vandana-guard.js?v=2"></script>
<script src="../../js/contact-email.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>धातुः · संवादः (Card) · DGE</title>
<!-- Indic transliteration, vendored (js/vendor/README.md): the reader's
     script setting and the धातु/कोश word marking both depend on it, so it
     must not be one CDN outage away from silently not working. -->
<script src="../../js/vendor/sanscript-1.3.3.min.js?v=1.3.3"></script>
<link rel="icon" type="image/png" sizes="48x48" href="../../images/genie/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/genie/favicon-192.png">
<link rel="apple-touch-icon" href="../../images/genie/apple-touch-icon.png">
<style>
/* ===== theme tokens (ink / saffron palette, light default + dark) ===== */
:root{
  --page-bg:#e8e4da; --page-grad1:#efeadf; --page-grad2:#e0dbcf;
  --modal-bg:#fffdf8; --modal-border:#e0dcd2; --modal-shadow:0 24px 60px -12px rgba(60,40,20,.35);
  --divider:#eae5db; --divider-soft:#f0ece3;
  --text:#3f3933; --text-strong:#241d15; --muted:#8c816d; --muted-2:#a89f8c; --faint:#b8b0a0;
  --cell-bg:#f8f7f4; --cell-border:#e6e1d6; --cell-hover:#f0eee8;
  --chip-bg:#f2efe8; --chip-border:#e3ddd0; --chip-text:#584f44;
  --accent:#c74502; --accent-strong:#f05d00; --accent-ink:#7f2e0c;
  --accent-soft-bg:rgba(255,122,13,.12); --accent-soft-border:rgba(240,93,0,.32);
  --accent-glow:0 0 0 2px rgba(240,93,0,.45);
  --btn-bg:#f2efe8; --btn-hover:#e7e1d5;
  --scrim:rgba(40,29,21,.42);
  --grip:#d8d1c3;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page-bg:#0d0c0a; --page-grad1:#141210; --page-grad2:#0b0a08;
  --modal-bg:#1b1814; --modal-border:rgba(74,66,58,.85); --modal-shadow:0 24px 70px -10px rgba(0,0,0,.7);
  --divider:rgba(74,66,58,.55); --divider-soft:rgba(74,66,58,.35);
  --text:#f0eee8; --text-strong:#ffffff; --muted:#a89f8c; --muted-2:#8c816d; --faint:#6f6656;
  --cell-bg:#26221d; --cell-border:rgba(74,66,58,.8); --cell-hover:#2f2a24;
  --chip-bg:rgba(74,66,58,.75); --chip-border:rgba(88,79,68,.55); --chip-text:#c9c3b4;
  --accent:#ff9a36; --accent-strong:#ffc070; --accent-ink:#ffc070;
  --accent-soft-bg:rgba(255,122,13,.13); --accent-soft-border:rgba(255,122,13,.4);
  --accent-glow:0 0 0 2px rgba(255,154,54,.55),0 0 20px -4px rgba(255,154,54,.35);
  --btn-bg:rgba(74,66,58,.5); --btn-hover:rgba(88,79,68,.65);
  --scrim:rgba(0,0,0,.6);
  --grip:#584f44;
}}
:root[data-theme="dark"]{
  --page-bg:#0d0c0a; --page-grad1:#141210; --page-grad2:#0b0a08;
  --modal-bg:#1b1814; --modal-border:rgba(74,66,58,.85); --modal-shadow:0 24px 70px -10px rgba(0,0,0,.7);
  --divider:rgba(74,66,58,.55); --divider-soft:rgba(74,66,58,.35);
  --text:#f0eee8; --text-strong:#ffffff; --muted:#a89f8c; --muted-2:#8c816d; --faint:#6f6656;
  --cell-bg:#26221d; --cell-border:rgba(74,66,58,.8); --cell-hover:#2f2a24;
  --chip-bg:rgba(74,66,58,.75); --chip-border:rgba(88,79,68,.55); --chip-text:#c9c3b4;
  --accent:#ff9a36; --accent-strong:#ffc070; --accent-ink:#ffc070;
  --accent-soft-bg:rgba(255,122,13,.13); --accent-soft-border:rgba(255,122,13,.4);
  --accent-glow:0 0 0 2px rgba(255,154,54,.55),0 0 20px -4px rgba(255,154,54,.35);
  --btn-bg:rgba(74,66,58,.5); --btn-hover:rgba(88,79,68,.65);
  --scrim:rgba(0,0,0,.6);
  --grip:#584f44;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,var(--page-grad1),var(--page-grad2));
  -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center;
  min-height:100dvh; padding:0;
}
@media (min-width:640px){ body{ padding:16px } }
.deva{ font-family:"Noto Sans Devanagari","Noto Serif Devanagari","Noto Serif",serif; }
.sr-mono{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
::-webkit-scrollbar{ width:5px; height:5px }
::-webkit-scrollbar-track{ background:transparent }
::-webkit-scrollbar-thumb{ background:var(--muted-2); border-radius:3px; opacity:.5 }
button{ font:inherit; cursor:pointer; border:none; background:none; color:inherit }
input{ font:inherit }

/* ===== modal card ===== */
#dialog{
  position:relative; z-index:2; width:100%; max-width:460px; margin:0 auto;
  height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  background:var(--modal-bg); border:1px solid var(--modal-border);
}
@media (min-width:640px){ #dialog{ height:94dvh; max-height:860px; border-radius:22px; box-shadow:var(--modal-shadow) } }

/* header */
.hdr{ flex:0 0 auto; padding:16px 16px 10px; border-bottom:1px solid var(--divider); }
.hdr-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
.title-row{ display:flex; align-items:center; gap:9px; min-width:0 }
.title-row h1{ margin:0; font-size:1.85rem; font-weight:600; letter-spacing:-.01em; color:var(--text-strong); line-height:1 }
.gana-badge{ font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
  color:var(--accent); background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border);
  padding:2px 7px; border-radius:6px; white-space:nowrap }
.subtitle{ margin:6px 0 0; font-size:.86rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.icon-btns{ display:flex; align-items:center; gap:5px; flex:0 0 auto }
.icon-btn{ width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); transition:background .15s,color .15s }
.icon-btn:hover{ color:var(--text-strong); background:var(--btn-bg) }
.rootsearch{ margin-top:11px; position:relative }
.rootsearch input{ width:100%; padding:8px 12px; border-radius:10px; background:var(--cell-bg);
  border:1px solid var(--cell-border); color:var(--text); outline:none; font-size:.85rem }
.rootsearch input:focus{ border-color:var(--accent-soft-border); box-shadow:0 0 0 2px var(--accent-soft-bg) }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px }
.chip{ font-size:.7rem; padding:2px 9px; border-radius:999px; background:var(--chip-bg);
  border:1px solid var(--chip-border); color:var(--chip-text) }

/* lakara tabs */
.lakara-nav{ flex:0 0 auto; padding:9px 12px; border-bottom:1px solid var(--divider-soft) }
.lakara-scroll{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none }
.lakara-scroll::-webkit-scrollbar{ display:none }
.lakara-btn{ flex:0 0 auto; padding:6px 13px; border-radius:999px; font-size:.8rem; font-weight:500;
  background:var(--cell-bg); border:1px solid transparent; color:var(--muted); transition:all .15s }
.lakara-btn:hover{ background:var(--cell-hover); color:var(--text) }
.lakara-btn.active{ background:var(--accent-soft-bg); color:var(--accent); border-color:var(--accent-soft-border);
  box-shadow:0 0 16px -6px var(--accent-strong) }

/* main */
.main{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:14px 16px 20px }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px }
.section-head h2{ margin:0; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--muted) }
.hint{ font-size:.66rem; color:var(--faint) }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px }
.cell{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:13px 4px; border-radius:13px; background:var(--cell-bg); border:1px solid var(--cell-border);
  color:var(--text); text-align:center; transition:transform .1s,background .12s,border-color .12s,box-shadow .12s; min-height:60px }
.cell:not(.empty):hover{ background:var(--cell-hover); border-color:var(--muted-2) }
.cell:not(.empty):active{ transform:scale(.97) }
.cell .f{ font-size:1.02rem; font-weight:500; line-height:1.15 }
.cell .lbl{ font-size:.6rem; color:var(--muted-2); margin-top:6px; letter-spacing:.03em }
.cell .plus{ position:absolute; top:5px; right:7px; font-size:.58rem; color:var(--accent); font-weight:600 }
.cell.empty{ color:var(--faint); cursor:default }
.cell.sel{ border-color:var(--accent-soft-border); box-shadow:var(--accent-glow); color:var(--text-strong);
  background:var(--accent-soft-bg) }
.cell.nosteps{ opacity:.85 }
.purusha-hints{ display:flex; justify-content:space-between; font-size:.6rem; color:var(--faint); padding:0 4px; margin-top:11px }
.purusha-hints2{ display:flex; justify-content:space-between; font-size:.58rem; color:var(--faint); padding:0 4px; margin-top:1px }
.purusha-hints2 span{ width:33.33%; text-align:center }

/* prakriya in-page ladder */
.prakriya{ margin-top:20px }
.prakriya.hidden{ display:none }
.prakriya-box{ border-radius:14px; background:var(--divider-soft); border:1px solid var(--divider); padding:13px }
.pk-form-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap }
.pk-form-head .ff{ font-size:1.15rem; font-weight:600; color:var(--accent) }
.pk-form-head .from{ font-size:.68rem; color:var(--muted-2) }
.pk-deriv-title{ font-size:.68rem; color:var(--muted); margin:12px 0 6px; text-transform:uppercase; letter-spacing:.06em }
/* stepsHtml output */
.pk-steps-toggle{ display:flex; align-items:center; gap:7px; font-size:.7rem; color:var(--muted); margin-bottom:8px; cursor:pointer }
.pk-steps-toggle input{ accent-color:var(--accent-strong) }
ol.pk-steps{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; counter-reset:pk }
ol.pk-steps li{ display:grid; grid-template-columns:auto 1fr; align-items:baseline; gap:10px; padding:5px 4px; border-bottom:1px dashed var(--divider) }
ol.pk-steps li:last-child{ border-bottom:none }
ol.pk-steps.pk-main-only .pk-step-same{ display:none }
.pk-code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.75rem; color:var(--accent);
  background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border); border-radius:6px; padding:1px 6px; white-space:nowrap }
.pk-code.pk-code-plain{ color:var(--muted); background:var(--chip-bg); border-color:var(--chip-border) }
.pk-result{ font-size:1rem; color:var(--text) }
.pk-step-note{ display:block; font-size:.64rem; color:var(--faint); grid-column:2 }
.pk-empty{ font-size:.82rem; color:var(--muted); text-align:center; padding:16px 0 }
.link-btn{ font-size:.7rem; color:var(--accent); background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border);
  padding:3px 9px; border-radius:8px; margin-left:auto }

/* footer quick actions */
.qa-footer{ flex:0 0 auto; border-top:1px solid var(--divider); padding:9px 12px calc(9px + var(--safe-bottom));
  background:var(--modal-bg); display:flex; gap:7px }
.qa-btn{ flex:1; padding:9px 2px; border-radius:12px; background:var(--btn-bg); color:var(--text);
  font-size:.74rem; font-weight:500; transition:background .12s }
.qa-btn:hover{ background:var(--btn-hover) }

/* ===== overlays ===== */
.overlay{ position:fixed; inset:0; z-index:40; display:none }
.overlay.open{ display:block }
.scrim{ position:absolute; inset:0; background:var(--scrim) }

/* more menu */
.more-panel{ position:absolute; left:0; right:0; bottom:0; background:var(--modal-bg);
  border-top:1px solid var(--modal-border); border-radius:18px 18px 0 0; box-shadow:var(--modal-shadow); overflow:hidden }
@media (min-width:640px){ .more-panel{ left:auto; right:16px; bottom:auto; top:76px; width:264px; border:1px solid var(--modal-border); border-radius:14px } }
.more-panel .mh{ padding:11px 16px; border-bottom:1px solid var(--divider); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted) }
.more-item{ width:100%; text-align:left; padding:12px 16px; font-size:.88rem; color:var(--text); display:flex; align-items:center; gap:11px }
.more-item:hover{ background:var(--cell-hover) }
.more-item .m-deva{ color:var(--accent); font-weight:600; min-width:22px }
.more-sep{ height:1px; background:var(--divider); margin:4px 0 }
.more-cancel{ padding:11px 16px; border-top:1px solid var(--divider) }
.more-cancel button{ width:100%; padding:9px; font-size:.85rem; color:var(--muted) }
@media (min-width:640px){ .more-cancel{ display:none } }

/* sutra drawer */
.drawer-panel{ position:absolute; top:0; right:0; bottom:0; width:100%; max-width:400px; background:var(--modal-bg);
  border-left:1px solid var(--modal-border); box-shadow:var(--modal-shadow); display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .3s cubic-bezier(.32,.72,0,1) }
.overlay.open .drawer-panel{ transform:translateX(0) }
.dr-head{ flex:0 0 auto; padding:12px 14px; border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; gap:8px }
.dr-nav{ display:flex; align-items:center; gap:6px }
.dr-code-head{ font-family:ui-monospace,Menlo,monospace; font-size:.78rem; color:var(--accent); min-width:66px; text-align:center }
.dr-body{ flex:1 1 auto; overflow-y:auto; padding:20px 18px }
.dr-form{ font-size:2rem; font-weight:600; color:var(--text-strong); line-height:1.1 }
.dr-pos{ font-size:.68rem; color:var(--muted-2); margin-top:6px; letter-spacing:.05em }
.dr-codewrap{ margin-top:18px }
.dr-codewrap .lbl{ font-size:.64rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px }
.dge-sutra-ref{ font-family:ui-monospace,Menlo,monospace; font-size:.95rem; color:var(--accent);
  background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border); border-radius:8px; padding:4px 11px;
  display:inline-block; cursor:pointer }
.dr-note{ font-size:.85rem; color:var(--muted); line-height:1.5; margin:18px 0 0 }
.dr-changed{ display:inline-block; margin-top:14px; font-size:.66rem; padding:2px 9px; border-radius:999px }
.dr-changed.yes{ color:var(--accent); background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border) }
.dr-changed.no{ color:var(--muted); background:var(--chip-bg); border:1px solid var(--chip-border) }
.dr-hint{ font-size:.72rem; color:var(--faint); margin-top:26px; line-height:1.5;
  border-top:1px dashed var(--divider); padding-top:14px }

/* bottom sheet */
.sheet-panel{ position:absolute; left:0; right:0; bottom:0; max-height:80dvh; background:var(--modal-bg);
  border-top:1px solid var(--modal-border); border-radius:20px 20px 0 0; box-shadow:var(--modal-shadow);
  display:flex; flex-direction:column; transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1) }
.overlay.open .sheet-panel{ transform:translateY(0) }
.sheet-grip{ display:flex; justify-content:center; padding:9px 0 3px }
.sheet-grip span{ width:40px; height:4px; border-radius:999px; background:var(--grip) }
.sheet-head{ padding:5px 16px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--divider-soft) }
.sheet-head h2{ margin:0; font-size:.95rem; font-weight:600; color:var(--text-strong) }
.sheet-body{ flex:1 1 auto; overflow-y:auto; padding:14px 16px calc(18px + var(--safe-bottom)) }
.card-row{ display:flex; flex-direction:column; gap:9px }
.kcard{ border-radius:13px; background:var(--cell-bg); border:1px solid var(--cell-border); padding:12px 13px; text-align:left; display:block; width:100% }
.kcard:hover{ background:var(--cell-hover) }
.kcard .kt{ font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between; gap:8px }
.kcard .kt .kd{ color:var(--accent); font-weight:600 }
.kcard .kf{ font-size:1.15rem; color:var(--text-strong); font-weight:500 }
.kcard .ke{ font-size:.74rem; color:var(--muted); margin-top:3px }
.sec-lak{ margin-bottom:14px }
.sec-lak h3{ margin:0 0 6px; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:baseline; gap:7px }
.sec-lak h3 .en{ font-size:.62rem; color:var(--faint); text-transform:none; letter-spacing:0 }
.sec-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px }
.sec-grid .sc{ padding:7px 3px; border-radius:9px; background:var(--cell-bg); border:1px solid var(--cell-border); text-align:center; font-size:.86rem }
.info-block{ margin-bottom:15px }
.info-block .il{ font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:3px }
.info-block .iv{ font-size:.92rem; color:var(--text) }
.sheet-note{ font-size:.74rem; color:var(--faint); margin-top:6px }
.loading{ font-size:.85rem; color:var(--muted); text-align:center; padding:24px 0 }
.notice{ text-align:center; padding:34px 14px; color:var(--muted) }
.notice .big{ font-size:1.4rem; color:var(--text-strong); margin-bottom:8px }
.notice .sub{ font-size:.85rem; line-height:1.55 }
</style></head>
<body>
<div class="scrim" style="position:fixed;z-index:1"></div>

<div id="dialog">
  <!-- header -->
  <header class="hdr">
    <div class="hdr-top">
      <div style="min-width:0">
        <div class="title-row">
          <h1 class="deva" id="dhatu-title">…</h1>
          <span class="gana-badge deva" id="gana-badge"></span>
        </div>
        <p class="subtitle deva" id="dhatu-sub"></p>
      </div>
      <div class="icon-btns">
        <button class="icon-btn" id="btn-more" aria-label="More">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
        <button class="icon-btn" id="btn-close" aria-label="Back to views">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="rootsearch">
      <input id="root-input" list="root-list" placeholder="अन्यधातुः — search a root (code, धातु, or IAST)…" autocomplete="off" spellcheck="false">
      <datalist id="root-list"></datalist>
    </div>
    <div class="chips" id="meta-chips"></div>
  </header>

  <!-- lakara tabs -->
  <nav class="lakara-nav"><div class="lakara-scroll" id="lakara-tabs"></div></nav>

  <!-- main -->
  <main class="main" id="main-content">
    <section id="forms-section">
      <div class="section-head">
        <h2 class="deva" id="lakara-title">लट्</h2>
        <span class="hint">tap a form for prakriyā</span>
      </div>
      <div class="grid3" id="forms-grid"></div>
      <div class="purusha-hints deva"><span>प्रथम</span><span>मध्यम</span><span>उत्तम</span></div>
      <div class="purusha-hints2 deva"><span>एक · द्वि · बहु</span><span>एक · द्वि · बहु</span><span>एक · द्वि · बहु</span></div>
    </section>

    <section id="prakriya-section" class="prakriya hidden">
      <div class="section-head">
        <h2>प्रक्रिया</h2>
        <button class="link-btn" id="btn-close-prakriya">✕ close</button>
      </div>
      <div class="prakriya-box" id="prakriya-content"></div>
    </section>
  </main>

  <!-- footer quick actions -->
  <footer class="qa-footer">
    <button class="qa-btn deva" data-action="krdanta">कृदन्त</button>
    <button class="qa-btn deva" data-action="nijanta">णिचन्तः</button>
    <button class="qa-btn deva" data-action="sananta">सन्नन्तः</button>
    <button class="qa-btn" data-action="info">Info</button>
  </footer>
</div>

<!-- more menu -->
<div class="overlay" id="more-menu">
  <div class="scrim" data-close-more></div>
  <div class="more-panel">
    <div class="mh">Extended</div>
    <div style="padding:4px 0">
      <button class="more-item" data-action="krdanta"><span class="m-deva deva">कृ</span> कृदन्त forms</button>
      <button class="more-item" data-action="nijanta"><span class="m-deva deva">णि</span> णिचन्त (causative)</button>
      <button class="more-item" data-action="sananta"><span class="m-deva deva">सन्</span> सन्नन्त (desiderative)</button>
      <button class="more-item" data-action="yananta"><span class="m-deva deva">यङ्</span> यङन्त (intensive)</button>
      <div class="more-sep"></div>
      <button class="more-item" data-action="info"><span class="m-deva">ⓘ</span> Dhātu details</button>
    </div>
    <div class="more-cancel"><button data-close-more>Cancel</button></div>
  </div>
</div>

<!-- sutra drawer -->
<div class="overlay" id="sutra-drawer">
  <div class="scrim" data-close-sutra></div>
  <div class="drawer-panel">
    <div class="dr-head">
      <div class="dr-nav">
        <button class="icon-btn" id="sutra-prev" aria-label="Previous step">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="dr-code-head sr-mono" id="drawer-code">—</span>
        <button class="icon-btn" id="sutra-next" aria-label="Next step">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button class="icon-btn" data-close-sutra aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dr-body" id="drawer-body"></div>
  </div>
</div>

<!-- bottom sheet -->
<div class="overlay" id="bottom-sheet">
  <div class="scrim" data-close-sheet></div>
  <div class="sheet-panel">
    <div class="sheet-grip"><span></span></div>
    <div class="sheet-head">
      <h2 class="deva" id="sheet-title">कृदन्त</h2>
      <button class="icon-btn" data-close-sheet aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-content"></div>
  </div>
</div>

<script src="../../js/dge-shell.js?v=1"></script>
<script src="../../js/dge-breadcrumb.js?v=1"></script>

<script src="../../js/dhatu-data.js?v=1"></script>
<script>
(function(){
  "use strict";
  var D = window.DGE_DHATU;
  var esc = D.esc;

  // ---- state ----
  var state = { code:"01.0001", d:null, dp:null, dpItem:null,
                lakara:null, selKey:null, drawer:{steps:[], idx:0, label:"" } };

  var PUR = ["प्र","म","उ"], VAC = ["ए","द्वि","बहु"];
  var SECLAK = { lat:["लट्","present"], lit:["लिट्","perfect"], lut:["लुट्","periphrastic future"],
                 lrut:["लृट्","future"], lot:["लोट्","imperative"], lang:["लङ्","imperfect"],
                 lin:["विधिलिङ्","optative"], lun:["लुङ्","aorist"] };

  function $(id){ return document.getElementById(id); }
  function isSutra(c){ return /^[1-8]\.[1-4]\.\d{1,3}$/.test(c); }
  function decodeSteps(s){ var last=""; return (s||[]).map(function(st){
    var code=st[0], changed=st.length>1; if(changed) last=st[1];
    return { code:code, form:last, changed:changed }; }); }

  // ---- header / meta ----
  function renderHeader(){
    var m = state.d ? D.meta(state.d) : null;
    var it = state.dpItem;
    var dhatu = (m && m.dhatu) || (it && it.dhatu) || "—";
    var gana = (m && m.gana) || (it && it.gana);
    var ganaName = D.GANA[gana] || "";
    $("dhatu-title").textContent = dhatu;
    $("gana-badge").textContent = ganaName;
    var artha = (m && m.artha) || (it && it.artha) || "";
    $("dhatu-sub").textContent = artha ? (artha + (it && it.dhatu_slp ? "  ·  " + it.dhatu_slp : "")) : (it && it.dhatu_slp || "");
    // chips
    var chips = [];
    var pada = (m && m.pada) || (it && it.pada) || "";
    if(pada) chips.push(pada);
    if(it && it.set) chips.push(it.set);
    if(it && it.karma) chips.push(it.karma);
    chips.push("धातुः " + esc(state.code));
    $("meta-chips").innerHTML = chips.map(function(c){ return '<span class="chip deva">'+esc(c)+'</span>'; }).join("");
  }

  // ---- lakara tabs ----
  function renderLakaraTabs(){
    var cont = $("lakara-tabs");
    var laks = D.availableLakaras(state.d);
    if(!laks.length){ cont.innerHTML=""; return; }
    if(!state.lakara || laks.indexOf(state.lakara)<0) state.lakara = laks.indexOf("Lat")>=0 ? "Lat" : laks[0];
    cont.innerHTML = laks.map(function(l){
      return '<button class="lakara-btn deva'+(l===state.lakara?' active':'')+'" data-lakara="'+l+'" title="'+esc(D.LAKARA_EN[l]||"")+'">'+esc(D.LAKARA[l]||l)+'</button>';
    }).join("");
    cont.querySelectorAll(".lakara-btn").forEach(function(b){
      b.addEventListener("click", function(){
        state.lakara = b.dataset.lakara; state.selKey=null;
        renderLakaraTabs(); renderGrid(); hidePrakriya();
      });
    });
  }

  // ---- forms grid ----
  function renderGrid(){
    var grid = $("forms-grid");
    var lak = state.lakara;
    $("lakara-title").textContent = (D.LAKARA[lak]||lak) + " · " + (D.LAKARA_EN[lak]||"");
    var g = D.gridFor(state.d, lak);
    var html = "";
    for(var p=0;p<3;p++){ for(var v=0;v<3;v++){
      var cell = g[p][v];
      var lbl = PUR[p]+"."+VAC[v]+".";
      if(!cell.forms){
        html += '<div class="cell empty"><span class="f">—</span><span class="lbl deva">'+lbl+'</span></div>';
      } else {
        var first = cell.forms[0];
        var more = cell.forms.length>1 ? '<span class="plus">+'+(cell.forms.length-1)+'</span>' : "";
        html += '<button class="cell'+(cell.hasSteps?'':' nosteps')+(cell.key===state.selKey?' sel':'')+'" '+
                'data-key="'+esc(cell.key)+'" title="'+esc(cell.forms.join(" · "))+'">'+more+
                '<span class="f deva">'+esc(first)+'</span><span class="lbl deva">'+lbl+'</span></button>';
      }
    }}
    grid.innerHTML = html;
    grid.querySelectorAll(".cell[data-key]").forEach(function(b){
      b.addEventListener("click", function(){ selectForm(b.dataset.key); });
    });
  }

  function selectForm(key){
    state.selKey = key;
    renderGrid();
    showPrakriya(key);
  }

  // ---- in-page prakriya ladder + open drawer ----
  function showPrakriya(key){
    var sec = $("prakriya-section"), box = $("prakriya-content");
    sec.classList.remove("hidden");
    var derivs = D.stepsFor(state.d, key);
    var grid = D.gridFor(state.d, state.lakara);
    var cell=null;
    for(var p=0;p<3 && !cell;p++) for(var v=0;v<3;v++){ if(grid[p][v].key===key){ cell=grid[p][v]; break; } }
    var formStr = cell && cell.forms ? cell.forms.join(" · ") : "";
    var head = '<div class="pk-form-head"><span class="ff deva">'+esc(formStr)+'</span>'+
               '<span class="from deva">← '+esc(state.d.dhatu)+'</span>'+
               '<button class="link-btn" id="pk-open-drawer">steps ▸</button></div>';
    if(!derivs || !derivs.length){
      box.innerHTML = head + '<p class="pk-empty">Prakriyā steps are not available for this form.</p>';
      var od0=$("pk-open-drawer"); if(od0) od0.style.display="none";
    } else {
      var body = derivs.map(function(dv, i){
        var t = derivs.length>1 ? '<div class="pk-deriv-title deva">'+esc(dv.t)+'</div>' : "";
        return t + D.stepsHtml(dv.s);
      }).join("");
      box.innerHTML = head + body;
      wireStepsToggles(box);
      $("pk-open-drawer").addEventListener("click", function(){ openStepsDrawer(dv0Steps(derivs), formStr); });
    }
    // also open the drawer paging through the first derivation's steps
    if(derivs && derivs.length) openStepsDrawer(dv0Steps(derivs), formStr);
    setTimeout(function(){ sec.scrollIntoView({behavior:"smooth", block:"nearest"}); }, 40);
  }
  function dv0Steps(derivs){ return decodeSteps(derivs[0].s); }

  function wireStepsToggles(root){
    root.querySelectorAll(".pk-all-steps").forEach(function(cb){
      var ol = cb.closest(".pk-steps-block").querySelector("ol.pk-steps");
      cb.addEventListener("change", function(){ ol.classList.toggle("pk-main-only", !cb.checked); });
    });
  }

  function hidePrakriya(){
    $("prakriya-section").classList.add("hidden");
    state.selKey = null; renderGrid();
  }

  // ---- sutra drawer (pages through steps of the selected form) ----
  function openStepsDrawer(steps, label){
    state.drawer = { steps:steps||[], idx:0, label:label||"" };
    renderDrawer();
    openOverlay("sutra-drawer");
  }
  function renderDrawer(){
    var dw = state.drawer, st = dw.steps[dw.idx];
    if(!st){ $("drawer-body").innerHTML = '<p class="pk-empty">No steps.</p>'; return; }
    $("drawer-code").textContent = st.code;
    var codeHtml = isSutra(st.code)
      ? '<span class="dge-sutra-ref" data-sutra="'+esc(st.code)+'" role="button" tabindex="0">'+esc(st.code)+'</span>'
      : '<span class="dge-sutra-ref pk-code-plain" style="cursor:default">'+esc(st.code)+'</span>';
    var noteChanged = st.changed
      ? '<span class="dr-changed yes">this rule produced the form above</span>'
      : '<span class="dr-changed no">no visible change — marks the form for a later rule</span>';
    $("drawer-body").innerHTML =
      '<div class="dr-form deva">'+esc(st.form||"—")+'</div>'+
      '<div class="dr-pos">'+(dw.label?esc(dw.label)+" · ":"")+'step '+(dw.idx+1)+' of '+dw.steps.length+'</div>'+
      '<div class="dr-codewrap"><div class="lbl">सूत्रम् / rule applied</div>'+codeHtml+'</div>'+
      noteChanged +
      '<p class="dr-hint">Tap the sūtra number above to read its full text, padaccheda and commentary. Use ‹ › to page through every step of this derivation.</p>';
    $("sutra-prev").disabled = dw.idx<=0;
    $("sutra-next").disabled = dw.idx>=dw.steps.length-1;
    $("sutra-prev").style.opacity = dw.idx<=0 ? ".35" : "1";
    $("sutra-next").style.opacity = dw.idx>=dw.steps.length-1 ? ".35" : "1";
  }

  // ---- bottom sheets ----
  var SHEET_TITLES = { krdanta:"कृदन्त", nijanta:"णिचन्तः (causative)", sananta:"सन्नन्तः (desiderative)",
                       yananta:"यङन्तः (intensive)", info:"धातु details" };
  function openSheet(type){
    $("sheet-title").textContent = SHEET_TITLES[type] || type;
    var c = $("sheet-content");
    if(type==="krdanta") return renderKrt(c);
    if(type==="info") return renderInfo(c);
    if(type==="nijanta") return renderSecondary(c, "nich");
    if(type==="sananta") return renderSecondary(c, "san");
    if(type==="yananta") return renderSecondary(c, "yang");
    c.innerHTML = "";
  }
  function renderKrt(c){
    var list = D.krtList(state.d);
    if(!list.length){ c.innerHTML = '<p class="notice sub">No kṛdanta forms in this root’s precompute.</p>'; openOverlay("bottom-sheet"); return; }
    c.innerHTML = '<div class="card-row">' + list.map(function(k){
      var kd = D.KRT[k.k]||k.k, ke = D.KRT_EN[k.k]||"";
      return '<button class="kcard" data-krt="'+esc(k.k)+'">'+
        '<span class="kt"><span class="kd deva">'+esc(kd)+'</span><span>'+esc(k.k)+'</span></span>'+
        '<div class="kf deva">'+esc(k.t)+'</div>'+
        (ke?'<div class="ke">'+esc(ke)+'</div>':'')+
        '</button>';
    }).join("") + '</div><p class="sheet-note">Tap a form to page its prakriyā in the sūtra drawer.</p>';
    c.querySelectorAll(".kcard").forEach(function(b){
      b.addEventListener("click", function(){
        var k = list.filter(function(x){ return x.k===b.dataset.krt; })[0];
        if(k){ closeOverlay("bottom-sheet"); openStepsDrawer(decodeSteps(k.s), (D.KRT[k.k]||k.k)+" · "+k.t); }
      });
    });
    openOverlay("bottom-sheet");
  }
  function renderInfo(c){
    var m = D.meta(state.d), it = state.dpItem || {};
    function block(l,v){ return v ? '<div class="info-block"><div class="il">'+l+'</div><div class="iv deva">'+esc(v)+'</div></div>' : ""; }
    c.innerHTML =
      block("अर्थ · sense", m.artha) +
      block("गण · class", (D.GANA[m.gana]||"")+" ("+m.gana+")") +
      block("पद · voice", m.pada || it.pada) +
      block("सेट् / अनिट्", it.set) +
      block("कर्म · transitivity", it.karma) +
      block("IAST", it.pada_iast ? (it.dhatu_slp+" · "+it.pada_iast) : it.dhatu_slp) +
      block("क्रमाङ्कः · index", state.code);
    openOverlay("bottom-sheet");
    D.lexiconFor(state.code).then(function(lx){
      if(!lx || !lx.meanings) return;
      var mm = lx.meanings, parts=[];
      Object.keys(mm).forEach(function(lang){
        var val = mm[lang]; if(Array.isArray(val)) val = val.join(", ");
        if(val) parts.push('<div class="info-block"><div class="il">'+esc(lang)+'</div><div class="iv">'+esc(val)+'</div></div>');
      });
      if(parts.length) c.insertAdjacentHTML("beforeend", '<div style="margin-top:6px;border-top:1px solid var(--divider);padding-top:12px"><div class="il" style="margin-bottom:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Meanings</div>'+parts.join("")+'</div>');
    }).catch(function(){});
  }
  function renderSecondary(c, sec){
    c.innerHTML = '<p class="loading">Loading '+D.SECONDARY[sec==="nich"?"nich":sec]+' paradigms…</p>';
    openOverlay("bottom-sheet");
    D.loadDhatuforms(state.code).then(function(df){
      var block = df && df.forms && df.forms[sec];
      if(!block || !block.kartari){ c.innerHTML = '<p class="notice sub">These paradigms are not available for this root.</p>'; return; }
      var kar = block.kartari;
      var html = "";
      Object.keys(kar).forEach(function(kkey){
        var val = kar[kkey]; if(!val) return;
        var suffix = kkey.replace(/^[pa]/,"");
        var meta = SECLAK[suffix] || [kkey, ""];
        var forms = String(val).split(";").map(function(x){ return x.split(",")[0].trim(); });
        var cells = "";
        for(var i=0;i<9;i++){ cells += '<div class="sc deva">'+esc(forms[i]||"—")+'</div>'; }
        html += '<div class="sec-lak"><h3 class="deva">'+esc(meta[0])+' <span class="en">'+esc(meta[1])+'</span></h3><div class="sec-grid">'+cells+'</div></div>';
      });
      c.innerHTML = html + '<p class="sheet-note">कर्तरि प्रयोग · 3×3 (प्रथम/मध्यम/उत्तम × एक/द्वि/बहु). Variant forms available on the full-page views.</p>';
    }).catch(function(){ c.innerHTML = '<p class="notice sub">Could not load these paradigms.</p>'; });
  }

  // ---- overlays ----
  function openOverlay(id){ $(id).classList.add("open"); }
  function closeOverlay(id){ $(id).classList.remove("open"); }

  // ---- root search ----
  function fillRootList(){
    if(!state.dp) return;
    var dl = $("root-list");
    dl.innerHTML = state.dp.items.map(function(it){
      return '<option value="'+esc(it.id)+'">'+esc(it.dhatu)+' · '+esc(it.dhatu_slp)+' · '+esc(it.artha||"")+'</option>';
    }).join("");
  }
  function handleRootInput(v){
    v = String(v||"").trim(); if(!v) return;
    var it = state.dp && state.dp.byId[v];
    if(!it && state.dp){
      // try match by dhatu or slp
      it = state.dp.items.filter(function(x){ return x.dhatu===v || x.dhatu_slp===v || x.dhatu_slp.toLowerCase()===v.toLowerCase(); })[0];
    }
    if(it){ location.hash = "#"+it.id; }
  }

  // ---- load a root ----
  function loadCode(code){
    state.code = code;
    state.dpItem = (state.dp && state.dp.byId[code]) || null;
    state.selKey = null; state.lakara = null;
    D.loadRoot(code).then(function(d){
      state.d = d;
      renderHeader(); renderLakaraTabs(); renderGrid(); hidePrakriya();
      $("forms-section").style.display="";
    }).catch(function(){
      state.d = null;
      renderHeader();
      $("lakara-tabs").innerHTML = "";
      $("forms-section").style.display="none";
      var main = $("main-content");
      var it = state.dpItem;
      main.querySelectorAll(".notice").forEach(function(n){ n.remove(); });
      var msg = document.createElement("div");
      msg.className = "notice";
      msg.innerHTML = '<div class="big deva">'+esc(it?it.dhatu:code)+'</div>'+
        '<div class="sub">The step-by-step prakriyā for this root has not been generated yet '+
        '(1,737 of 2,229 roots are precomputed). Its dictionary meta is shown above — try भू or another generated root.</div>';
      main.appendChild(msg);
      hidePrakriya();
    });
  }

  function currentHashCode(){
    var h = (location.hash||"").replace(/^#/,"").trim();
    return /^\d{2}\.\d{4}$/.test(h) ? h : "01.0001";
  }

  // ---- events ----
  $("btn-more").addEventListener("click", function(){ openOverlay("more-menu"); });
  $("btn-close").addEventListener("click", function(){ location.href = "index.html"; });
  $("btn-close-prakriya").addEventListener("click", hidePrakriya);
  document.querySelectorAll("[data-close-more]").forEach(function(e){ e.addEventListener("click", function(){ closeOverlay("more-menu"); }); });
  document.querySelectorAll("[data-close-sutra]").forEach(function(e){ e.addEventListener("click", function(){ closeOverlay("sutra-drawer"); }); });
  document.querySelectorAll("[data-close-sheet]").forEach(function(e){ e.addEventListener("click", function(){ closeOverlay("bottom-sheet"); }); });
  $("sutra-prev").addEventListener("click", function(){ if(state.drawer.idx>0){ state.drawer.idx--; renderDrawer(); } });
  $("sutra-next").addEventListener("click", function(){ if(state.drawer.idx<state.drawer.steps.length-1){ state.drawer.idx++; renderDrawer(); } });
  document.querySelectorAll("[data-action]").forEach(function(b){
    b.addEventListener("click", function(){ closeOverlay("more-menu"); openSheet(b.dataset.action); });
  });
  var ri = $("root-input");
  ri.addEventListener("change", function(){ handleRootInput(ri.value); });
  ri.addEventListener("keydown", function(e){ if(e.key==="Enter") handleRootInput(ri.value); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ ["more-menu","sutra-drawer","bottom-sheet"].forEach(closeOverlay); }
  });
  window.addEventListener("hashchange", function(){
    var c = currentHashCode(); if(c!==state.code){ ri.value=""; loadCode(c); }
  });

  // ---- init ----
  D.loadDhatupatha().then(function(dp){ state.dp = dp; fillRootList(); state.dpItem = dp.byId[state.code]||null; renderHeader(); }).catch(function(){});
  loadCode(currentHashCode());
})();
</script>
