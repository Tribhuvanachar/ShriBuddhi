<!DOCTYPE html><html lang="sa"><head>
<meta charset="UTF-8">
<script src="../../js/vandana-guard.js?v=2"></script>
<script src="../../js/contact-email.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">  <!-- allow pinch-zoom -->
<title>धातुः · संवादः (Bottom-sheet) · DGE</title>
<!-- Indic transliteration, vendored (js/vendor/README.md): the reader's
     script setting and the धातु/कोश word marking both depend on it, so it
     must not be one CDN outage away from silently not working. -->
<script src="../../js/vendor/sanscript-1.3.3.min.js?v=1.3.3"></script>
<link rel="icon" type="image/png" sizes="48x48" href="../../images/genie/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/genie/favicon-192.png">
<link rel="apple-touch-icon" href="../../images/genie/apple-touch-icon.png">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface-2: #f0eeea;
    --ink: #1c1917;
    --ink-soft: #57534e;
    --muted: #a8a29e;
    --accent: #9a3412;          /* warm terracotta / saffron-ish */
    --accent-soft: #fed7aa;
    --accent-bg: #fff7ed;
    --border: #e7e5e4;
    --shadow: 0 8px 30px rgba(28, 25, 23, 0.08);
    --backdrop-1: #1c1917;
    --backdrop-2: #292524;
    --backdrop-3: #44403c;
    --radius: 16px;
    --radius-sm: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 12px);
    --font-sa: "Noto Sans Devanagari", "Inter", system-ui, sans-serif;
    --font-en: "Inter", system-ui, sans-serif;
  }
  /* ---- theme-aware: dark (system default, unless data-theme="light") ---- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f;
      --surface: #201b15;
      --surface-2: #2a241d;
      --ink: #f4ede2;
      --ink-soft: #c3b8a8;
      --muted: #8a7f6f;
      --accent: #e0894f;
      --accent-soft: #5a3418;
      --accent-bg: #2a1c11;
      --border: #362e24;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      --backdrop-1: #0a0806;
      --backdrop-2: #14100c;
      --backdrop-3: #241d15;
    }
  }
  /* ---- explicit dark toggle wins in both directions ---- */
  :root[data-theme="dark"] {
    --bg: #17130f;
    --surface: #201b15;
    --surface-2: #2a241d;
    --ink: #f4ede2;
    --ink-soft: #c3b8a8;
    --muted: #8a7f6f;
    --accent: #e0894f;
    --accent-soft: #5a3418;
    --accent-bg: #2a1c11;
    --border: #362e24;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    --backdrop-1: #0a0806;
    --backdrop-2: #14100c;
    --backdrop-3: #241d15;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--backdrop-1);
    color: var(--ink);
    font-family: var(--font-en);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .deva { font-family: var(--font-sa); }

  /* ========== Breadcrumb bar (over the backdrop) ========== */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
  }
  .top-bar .brand a { color: #f5e6d8; text-decoration: none; font-weight: 600; }
  .top-bar .brand span { color: #c9bcae; }
  .top-bar dge-breadcrumb { font-size: 14px; }

  /* ========== Backdrop (simulates parent page) ========== */
  .page-mock {
    min-height: 100vh;
    background: linear-gradient(160deg, var(--backdrop-1) 0%, var(--backdrop-2) 40%, var(--backdrop-3) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
  }
  .page-mock::before {
    content: "Parent webpage · reader / dictionary context";
    position: absolute;
    top: 52px;
    left: 0; right: 0;
    text-align: center;
    color: #a8a29e;
    font-size: 13px;
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* ========== Dialog shell ========== */
  .dialog {
    width: 100%;
    max-width: 420px;
    max-height: min(92vh, 780px);
    background: var(--bg);
    border-radius: 24px 24px 18px 18px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: slideUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* Header */
  .header {
    padding: 16px 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .dhatu-main {
    flex: 1;
    min-width: 0;
  }
  .dhatu-name {
    font-family: var(--font-sa);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .dhatu-meta {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    align-items: center;
  }
  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .meta-pill strong {
    color: var(--accent);
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--surface-2);
    border-radius: 12px;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:active { background: var(--border); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  .meaning-row {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.4;
  }
  .meaning-row .en { color: var(--ink-soft); font-size: 13px; }

  /* Root search */
  .search-wrap { position: relative; margin-top: 12px; }
  .search-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sa);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); font-family: var(--font-en); }
  .search-results {
    position: absolute;
    left: 0; right: 0; top: calc(100% + 4px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    max-height: 260px;
    overflow-y: auto;
    z-index: 15;
    display: none;
  }
  .search-results.open { display: block; }
  .search-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:active, .search-item.active { background: var(--surface-2); }
  .search-item .si-dhatu { font-family: var(--font-sa); font-size: 15px; font-weight: 600; color: var(--accent); }
  .search-item .si-meta { font-size: 12px; color: var(--muted); }
  .search-item .si-artha { font-family: var(--font-sa); font-size: 12px; color: var(--ink-soft); margin-left: auto; }

  /* Lakāra tabs */
  .lakara-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .lakara-bar::-webkit-scrollbar { display: none; }
  .lakara-tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--surface-2);
    font-family: var(--font-sa);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .lakara-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(154, 52, 18, 0.25);
  }
  .lakara-tab:not(.active):active {
    background: var(--border);
  }

  /* Body */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    -webkit-overflow-scrolling: touch;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* Forms grid */
  .forms-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .form-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    position: relative;
  }
  .form-cell:active { transform: scale(0.97); }
  .form-cell.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
    background: var(--accent-bg);
  }
  .form-cell.no-steps { cursor: default; opacity: 0.9; }
  .form-cell.empty { cursor: default; opacity: 0.5; }
  .form-cell .form-deva {
    font-family: var(--font-sa);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
    word-break: break-word;
  }
  .form-cell .form-deva .alt { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
  .form-cell .form-label {
    margin-top: 3px;
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
  }
  .form-cell.highlight-me {
    animation: pulse 1.2s ease;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    40% { box-shadow: 0 0 0 4px var(--accent-soft); }
  }

  /* Quick info chips */
  .quick-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip .deva { font-family: var(--font-sa); }

  /* Extended menu trigger */
  .more-forms {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .more-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--border);
    background: transparent;
    font-family: var(--font-sa);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .more-btn:active {
    background: var(--surface-2);
    border-color: var(--muted);
  }

  /* "not generated yet" notice */
  .notice {
    margin: 6px 0 12px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
  }
  .notice b { color: var(--ink); }

  /* ========== Bottom sheet: Prakriyā ========== */
  .sheet-overlay {
    position: absolute;
    inset: 0;
    background: rgba(28, 25, 23, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 20;
  }
  .sheet-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 78%;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
    transform: translateY(105%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 21;
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin: 10px auto 6px;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 4px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sheet-title {
    flex: 1;
    font-family: var(--font-sa);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }
  .sheet-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 24px;
  }

  /* steps toggle */
  .pk-steps-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    cursor: pointer;
  }
  .pk-steps-toggle input { accent-color: var(--accent); }

  /* Prakriyā steps */
  .prakriya-step {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    position: relative;
  }
  .prakriya-step:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 11px;
    top: 28px;
    bottom: -8px;
    width: 2px;
    background: var(--border);
  }
  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    z-index: 1;
  }
  .prakriya-step.step-same .step-num { background: var(--surface-2); color: var(--muted); }
  .step-content { flex: 1; min-width: 0; }
  .step-result {
    font-family: var(--font-sa);
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
  }
  .step-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
    line-height: 1.35;
  }
  .prakriya-step.step-same { display: none; }
  .sheet-body.show-all .prakriya-step.step-same { display: flex; }
  /* sūtra reference chip — intellisense.js resolves .dge-sutra-ref on tap */
  .sutra-chip, .dge-sutra-ref.sutra-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    padding: 4px 10px;
    background: var(--surface-2);
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-sa);
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .sutra-chip:active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  /* secondary paradigm (kṛt / ṇic / san …) grid inside sheet */
  .sec-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 4px 0 8px;
  }
  .sec-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 6px;
    text-align: center;
  }
  .sec-cell.tappable { cursor: pointer; }
  .sec-cell.tappable:active { transform: scale(0.97); border-color: var(--accent); }
  .sec-cell .sec-deva { font-family: var(--font-sa); font-size: 15px; font-weight: 600; color: var(--ink); word-break: break-word; }
  .sec-cell .sec-label { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .sec-block-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .sec-krt-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .sec-krt-row:active { background: var(--surface-2); }
  .sec-krt-form { font-family: var(--font-sa); font-size: 16px; font-weight: 600; color: var(--ink); }
  .sec-krt-name { font-family: var(--font-sa); font-size: 13px; color: var(--accent); }
  .sec-krt-en { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* Context menu (krudanta etc.) */
  .ctx-menu {
    position: absolute;
    top: 56px;
    right: 12px;
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 6px;
    min-width: 200px;
    z-index: 40;
    opacity: 0;
    transform: scale(0.94) translateY(-6px);
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .ctx-menu.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .ctx-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    font-family: var(--font-sa);
  }
  .ctx-item:active { background: var(--surface-2); }
  .ctx-item span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    font-family: var(--font-en);
  }

  /* Desktop polish */
  @media (min-width: 520px) {
    .page-mock {
      align-items: center;
      padding: 40px;
    }
    .dialog {
      border-radius: 20px;
      max-height: 760px;
    }
  }

  /* footer */
  .site-footer-links { text-align: center; padding: 14px; color: var(--muted); font-size: 12px; background: transparent; }
  .site-footer-links a, .site-footer-links button {
    color: #c9bcae; text-decoration: none; background: none; border: none;
    font: inherit; cursor: pointer; padding: 0;
  }
  .site-footer-links .footer-sep { margin: 0 6px; color: #8a7f6f; }
</style></head>
<body>
  <div class="top-bar">
    <dge-breadcrumb label="धातुः" deva home-href="../index.html" class="brand"><a href="../index.html" title="DGE Home">⌂ DGE</a><span aria-hidden="true">›</span><span class="deva">धातुः</span></dge-breadcrumb>
  </div>

  <div class="page-mock">
    <div class="dialog" id="dialog" role="dialog" aria-label="धातु विवरण">

      <!-- Header -->
      <header class="header">
        <div class="header-top">
          <div class="dhatu-main">
            <div class="dhatu-name deva" id="dhatuName">…</div>
            <div class="dhatu-meta" id="dhatuMeta"></div>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="moreBtn" aria-label="More forms" title="कृदन्त · णिच् etc.">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
            </button>
            <button class="icon-btn" id="closeBtn" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div class="meaning-row" id="meaningRow"></div>

        <!-- Root search / demo picker -->
        <div class="search-wrap">
          <input type="text" class="search-input" id="rootSearch" autocomplete="off" spellcheck="false"
                 placeholder="Search another root — भू · gam · to go · 01.0001">
          <div class="search-results" id="searchResults"></div>
        </div>
      </header>

      <!-- Lakāra tabs -->
      <nav class="lakara-bar" id="lakaraBar" aria-label="लकाराः"></nav>

      <!-- Body -->
      <div class="body">
        <div class="section-label deva" id="gridLabel"></div>
        <div class="forms-grid" id="formsGrid"></div>
        <div id="notice" class="notice" hidden></div>

        <div class="quick-row" id="quickRow"></div>

        <div class="more-forms">
          <button class="more-btn deva" data-kind="krt">कृदन्ताः</button>
          <button class="more-btn deva" data-kind="nich">णिजन्ताः</button>
          <button class="more-btn deva" data-kind="san">सन्नन्ताः</button>
        </div>
      </div>

      <!-- Overlay + Prakriyā / secondary sheet -->
      <div class="sheet-overlay" id="sheetOverlay"></div>
      <div class="sheet" id="prakriyaSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div style="flex:1; min-width:0">
            <div class="sheet-title deva" id="sheetTitle">…</div>
            <div class="sheet-sub" id="sheetSub">प्रक्रिया · derivation</div>
          </div>
          <button class="icon-btn" id="closeSheet" aria-label="Close sheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>

      <!-- Context menu -->
      <div class="ctx-menu" id="ctxMenu">
        <button class="ctx-item deva" data-kind="krt">कृदन्त रूपाणि<span>kṛt — participles, absolutive, infinitive …</span></button>
        <button class="ctx-item deva" data-kind="nich">णिच् (causative)<span>ṇijanta — भावयति etc.</span></button>
        <button class="ctx-item deva" data-kind="san">सन् (desiderative)<span>sannanta — बुभूषति etc.</span></button>
        <button class="ctx-item deva" data-kind="yang">यङ् (intensive)<span>yaṅanta — बोभूयते etc.</span></button>
        <button class="ctx-item deva" data-kind="yangluk">यङ्लुक् (intensive, no yaṅ)<span>yaṅluganta — बोभवीति etc.</span></button>
      </div>
    </div>
  </div>

  <script src="../../js/dge-shell.js?v=1"></script>
  <script src="../../js/dge-breadcrumb.js?v=1"></script>
  <script src="../../js/dge-nav-rail.js?v=5"></script>

  <script>
  /* =====================================================================
   * dlg1.html — Dhātu conjugation DIALOGUE (Bottom-sheet).
   * Renders entirely from window.DGE_DHATU (the shared precompute adapter);
   * there is NO local forms / prakriyā / sūtra data here.
   * ===================================================================== */
  (function () {
    "use strict";
    var D = window.DGE_DHATU;
    var esc = (D && D.esc) || function (s) { return String(s == null ? "" : s); };
    var DEFAULT_CODE = "01.0001"; // भू

    // ----- element refs ------------------------------------------------
    var elName    = document.getElementById("dhatuName");
    var elMeta    = document.getElementById("dhatuMeta");
    var elMeaning = document.getElementById("meaningRow");
    var elLakBar  = document.getElementById("lakaraBar");
    var elGridLbl = document.getElementById("gridLabel");
    var elGrid    = document.getElementById("formsGrid");
    var elNotice  = document.getElementById("notice");
    var elQuick   = document.getElementById("quickRow");
    var overlay   = document.getElementById("sheetOverlay");
    var sheet     = document.getElementById("prakriyaSheet");
    var sheetTitle= document.getElementById("sheetTitle");
    var sheetSub  = document.getElementById("sheetSub");
    var sheetBody = document.getElementById("sheetBody");
    var ctxMenu   = document.getElementById("ctxMenu");
    var searchIn  = document.getElementById("rootSearch");
    var searchRes = document.getElementById("searchResults");

    // ----- state -------------------------------------------------------
    var curCode = null;   // "NN.NNNN"
    var curRoot = null;   // loaded prakriya doc (d) or null when not generated
    var curItem = null;   // dhatupatha meta item
    var curLak  = null;   // active lakāra key (e.g. "Lat")

    var SUTRA_RE = /^[1-8]\.[1-4]\.\d{1,3}$/;

    // ================================================================
    //  Boot
    // ================================================================
    D.loadDhatupatha().catch(function () { return null; }); // warm cache for search
    window.addEventListener("hashchange", function () { boot(codeFromHash()); });
    boot(codeFromHash());

    function codeFromHash() {
      var h = (location.hash || "").replace(/^#/, "").trim();
      if (!h) return DEFAULT_CODE;
      if (/^\d{2}\.\d{4}$/.test(h)) return h;
      // allow #<devanāgarī root> or #<slp1> as a convenience
      return h; // resolved against dhatupatha in boot()
    }

    function boot(codeOrName) {
      closeSheet();
      D.loadDhatupatha().then(function (dp) {
        var code = codeOrName;
        if (!/^\d{2}\.\d{4}$/.test(code)) {
          var hit = null;
          (dp && dp.items || []).some(function (it) {
            if (it.dhatu === code || (it.dhatu_slp || "").toLowerCase() === code.toLowerCase()) { hit = it; return true; }
            return false;
          });
          code = hit ? hit.id : DEFAULT_CODE;
        }
        curCode = code;
        curItem = (dp && dp.byId && dp.byId[code]) || null;
        loadAndRender(code);
      }, function () {
        curCode = /^\d{2}\.\d{4}$/.test(codeOrName) ? codeOrName : DEFAULT_CODE;
        curItem = null;
        loadAndRender(curCode);
      });
    }

    function loadAndRender(code) {
      renderHeaderMeta();       // from dhatupatha immediately
      // lexicon meaning (best-effort, async)
      D.lexiconFor(code).then(function (lx) { renderMeaning(lx); }, function () { renderMeaning(null); });

      D.loadRoot(code).then(function (d) {
        curRoot = d;
        // dhatu name from the richer prakriya doc if present
        if (d && d.dhatu) elName.textContent = d.dhatu;
        renderHeaderMeta();
        renderConjugation(d);
      }, function () {
        // no prakriyā file for this root
        curRoot = null;
        renderNoPrakriya();
      });
    }

    // ================================================================
    //  Header
    // ================================================================
    function renderHeaderMeta() {
      var name = (curRoot && curRoot.dhatu) || (curItem && curItem.dhatu) || curCode;
      elName.textContent = name;

      var gana = (curRoot && curRoot.gana) || (curItem && curItem.gana);
      var ganaName = gana ? (D.GANA[gana] || "") : "";
      var pada = (curRoot && curRoot.pada) || (curItem && curItem.pada) || "";
      var set = curItem && curItem.set;
      var karma = curItem && curItem.karma;

      var pills = [];
      if (ganaName || gana) {
        pills.push('<span class="meta-pill deva"><strong>' + esc(ganaName) + '</strong>' +
          (gana ? ' · गण ' + esc(String(gana)) : '') + '</span>');
      }
      if (pada)  pills.push('<span class="meta-pill deva">' + esc(pada) + '</span>');
      if (set)   pills.push('<span class="meta-pill">' + esc(set) + '</span>');
      if (karma) pills.push('<span class="meta-pill deva">' + esc(karma) + '</span>');
      pills.push('<span class="meta-pill">' + esc(curCode) + '</span>');
      elMeta.innerHTML = pills.join("");
    }

    function renderMeaning(lx) {
      var en = lx && lx.meanings && lx.meanings.English;
      var artha = (curRoot && curRoot.artha) || (curItem && curItem.artha) || "";
      var parts = [];
      if (en) parts.push(esc(en));
      if (artha) parts.push('<span class="en deva">' + esc(artha) + '</span>');
      elMeaning.innerHTML = parts.join(' · ');
    }

    // ================================================================
    //  Conjugation (lakāra tabs + 3×3 grid)
    // ================================================================
    function renderConjugation(d) {
      elNotice.hidden = true;
      var laks = D.availableLakaras(d);
      if (!laks.length) { renderNoPrakriya(); return; }

      // lakāra tabs
      elLakBar.innerHTML = "";
      laks.forEach(function (l) {
        var b = document.createElement("button");
        b.className = "lakara-tab deva";
        b.dataset.lakara = l;
        b.textContent = D.LAKARA[l] || l;
        b.title = D.LAKARA_EN[l] || "";
        b.addEventListener("click", function () { selectLakara(l); });
        elLakBar.appendChild(b);
      });

      // quick facts
      var qr = [];
      qr.push('<span class="chip deva">पद <b>' + esc((d.pada) || (curItem && curItem.pada) || "—") + '</b></span>');
      if (curItem && curItem.set) qr.push('<span class="chip">' + esc(curItem.set) + '</span>');
      if (curItem && curItem.karma) qr.push('<span class="chip deva">' + esc(curItem.karma) + '</span>');
      qr.push('<span class="chip">' + esc(laks.length) + ' lakāras</span>');
      elQuick.innerHTML = qr.join("");

      selectLakara(laks.indexOf("Lat") >= 0 ? "Lat" : laks[0]);
    }

    function selectLakara(l) {
      curLak = l;
      Array.prototype.forEach.call(elLakBar.children, function (b) {
        b.classList.toggle("active", b.dataset.lakara === l);
      });
      elGridLbl.textContent = (D.LAKARA[l] || l) + " · " + (D.LAKARA_EN[l] || "");
      renderGrid(l);
    }

    function renderGrid(l) {
      elGrid.innerHTML = "";
      var grid = D.gridFor(curRoot, l); // [[{key,p,v,forms|null,hasSteps}×3]×3]
      grid.forEach(function (row) {
        row.forEach(function (cell) {
          var btn = document.createElement("button");
          btn.className = "form-cell";
          var label = (D.PURUSHA_EN[cell.p] || "") + " · " + (D.VACANA_EN[cell.v] || "");
          if (!cell.forms) {
            btn.classList.add("empty");
            btn.innerHTML = '<div class="form-deva">—</div><div class="form-label">' + esc(label) + '</div>';
          } else {
            var primary = cell.forms[0];
            var alt = cell.forms.length > 1 ? cell.forms.slice(1).join(" · ") : "";
            btn.innerHTML = '<div class="form-deva">' + esc(primary) +
              (alt ? '<span class="alt">' + esc(alt) + '</span>' : '') +
              '</div><div class="form-label">' + esc(label) + '</div>';
            if (cell.hasSteps) {
              btn.addEventListener("click", function () {
                Array.prototype.forEach.call(elGrid.children, function (c) { c.classList.remove("selected"); });
                btn.classList.add("selected");
                openPrakriya(cell.key, primary);
              });
            } else {
              btn.classList.add("no-steps");
            }
          }
          elGrid.appendChild(btn);
        });
      });
    }

    function renderNoPrakriya() {
      elLakBar.innerHTML = "";
      elGrid.innerHTML = "";
      elGridLbl.textContent = "";
      elQuick.innerHTML = "";
      var name = (curItem && curItem.dhatu) || curCode;
      elNotice.hidden = false;
      elNotice.innerHTML = 'The full conjugation for <b class="deva">' + esc(name) + '</b> (' + esc(curCode) +
        ') has not been generated yet.<br>Its dhātupāṭha meta is shown above. ' +
        '1,737 of 2,229 roots currently have a prakriyā precompute.';
    }

    // ================================================================
    //  Bottom sheet — prakriyā (per form, on demand via stepsFor)
    // ================================================================
    function openPrakriya(key, form) {
      var entries = D.stepsFor(curRoot, key); // [{t, s:[[code, formAfter?], ...]}]
      sheetTitle.textContent = form;
      sheetSub.textContent = "प्रक्रिया · derivation";
      if (!entries || !entries.length) {
        sheetBody.innerHTML = '<div class="notice">No derivation recorded for this form.</div>';
        openSheet();
        return;
      }
      sheetBody.innerHTML = renderStepsHtml(entries[0].s || []);
      wireStepsToggle();
      openSheet();
    }

    // delta-encoded steps -> timeline HTML. Each s-item is [sūtraCode, formAfter?];
    // carry the last visible form forward. Sūtra codes become .dge-sutra-ref
    // spans so the loaded intellisense.js makes them tappable (sūtra popover).
    function renderStepsHtml(s) {
      var last = "";
      var anySame = false, n = 0;
      var rows = s.map(function (st) {
        var code = st[0];
        var changed = st.length > 1;
        if (changed) { last = st[1]; n++; } else { anySame = true; }
        var isSutra = SUTRA_RE.test(code);
        var chip = isSutra
          ? '<span class="dge-sutra-ref sutra-chip deva" data-sutra="' + esc(code) + '" role="button" tabindex="0">सूत्र ' + esc(code) + '</span>'
          : '<span class="sutra-chip deva">' + esc(code) + '</span>';
        var num = changed ? String(n) : '·';
        return '<div class="prakriya-step ' + (changed ? 'step-changed' : 'step-same') + '">' +
          '<div class="step-num">' + num + '</div>' +
          '<div class="step-content">' +
            '<div class="step-result deva">' + esc(last) + '</div>' +
            (changed ? '' : '<div class="step-note">no visible change — this rule marks the form for a later step</div>') +
            chip +
          '</div></div>';
      }).join("");
      var toggle = anySame
        ? '<label class="pk-steps-toggle"><input type="checkbox" id="pkAllSteps"> Show every step, including ones with no visible change</label>'
        : '';
      return toggle + rows;
    }

    function wireStepsToggle() {
      var cb = document.getElementById("pkAllSteps");
      if (cb) cb.addEventListener("change", function () {
        sheetBody.classList.toggle("show-all", cb.checked);
      });
    }

    // ================================================================
    //  Bottom sheet — secondary forms (kṛt / ṇic / san / yaṅ / yaṅluk)
    // ================================================================
    function openSecondary(kind) {
      if (kind === "krt") { openKrt(); return; }
      sheetTitle.textContent = (D.SECONDARY && D.SECONDARY[kind]) || kind;
      sheetSub.textContent = "secondary paradigm";
      sheetBody.classList.remove("show-all");
      sheetBody.innerHTML = '<div class="notice">Loading…</div>';
      openSheet();
      D.loadDhatuforms(curCode).then(function (df) {
        var forms = df && df.forms && df.forms[kind];
        if (!forms) {
          sheetBody.innerHTML = '<div class="notice">No ' + esc(kind) + ' forms generated for this root yet.</div>';
          return;
        }
        sheetBody.innerHTML = renderSecondary(forms);
      }, function () {
        sheetBody.innerHTML = '<div class="notice">Could not load secondary forms.</div>';
      });
    }

    // forms = { kartari|karmani : { <lakaraKey> : "f;f;f;…" (9 forms) } }
    function renderSecondary(forms) {
      var voices = Object.keys(forms);
      // prefer active (kartari) present tense; fall back to whatever exists
      var html = "";
      voices.forEach(function (voice) {
        var block = forms[voice];
        var presentKey = block["plat"] ? "plat" : (block["alat"] ? "alat" : Object.keys(block)[0]);
        if (!presentKey) return;
        var cells = String(block[presentKey] || "").split(";");
        html += '<div class="sec-block-label">' + esc(voice) + ' · present (लट्)</div>';
        html += '<div class="sec-grid">';
        for (var i = 0; i < 9; i++) {
          var p = Math.floor(i / 3), v = i % 3;
          var label = (D.PURUSHA_EN[p] || "") + " · " + (D.VACANA_EN[v] || "");
          var f = (cells[i] || "").replace(/,/g, " · ").trim() || "—";
          html += '<div class="sec-cell"><div class="sec-deva">' + esc(f) + '</div>' +
                  '<div class="sec-label">' + esc(label) + '</div></div>';
        }
        html += '</div>';
      });
      return html || '<div class="notice">No forms available.</div>';
    }

    function openKrt() {
      sheetTitle.textContent = "कृदन्ताः";
      sheetSub.textContent = "kṛt — participles & derivatives";
      sheetBody.classList.remove("show-all");
      if (!curRoot) { sheetBody.innerHTML = '<div class="notice">Conjugation not generated for this root yet.</div>'; openSheet(); return; }
      var krt = D.krtList(curRoot); // [{t,k,s}]
      if (!krt.length) { sheetBody.innerHTML = '<div class="notice">No kṛdanta forms recorded.</div>'; openSheet(); return; }
      var html = krt.map(function (it, i) {
        return '<div class="sec-krt-row" data-krt="' + i + '">' +
          '<span class="sec-krt-form deva">' + esc(it.t) + '</span>' +
          '<span class="sec-krt-name deva">' + esc((D.KRT && D.KRT[it.k]) || it.k) + '</span>' +
          '<span class="sec-krt-en">' + esc((D.KRT_EN && D.KRT_EN[it.k]) || "") + '</span>' +
          '</div>';
      }).join("");
      sheetBody.innerHTML = html;
      Array.prototype.forEach.call(sheetBody.querySelectorAll(".sec-krt-row"), function (row) {
        row.addEventListener("click", function () {
          var it = krt[+row.dataset.krt];
          if (it && it.s) {
            sheetTitle.textContent = it.t;
            sheetSub.textContent = ((D.KRT && D.KRT[it.k]) || it.k) + " · प्रक्रिया";
            sheetBody.innerHTML = renderStepsHtml(it.s);
            wireStepsToggle();
          }
        });
      });
      openSheet();
    }

    // ================================================================
    //  Sheet open/close
    // ================================================================
    function openSheet() { overlay.classList.add("open"); sheet.classList.add("open"); }
    function closeSheet() { overlay.classList.remove("open"); sheet.classList.remove("open"); }
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    overlay.addEventListener("click", closeSheet);

    // ================================================================
    //  Context menu + more buttons
    // ================================================================
    var moreBtn = document.getElementById("moreBtn");
    moreBtn.addEventListener("click", function (e) { e.stopPropagation(); ctxMenu.classList.toggle("open"); });
    document.addEventListener("click", function () { ctxMenu.classList.remove("open"); });
    ctxMenu.addEventListener("click", function (e) { e.stopPropagation(); });
    Array.prototype.forEach.call(ctxMenu.querySelectorAll(".ctx-item"), function (it) {
      it.addEventListener("click", function () { ctxMenu.classList.remove("open"); openSecondary(it.dataset.kind); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".more-btn"), function (b) {
      b.addEventListener("click", function () { openSecondary(b.dataset.kind); });
    });

    // ================================================================
    //  Root search (from dhatupatha)
    // ================================================================
    var searchTimer = null;
    searchIn.addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 120);
    });
    searchIn.addEventListener("focus", function () { if (searchIn.value.trim()) runSearch(); });
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".search-wrap")) searchRes.classList.remove("open");
    });

    function runSearch() {
      var q = searchIn.value.trim();
      if (!q) { searchRes.classList.remove("open"); return; }
      D.loadDhatupatha().then(function (dp) {
        var items = (dp && dp.items) || [];
        var qlc = q.toLowerCase();
        var qdev = "";
        try { if (window.Sanscript && /[a-zA-Z]/.test(q)) qdev = window.Sanscript.t(q.toLowerCase(), "iast", "devanagari"); } catch (e) {}
        var hits = items.filter(function (it) {
          return (it.dhatu && it.dhatu.indexOf(q) >= 0) ||
                 (qdev && it.dhatu && it.dhatu.indexOf(qdev) >= 0) ||
                 (it.dhatu_slp && it.dhatu_slp.toLowerCase().indexOf(qlc) >= 0) ||
                 (it.id && it.id.indexOf(q) >= 0) ||
                 (it.artha && it.artha.indexOf(q) >= 0);
        }).slice(0, 12);
        if (!hits.length) {
          searchRes.innerHTML = '<div class="search-item" style="cursor:default"><span class="si-meta">no matching root</span></div>';
          searchRes.classList.add("open");
          return;
        }
        searchRes.innerHTML = hits.map(function (it) {
          return '<button class="search-item" data-id="' + esc(it.id) + '">' +
            '<span class="si-dhatu">' + esc(it.dhatu) + '</span>' +
            '<span class="si-meta">' + esc((D.GANA[it.gana] || "") + " · " + it.id) + '</span>' +
            '<span class="si-artha">' + esc(it.artha || "") + '</span>' +
            '</button>';
        }).join("");
        searchRes.classList.add("open");
        Array.prototype.forEach.call(searchRes.querySelectorAll(".search-item[data-id]"), function (b) {
          b.addEventListener("click", function () {
            searchRes.classList.remove("open");
            searchIn.value = "";
            location.hash = b.dataset.id; // triggers hashchange -> boot()
          });
        });
      });
    }

    // ================================================================
    //  Close button (demo: this is a modal over the reader)
    // ================================================================
    document.getElementById("closeBtn").addEventListener("click", function () {
      var dlg = document.getElementById("dialog");
      dlg.style.transition = "opacity .28s, transform .28s";
      dlg.style.opacity = "0";
      dlg.style.transform = "translateY(20px)";
      setTimeout(function () {
        dlg.style.opacity = ""; dlg.style.transform = "";
        alert("Dialog dismissed — in the reader this closes the conjugation modal.");
      }, 300);
    });
  })();
  </script>
