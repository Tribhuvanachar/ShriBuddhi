# Kamadhenu — Experiment A: first IndicF5 fine-tune on the pilot set (Phase 12; this file is Phase 8's output).
# Read by launch_experiment_a.sh and dry_run.py. Nothing here runs by itself; the launcher needs HF_TOKEN and a
# GPU box, and is only to be started after the project lead approves kamadhenu/docs/EXPERIMENT_A_CARD.md.
experiment:
  name: kamadhenu_exp_a
  purpose: >
    Voice-steering fine-tune of IndicF5 on 123 grade-A verses of the lead's own recitation (0.6 h), to see whether
    a few thousand updates turn the garbled zero-shot chant (7 Sep diagnostics, clip D) into intelligible Sanskrit
    in his voice. Success is judged by ear on the 13 held-out verses, A/B against the zero-shot base.
  seed: 666                       # trainer's resumable_with_seed (dataset batch order)

base_model:
  repo: ai4bharat/IndicF5         # MIT weights; gated with auto-accept — HF_TOKEN must have accepted the gate
  weights: model.safetensors      # 1.40 GB, flat EMA state dict (see ckpt_convert.py)
  vocab: checkpoints/vocab.txt    # must equal kamadhenu/training/vocab_indicf5.txt (sha1 below) or the run stops
  vocab_sha1: b46bed8e96ab36df291f8668d64460fd74a398c3
  code_repo: https://github.com/ai4bharat/IndicF5.git
  code_commit: 13f7c4d627cc10111aea8fe9c0039462cacacdc7   # the commit the Space runs (tools/kamadhenu/space/requirements.txt)

model:                            # F5TTS_Base — the only architecture finetune_cli.py in that commit builds
  exp_name: F5TTS_Base
  arch: {dim: 1024, depth: 22, heads: 16, ff_mult: 2, text_dim: 512, conv_layers: 4}
  mel_spec: {target_sample_rate: 24000, n_mel_channels: 100, hop_length: 256, win_length: 1024, n_fft: 1024, mel_spec_type: vocos}
  tokenizer: custom               # → vocab.txt in the dataset dir (2,545 entries; space is index 0)

dataset:
  name: kamadhenu_pilot           # wandb project name / ckpt naming only
  train_jsonl: kamadhenu/data/pilot/train.jsonl
  eval_jsonl: kamadhenu/data/pilot/validation.jsonl
  export_dir: kamadhenu_dataset/processed/audio/f5/kamadhenu_pilot_char   # export_f5_dataset.py --arrow
  text_convention: vagdhenu_model_text   # kamadhenu_text.model_text: daṇḍa/digits dropped, hyphen joins, one space per pāda break
  peak_dbfs: -3.0

training:
  learning_rate: 1.0e-5           # finetune_cli.py default; F5 community fine-tunes use 1e-5 … 5e-5
  batch_size_type: frame
  batch_size_per_gpu:             # frames per optimiser step, from finetune_cli.py's own table; pick by VRAM
    16GB: 2000                    # T4, RTX 4060 Ti 16 GB
    24GB: 3200                    # L4, A10G, RTX 3090/4090
    40GB: 6400                    # A100 40 GB
  max_samples: 64
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  target_updates: 3000            # "a few thousand steps" (MODEL_SELECTION.md); epochs derived from batches/epoch by dry_run.py
  num_warmup_updates: 300         # 10 % of the run
  save_per_updates: 500           # model_<step>.pt for the A/B — each is 5.6 GB (weights+EMA+optimiser), prune after export
  last_per_steps: 250             # model_last.pt cadence: the resume point, and the most a crash can lose (~4 min on an A10G)
  mixed_precision: bf16           # accelerate launch --mixed_precision (KAMADHENU_PRECISION); fp16 + GradScaler diverged on attempt 3
  use_ema: true                   # trainer default; the launcher exports BOTH ema and online weights (README §3 of F5's train notes)
  logger: tensorboard             # no wandb account needed
  max_minutes: 150                # wall-clock cap (`timeout`) on the training loop; KAMADHENU_MAX_MINUTES overrides; a re-run resumes

evaluation:                       # render_eval.py, after export
  reference: tp_anushtubh_19      # the lead's own clip from tools/kamadhenu/space/refs (also the Space's default)
  seed: 60
  nfe_step: 32
  cfg_strength: 2.0
  compare_against: zero-shot IndicF5 with the same reference, same seed (clip D of the 7 Sep diagnostics)
  metric_first: duration ratio generated/recorded per held-out verse (1.0 ± 0.25 is on-tempo), then the lead's ear

outputs:
  work_dir: ${KAMADHENU_WORK:-~/kamadhenu_exp_a}
  ckpt_dir: ${work_dir}/ckpt
  export_dir: ${work_dir}/export/kamadhenu_voice_a     # model.safetensors (EMA), model_online.safetensors, vocab.txt, card.json
  eval_dir: ${work_dir}/eval                            # 13 × (base.wav, finetuned.wav, finetuned_online.wav) + eval.json
  keep: [export_dir, eval_dir, "${ckpt_dir}/model_last.pt", "${ckpt_dir}/train.log"]

approval:                         # 7 Sep 2026, 6:20 pm IST — the lead: "approved cap 185, 24 gb"
  cap_inr: 185
  vram: 24GB
  where: Hugging Face Jobs on the lead's account (hf_job.py + .github/workflows/kamadhenu-experiment-a.yml)
  flavor: l4x1                    # 1× L4 24 GB, $0.80/h, 8 vCPU, 30 GB RAM, 400 GB disk
  image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel   # torch 2.8.0 = the Space's stack; the first attempt on 2.4.1 died in pip (x-transformers 2.19.7), ~₹1
  job_timeout_minutes: 135        # attempt 3 (7 Sep, ~8 pm IST): attempts 1+2 spent ~18 RUNNING min ≈ ₹21, so 135 min ($1.80 ≈ ₹158) keeps the total under ₹185
  train_cap_minutes: 90           # inside the job; leaves ~45 min for setup, export, 39 renders and the upload
  attempts: ["1: pip could not resolve x-transformers on torch 2.4.1 (1 min)", "2: EMA state dict key layout (ema_model._orig_mod.*, vocoder.*) — converter fixed, strict verify added (17 min)",
             "4: bf16, timeout 55 / cap 25 — HEALTHY: 3,060 updates in 20.5 min, loss 0.73→0.66 (window means), 0 NaN; real A/B renders; 40.8 min ≈ ₹48; total ≈ ₹154",
             "3: COMPLETED mechanically (72 min ≈ ₹85: 3,060 updates in 15.5 min = 0.3 s/update, 4× faster than assumed) but fp16 training reported loss=nan from step 1 and the weights were NaN by step ~320; the 'fine-tuned' renders are full-scale noise (rms 1.0). Base renders are good (median duration ratio 0.86, 11/13 on tempo). Attempt 4: bf16, timeout 55, train cap 25 → worst case ₹65 more, total under ₹185"]
  results_repo: SarvamulaOrg/kamadhenu-voice-a   # private; export/ eval/ train.log
