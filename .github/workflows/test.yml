name: Tests

# The project's only general-purpose CI gate. Every other workflow here is
# workflow_dispatch (a specific ingestion/import pipeline someone runs by
# hand) or a narrow auto-trigger scoped to its own output paths -- none of
# them run the actual test suites on an ordinary push. This one does:
# the Python suite (tests/), the standalone offline import tests under
# tools/, the plain-Node JS tests (no framework, no build step -- this
# project's own convention), tools/validate_data.py's structural corpus
# check, tools/validate_gold_standard.py's V1-V7 gate over any
# format:gold_v2_2 commentary already in data/, and the generated-file
# drift gates (frontend shell, sitemap.xml/robots.txt) that fail if their
# source changed without regenerating the committed output.
#
# tools/darshanas/test_darshanas.py is deliberately NOT run here: it syncs
# and writes taxonomy.json/library.json as a side effect (a migration
# script, not a repeatable test), which a CI gate must never do.

on:
  push:
    # Only main, and only PRs into it.
    #
    # Most branches in this repo are not code at all -- they are data that
    # tools READ and that never merges: ocr-staging/** (staged OCR awaiting
    # review), the *-dist branches behind the CDN, gemini-enrich/**,
    # nightly/**, and buddhi-archive/** (frozen snapshots of the public
    # repo's deleted branches, in the pre-migration dge/ layout). Each is
    # branched from whatever main was at the time, so it carries whatever
    # bugs main had then -- pushing one data file to it re-runs the whole
    # suite against months-old code and fails by construction. That is where
    # the failure mails were coming from, and a green or red run on such a
    # branch would mean nothing either way.
    #
    # A feature branch still gets the gate the moment it opens a pull
    # request, which is the point at which its code could reach main.
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_sitemap.py's --check gate below derives each URL's
          # lastmod from real git history; a shallow (depth-1) checkout
          # has no history to derive it from -- its one boundary commit
          # looks like it "added" every file, which would make every
          # lastmod collapse to today's date and never match sitemap.xml
          # as committed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # numpy: tests/test_transcript_crossmatch.py imports the Kamadhenu
      # exporter; indic-transliteration: tools/seo/taxonomy.py's IAST labels.
      # Without them pytest stopped at collection and every later step here
      # (validators, drift gates) never ran — main was red for the wrong reason.
      - run: pip install pytest beautifulsoup4 requests pyyaml numpy indic-transliteration openpyxl

      - name: Python test suite (tests/)
        run: python3 -m pytest tests/ -q

      - name: Dvaita Vedanta parser tests
        run: python3 tools/dvaitavedanta/test_dv_parse.py

      - name: Dvaita Vedanta offline import tests
        run: python3 tools/dvaitavedanta/test_import_offline.py

      - name: Dvaita Vedanta pytest suite (fold/stitch tools)
        run: python3 -m pytest tools/dvaitavedanta/ -q

      - name: Sayana/Smriti/wikisource parser tests
        run: python3 -m pytest tools/sayana_smriti/tests/ -q

      - name: set_site_url tests
        run: python3 tools/test_set_site_url.py

      - name: build_sitemap tests
        run: python3 tools/test_build_sitemap.py

      - name: JS -- search resilience
        run: node js/test-search-resilience.js

      - name: JS -- JS/Python normalizer parity
        run: node js/test-parity.js

      - name: JS -- body-text sanitiser
        run: node js/test-sanitize.js

      - name: JS -- Gold-Standard renderer
        run: node js/test-gold-render.js

      - name: JS -- audio detection
        run: node tools/audio_admin/test-audio-detect.js

      - name: Commentary formatter is deterministic (format_commentary.py)
        # Runs on every incoming OCR document, so it must be offline and give
        # the same answer every time. The suite asserts both, and asserts the
        # cases section 29 says must NOT become pratikas.
        run: python3 -m pytest tests/test_format_commentary.py -q

      - name: Every data.json is strict JSON (normalize_data_json.py --check)
        # The browser's JSON.parse is strict, so a raw line break inside a
        # string is a page that will not load. Content editors work these files
        # in a text editor where a line break IS the Enter key, so the fix is
        # the pre-commit hook that escapes it; this is the backstop for a clone
        # that never installed the hook.
        run: python3 tools/normalize_data_json.py --check --all --quiet

      - name: data.json is in canonical shape (format_data_json.py --check)
        # One unit per line. Not cosmetics: on a single-line file GitHub shows
        # no diff at all, so a content pull request cannot be reviewed, and the
        # first one we received went in unread.
        run: python3 tools/format_data_json.py --check --all --quiet

      - name: Corpus structural check (validate_data.py)
        run: python3 tools/validate_data.py

      - name: Gold-Standard contract gate (validate_gold_standard.py)
        run: python3 tools/validate_gold_standard.py --scan-corpus --data data

      - name: Frontend redesign -- shared-chrome regression guard
        run: python3 tools/redesign/audit_pages.py --check

      - name: Frontend redesign -- baked shell drift gate (build_shell.py)
        run: python3 tools/redesign/build_shell.py --check

      - name: sitemap.xml / robots.txt drift gate (build_sitemap.py)
        run: |
          # On drift, show WHAT drifted — the gate kept failing with no
          # clue while local --check passed at the same commit.
          if ! python3 tools/build_sitemap.py --check; then
            python3 tools/build_sitemap.py
            git --no-pager diff --stat sitemap.xml
            git --no-pager diff sitemap.xml | head -80
            exit 1
          fi

      - name: Names audit (audit_names.py — report only until the backlog is cleared)
        # docs/NAMING_CONVENTIONS.md. Writes the counts into the run summary;
        # switch to --strict once the HARD findings it lists are fixed.
        run: python3 tools/audit_names.py

      - name: Corpus is Unicode NFC (normalize_nfc.py)
        # Kannada vowel signs were stored decomposed -- the same syllable as
        # three codepoints instead of one. Identical on screen, different
        # bytes, so search missed, dedup missed, and diffs between editions
        # showed changes that were not there. 67,841 items, mostly itihasa.
        # NFC is canonical: Unicode requires the two to render identically.
        run: python3 tools/normalize_nfc.py --check

      - name: Enrichment sidecars name a live grantha (check_sidecars.py)
        # Every enrichment layer is a file named after the grantha's PATH.
        # Move a work, and the sidecar keeps the old name, the reader's fetch
        # 404s, and the feature switches itself off with no error anywhere.
        # Two restructures did exactly that: citation references and commentary
        # sandhi sat at 0% live coverage holding 3,665 units of good data,
        # while the tools that built them had long since been updated to the
        # new paths. Nothing noticed, because nothing was looking.
        run: python3 tools/check_sidecars.py

      - name: Repo inventory drift gate (build_repo_inventory.py)
        # Every workflow file must have a classified entry in
        # admin/config/repo-map.json, and the generated fields (inputs,
        # triggers, secrets) must match the yml — otherwise the admin page's
        # Repository & Workflows tab shows a stale form.
        run: python3 tools/build_repo_inventory.py --check
