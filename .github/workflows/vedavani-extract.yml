name: VedaVaNi audio extract

on:
  workflow_dispatch:
    inputs:
      veda:
        description: "Which Veda to fetch"
        required: true
        default: rigveda
        type: choice
        options:
          - rigveda
          - yajurveda
          - both
      patha:
        description: "Rigveda only — reciter"
        required: true
        default: kanchi
        type: choice
        options:
          - kanchi
          - sringeri
          - both
      mandalas:
        description: 'Rigveda only, e.g. "1" or "1-3" or "1,5,9" (default: mandala 1 only — keep this small for a test run, the full Rigveda is 1028 suktas x up to 2 pathas)'
        required: true
        default: "1"
      yajurveda_part:
        description: "Yajurveda only — which section"
        required: true
        default: samhita
        type: choice
        options:
          - samhita
          - brahmanam
          - aranyaka
          - all
      dry_run:
        description: "Dry run — print the URL/slice plan, download and write nothing"
        required: true
        default: true
        type: boolean
      open_pr:
        description: "Push the downloaded/sliced output to the Dhvani audio repository (ignored if dry_run is true)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract vedavani-assets.zip
        run: |
          mkdir -p vedavani-assets-extracted
          unzip -q -o vedavani-assets.zip -d vedavani-assets-extracted
          ls vedavani-assets-extracted/assets
      - name: Run extraction (${{ inputs.veda }}, dry_run=${{ inputs.dry_run }})
        run: |
          python tools/vedavani/extract_audio.py \
            --veda "${{ inputs.veda }}" \
            --patha "${{ inputs.patha }}" \
            --mandalas "${{ inputs.mandalas }}" \
            --yajurveda-part "${{ inputs.yajurveda_part }}" \
            --out-dir vedavani_audio_out \
            $( [ "${{ inputs.dry_run }}" = "true" ] && echo --dry-run )
      - name: Report output size
        if: ${{ !fromJSON(inputs.dry_run) }}
        run: |
          du -sh vedavani_audio_out || true
          find vedavani_audio_out -type f | wc -l
      - name: Upload output as workflow artifact
        if: ${{ !fromJSON(inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: vedavani-audio-${{ inputs.veda }}-${{ github.run_id }}
          path: vedavani_audio_out
          retention-days: 14

      # Audio does not belong in ShriBuddhi (text) or ParaBuddhi (raw text/OCR). It goes to Dhvani, the audio
      # repository, in a folder named like the archive.org item it will eventually become; the audio
      # archive workflow (archive-upload.yml) then sends that folder to archive.org's AUDIO account.
      - name: Push the audio to the Dhvani repository
        if: ${{ !fromJSON(inputs.dry_run) && fromJSON(inputs.open_pr) }}
        env:
          DHVANI_TOKEN: ${{ secrets.DHVANI_TOKEN }}
          VEDA: ${{ inputs.veda }}
          PATHA: ${{ inputs.patha }}
        run: |
          set -euo pipefail
          test -n "$DHVANI_TOKEN" || { echo "::error::DHVANI_TOKEN is not set (a token with Contents read/write on Tribhuvanachar/Dhvani). The audio is kept as the workflow artifact above for 14 days."; exit 2; }
          ID="vedavani_${VEDA}"
          [ "$VEDA" = "rigveda" ] && ID="vedavani_rigveda_${PATHA}"
          git clone --depth 1 "https://x-access-token:${DHVANI_TOKEN}@github.com/Tribhuvanachar/Dhvani.git" "$RUNNER_TEMP/dhvani"
          mkdir -p "$RUNNER_TEMP/dhvani/$ID"
          cp -r vedavani_audio_out/. "$RUNNER_TEMP/dhvani/$ID/"
          cd "$RUNNER_TEMP/dhvani"
          git config user.name "dhvani-bot"; git config user.email "noreply@anthropic.com"
          git add -A "$ID"
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "audio: VedaVaNi ${VEDA} (${ID})"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done
          echo "::error::could not push to Dhvani"; exit 1
          # Next: archive-upload.yml with identifier=$ID, source_repo=Tribhuvanachar/Dhvani, source_dir=$ID
