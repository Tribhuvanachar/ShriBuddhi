# .github/workflows/import-dasa-sahitya.yml
# DGE — build the Dasa Sahitya (Dasara Padagalu / Suladi / Ugabhoga) corpus.
#
# Manual "Run workflow" button. Fetches the public Haridasa-sahitya archives,
# builds the structured corpus under data/Tattvavada/Itara/DasaSahitya/, and opens a PR.
# (Fetch runs here on Actions — the network egress the Cowork sandbox lacks.)
name: Import Dasa Sahitya

on:
  workflow_dispatch:
    inputs:
      limit_per_index:
        description: "Cap compositions per index (blank = all; use 2 for a smoke test)"
        required: false
        default: ""
      delay:
        description: "Seconds between requests (politeness)"
        required: false
        default: "1.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/dasa_sahitya/requirements.txt

      - name: Run importer
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit_per_index }}" ]; then
            ARGS="--limit-per-index ${{ inputs.limit_per_index }}"
          fi
          python tools/dasa_sahitya/import_dasa_sahitya.py \
            --config tools/dasa_sahitya/dasa_sources.json \
            --out data/Tattvavada/Itara/DasaSahitya \
            --cache .dasa_cache \
            --delay ${{ inputs.delay }} \
            --fetch-date "$(date -u +%F)" \
            $ARGS

      - name: Show summary
        run: |
          echo "### Dasa Sahitya import" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          m = json.load(open("data/Tattvavada/Itara/DasaSahitya/index.json"))
          print(f"- Total compositions: **{m['count_total']}**")
          print(f"- By form: `{m['counts_by_form']}`")
          print(f"- Composers: **{len(m['composers'])}**")
          PY

      - name: Land the importer's output in ParaBuddhi first
        env:
          PARABUDDHI_TOKEN: ${{ secrets.PARABUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          git status --porcelain -uall data | sed 's/^...//' > "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo "the importer wrote nothing; nothing to land"; exit 0; fi
          test -n "$PARABUDDHI_TOKEN" || { echo "::error::PARABUDDHI_TOKEN is not set. What this importer produced must land in ParaBuddhi before a pull request is opened from it."; exit 2; }
          git clone --depth 1 "https://x-access-token:${PARABUDDHI_TOKEN}@github.com/Tribhuvanachar/ParaBuddhi.git" "$RUNNER_TEMP/pb"
          # These importers fetch and transform in one pass, so what can be kept is their first output
          # (before any stitching into the library), not the bytes the site sent.
          python3 tools/watch/dump_to_parabuddhi.py --pb "$RUNNER_TEMP/pb" --id "dasa_sahitya" --files-from "$RUNNER_TEMP/changed.txt" \
            --note "Dasa Sahitya importer output"

      - name: Create Pull Request (against ShriBuddhi)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: import/refresh Dasa Sahitya corpus"
          branch: import/dasa-sahitya
          delete-branch: true
          title: "Import Dasa Sahitya (Dasara Padagalu / Suladi / Ugabhoga)"
          body: |
            Auto-generated by `import-dasa-sahitya.yml`.

            Adds/refreshes `data/Tattvavada/Itara/DasaSahitya/` — padas, suladis and ugabhogas
            from the public Haridasa-sahitya archives. Non-commercial, dharma-prachara.
            Review the diff, then merge. Remember to add the `Tattvavada/Itara/DasaSahitya` node to
            `taxonomy.json` (see tools/dasa_sahitya/dge_integration/) if not already present.
          add-paths: |
            data/Tattvavada/Itara/DasaSahitya/**
