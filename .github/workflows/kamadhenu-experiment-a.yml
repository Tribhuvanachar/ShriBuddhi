# Kamadhenu — Experiment A on a Hugging Face Job (approved by the project lead 7 Sep 2026: cap ₹185, 24 GB class).
# Submits the job (kamadhenu/training/hf_job.py → launch_experiment_a.sh on a 1× L4 24 GB, $0.80/h, killed at the
# timeout so the worst case is ₹176), streams its log here, then downloads the 13 A/B renders + train log as an
# artifact. Needs the HF_TOKEN secret (write token of the account that accepted the ai4bharat/IndicF5 gate and has
# credit for Jobs). workflow_dispatch only — nothing here runs on a schedule.
name: Kamadhenu — Experiment A (HF Job)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "HF Jobs hardware (l4x1 = L4 24 GB $0.80/h; a10g-small = A10G 24 GB $1.00/h)"
        required: true
        default: "l4x1"
      timeout_minutes:
        description: "job kill time (bills at most this × rate)"
        required: true
        default: "150"
      train_cap_minutes:
        description: "training-loop cap inside the job (leave room for export + renders + upload)"
        required: true
        default: "100"
      cap_inr:
        description: "approved cap in ₹ — the submit step refuses a worst case above it"
        required: true
        default: "185"
      results_repo:
        description: "private Hub repo that receives export/ eval/ train.log"
        required: true
        default: "SarvamulaOrg/kamadhenu-voice-a"
      precision:
        description: "mixed precision for the trainer (bf16 | fp16 | no) — fp16 diverged to NaN on attempt 3"
        required: true
        default: "bf16"

permissions:
  contents: read

jobs:
  experiment-a:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "huggingface_hub>=1.0"
      - name: Submit the job
        id: submit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
          python3 kamadhenu/training/hf_job.py submit --flavor "${{ inputs.flavor }}" \
            --timeout-minutes "${{ inputs.timeout_minutes }}" --train-cap-minutes "${{ inputs.train_cap_minutes }}" \
            --cap-inr "${{ inputs.cap_inr }}" --commit "${{ github.sha }}" --results-repo "${{ inputs.results_repo }}" --precision "${{ inputs.precision }}"
      - name: Wait for the job (streams its log)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 kamadhenu/training/hf_job.py wait --job "${{ steps.submit.outputs.job_id }}" --namespace "${{ steps.submit.outputs.namespace }}"
      - name: Collect the renders, log and run record
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p out && cp experiment_a_job.json out/ || true
          python3 kamadhenu/training/hf_job.py collect --results-repo "${{ inputs.results_repo }}" --out out || echo "nothing to collect yet"
          ls -laR out | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kamadhenu-experiment-a
          path: out/
          if-no-files-found: warn
