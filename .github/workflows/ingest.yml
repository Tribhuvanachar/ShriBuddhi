name: DGE ingest

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Which text to (re)generate"
        required: true
        default: bhagavata
        type: choice
        options:
          - bhagavata
          - ramayana
          - mahabharata
          - harivamsha
          - manu_smriti
          - yajnavalkya_smriti
          - parashara_smriti
          - narada_smriti
          - vishnu_smriti
          - raghuvamsha
          - shishupalavadha
          - kumarasambhava
          - kiratarjuniya

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r importers/requirements.txt
      - name: Run importer (${{ inputs.text }})
        env:
          TEXT_ID: ${{ inputs.text }}
        run: python importers/dispatch.py "$TEXT_ID"
      - name: Refresh library status snapshot
        run: python tools/gen_library_status.py
      - name: Rebuild global search index
        run: python build_search_index.py --data data --out search_index

      - name: Land the importer's output in ParaBuddhi first
        env:
          PARABUDDHI_TOKEN: ${{ secrets.PARABUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          git status --porcelain -uall data | sed 's/^...//' > "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo "the importer wrote nothing; nothing to land"; exit 0; fi
          test -n "$PARABUDDHI_TOKEN" || { echo "::error::PARABUDDHI_TOKEN is not set. What this importer produced must land in ParaBuddhi before a pull request is opened from it."; exit 2; }
          git clone --depth 1 "https://x-access-token:${PARABUDDHI_TOKEN}@github.com/Tribhuvanachar/ParaBuddhi.git" "$RUNNER_TEMP/pb"
          # These importers fetch and transform in one pass, so what can be kept is their first output
          # (before any stitching into the library), not the bytes the site sent.
          python3 tools/watch/dump_to_parabuddhi.py --pb "$RUNNER_TEMP/pb" --id "ingest" --files-from "$RUNNER_TEMP/changed.txt" \
            --note "DGE ingest importer output"

      - name: Open Pull Request (against ShriBuddhi)
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/${{ inputs.text }}
          commit-message: "data: ingest ${{ inputs.text }}"
          title: "Ingest: ${{ inputs.text }}"
          body: |
            Automated ingest of **${{ inputs.text }}** via GitHub Actions.
            Parser: `importers/`. Spot-check Devanagari fidelity before merging.

            Also re-indexes `search_index/` in this same PR, so the new
            content is searchable the moment it merges (no separate
            re-index run needed).
          add-paths: |
            data/**
            search_index/**
