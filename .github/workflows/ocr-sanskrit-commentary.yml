name: DGE OCR Sanskrit/Kannada commentary (server-side)

# Stage 1 of the server-side OCR pipeline (see tools/ocr_pipeline.py /
# tools/gemini_ocr_commentary.py / tools/merge_staged_commentary.py):
# PDF pages -> Vision OCR -> Gemini proofreading -> a staged JSON file,
# uploaded as a build artifact. Exists because convert/ (the browser
# admin tool) has no server-side equivalent -- a real scanned book times
# out a browser tab, and that tool has no way to skip its manual review
# step. This workflow has no wall-clock UI timeout (GitHub Actions' own
# job limit is 6 hours).
#
# Two-stage by design: this workflow ALWAYS stages (never silently skips
# it), and only ALSO merges into the corpus when also_merge=true -- a
# staged file can be inspected/downloaded/emailed by the browser admin
# tool before anything touches a kavya. Gemini's own proofreading pass
# still runs either way (it's the correction step, not optional), but its
# "accept"/"review"/"unresolved" self-classification is what gates what
# a merge actually writes; see merge_staged_commentary.py's own docstring.
#
# The PDF itself is never committed to the repo (repo size budget --
# PROJECT_BRIEF.md rule 5): give a direct-download URL, or up to 3 split-7z
# part URLs (this project's sources have always come as exactly 3 parts) --
# the workflow downloads and combines them into a throwaway runner temp dir.
#
# Requires GEMINI_API_KEY (already used by the other Gemini workflows) and
# a VISION_API_KEY repository secret (Google Cloud Vision API key -- same
# key convert/'s browser tool takes from the admin, just stored as a
# repo secret here instead of localStorage). Same deliberate, scoped
# exception to this project's BYOK-only convention as the other
# server-side Gemini pipelines -- see gemini-enrich.yml's header comment.

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direct-download URL for the source PDF (leave blank if using the 3 part URLs below)"
        required: false
      pdf_url_part1:
        description: "Split-7z part 1 URL (leave pdf_url blank if using this)"
        required: false
      pdf_url_part2:
        description: "Split-7z part 2 URL"
        required: false
      pdf_url_part3:
        description: "Split-7z part 3 URL"
        required: false
      start_page:
        description: "First PDF page to OCR (1-indexed, inclusive)"
        required: true
      end_page:
        description: "Last PDF page to OCR (1-indexed, inclusive)"
        required: true
      exclude_pages:
        description: "Comma/range list of pages to skip within the range, e.g. '13,40-42' (blank = none)"
        required: false
        default: ""
      work_slug:
        description: "Folder name under data/ocr_staging/ for this work, e.g. raghavendra_vijaya"
        required: true
      canto:
        description: "Which canto (sarga) these pages belong to -- run once per canto"
        required: true
      commentary_key:
        description: "Key under shlokas[n].commentaries this will eventually merge into (e.g. tika_someauthor)"
        required: true
      display_label:
        description: "Human-readable label for metadata.availableCommentaries"
        required: true
      context_anchor:
        description: 'e.g. "Raghavendra Vijaya, Sanskrit tika by X, Sarga 1" -- helps Gemini resolve ambiguous OCR'
        required: false
        default: ""
      content_field:
        description: "Which proofread field is this commentary's text -- 'commentary' for a tika/bhashya PDF (mula already in the corpus), 'sa' only if this PDF IS a mula-text source"
        required: true
        default: commentary
        type: choice
        options:
          - commentary
          - sa
      model:
        description: "Gemini model to use"
        required: true
        default: gemini-flash-latest
        type: choice
        options:
          - gemini-flash-latest
          - gemini-flash-lite-latest
      vision_only:
        description: "Vision-only: stage raw Vision OCR and skip the Gemini proofread (needs only VISION_API_KEY; ₹0 Gemini). Use when Gemini credits are exhausted; align to verses by hand afterwards. Not compatible with also_merge (raw text is classified 'raw')."
        required: true
        default: false
        type: boolean
      also_merge:
        description: "Also merge into the corpus immediately after staging (Stage 2) -- off by default, since staging alone is meant for review first"
        required: true
        default: false
        type: boolean
      sarga_dir:
        description: "Required if also_merge is checked"
        required: false
        default: ""
      include_review:
        description: "(also_merge only) Also merge shlokas Gemini flagged 'review'"
        required: true
        default: false
        type: boolean
      include_unresolved:
        description: "(also_merge only) Also merge shlokas Gemini flagged 'unresolved' -- use with caution"
        required: true
        default: false
        type: boolean
      direct_push:
        description: "(also_merge only) Skip the review PR and push the merge straight to main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils and p7zip
        run: sudo apt-get update && sudo apt-get install -y poppler-utils p7zip-full

      - name: Stage 1 -- OCR + proofread
        id: stage1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$VISION_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY and/or VISION_API_KEY repository secret is not set. Add them under" \
                 "Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi

          ARGS=(--start-page "${{ inputs.start_page }}" --end-page "${{ inputs.end_page }}"
                --work-slug "${{ inputs.work_slug }}" --canto "${{ inputs.canto }}"
                --commentary-key "${{ inputs.commentary_key }}" --display-label "${{ inputs.display_label }}"
                --content-field "${{ inputs.content_field }}" --model "${{ inputs.model }}"
                --out staged.json)
          if [ -n "${{ inputs.exclude_pages }}" ]; then ARGS+=(--exclude-pages "${{ inputs.exclude_pages }}"); fi
          if [ -n "${{ inputs.context_anchor }}" ]; then ARGS+=(--context-anchor "${{ inputs.context_anchor }}"); fi
          if [ "${{ inputs.vision_only }}" = "true" ]; then ARGS+=(--no-proofread); fi

          if [ -n "${{ inputs.pdf_url }}" ]; then
            ARGS+=(--pdf-url "${{ inputs.pdf_url }}")
          elif [ -n "${{ inputs.pdf_url_part1 }}" ]; then
            PARTS="${{ inputs.pdf_url_part1 }}"
            if [ -n "${{ inputs.pdf_url_part2 }}" ]; then PARTS="$PARTS,${{ inputs.pdf_url_part2 }}"; fi
            if [ -n "${{ inputs.pdf_url_part3 }}" ]; then PARTS="$PARTS,${{ inputs.pdf_url_part3 }}"; fi
            ARGS+=(--pdf-url-parts "$PARTS")
          else
            echo "::error::Give either pdf_url or at least pdf_url_part1."
            exit 1
          fi

          python3 tools/gemini_ocr_commentary.py "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: staged-commentary
          path: staged.json

      - name: Stage 2 -- merge into the corpus
        if: ${{ fromJSON(inputs.also_merge) }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.sarga_dir }}" ]; then
            echo "::error::also_merge is checked but sarga_dir is blank."
            exit 1
          fi
          ARGS=(--staged staged.json --sarga-dir "${{ inputs.sarga_dir }}")
          if [ "${{ inputs.include_review }}" = "true" ]; then ARGS+=(--include-review); fi
          if [ "${{ inputs.include_unresolved }}" = "true" ]; then ARGS+=(--include-unresolved); fi
          python3 tools/merge_staged_commentary.py "${ARGS[@]}"
          python3 tools/validate_data.py
          git status --porcelain "${{ inputs.sarga_dir }}"

      # This job's own checkout (this repo, ShriBuddhi) does the OCR/merge
      # above; the final publish targets BrahmaBuddhi as a staging repo
      # instead of committing/PR-ing straight into ShriBuddhi or bhumandala --
      # see .github/workflows/push-to-brahmabuddhi.yml.
      - name: Checkout BrahmaBuddhi
        if: ${{ fromJSON(inputs.also_merge) }}
        uses: actions/checkout@v4
        with:
          repository: Tribhuvanachar/BrahmaBuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          path: brahmabuddhi

      - name: Mirror changed output into the BrahmaBuddhi checkout
        if: ${{ fromJSON(inputs.also_merge) }}
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain -- "${{ inputs.sarga_dir }}" | awk '{print $2}')
          for f in $CHANGED; do
            mkdir -p "brahmabuddhi/$(dirname "$f")"
            cp -a "$f" "brahmabuddhi/$f"
          done

      - name: Push merge directly to BrahmaBuddhi's main
        if: ${{ fromJSON(inputs.also_merge) && fromJSON(inputs.direct_push) }}
        working-directory: brahmabuddhi
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git add -A
          git commit -m "data: OCR commentary '${{ inputs.commentary_key }}' for ${{ inputs.sarga_dir }} canto ${{ inputs.canto }} [direct-push]"
          git push origin HEAD:main

      - name: Open a review PR for the merge (against BrahmaBuddhi)
        if: ${{ fromJSON(inputs.also_merge) && !fromJSON(inputs.direct_push) }}
        uses: peter-evans/create-pull-request@v6
        with:
          path: brahmabuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          branch: ocr-commentary/${{ github.run_id }}
          commit-message: "data: OCR commentary '${{ inputs.commentary_key }}' for ${{ inputs.sarga_dir }} canto ${{ inputs.canto }}"
          title: "OCR commentary: ${{ inputs.commentary_key }} — ${{ inputs.sarga_dir }} canto ${{ inputs.canto }}"
          body: |
            Automated OCR + Gemini proofreading via `tools/gemini_ocr_commentary.py`
            + `tools/merge_staged_commentary.py` (model: `${{ inputs.model }}`,
            pages ${{ inputs.start_page }}-${{ inputs.end_page }}, content_field: `${{ inputs.content_field }}`).

            Only shlokas Gemini self-classified "accept" were merged automatically
            (include_review=`${{ inputs.include_review }}`, include_unresolved=`${{ inputs.include_unresolved }}`).
            Check the job log for how many verses were held back and why. The full
            staged output (including held-back verses) is attached to this workflow
            run as the `staged-commentary` artifact.

            Landed under `commentaries.${{ inputs.commentary_key }}`, labeled
            "${{ inputs.display_label }}" in `metadata.availableCommentaries`.
            This is a real author's text, OCR-digitized and Gemini-proofread —
            same category as `pavamanacharya_english`, so it does NOT get the
            reader's "AI" badge (that's reserved for content an AI generated
            itself, e.g. `gemini_padaccheda`/`gemini_summary` — see
            PROJECT_BRIEF.md's AI-marking convention and `dgeIsAiGeneratedCommentaryKey`
            in `core.js`). Spot-check a sample before trusting it as
            author-faithful, same as any OCR pass.
          add-paths: |
            ${{ inputs.sarga_dir }}/**
