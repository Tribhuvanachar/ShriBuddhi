# Push the WhatsApp / MSG91 / OTP secrets from GitHub repository secrets into Firebase's own Secret
# Manager, where dge/firebase/functions/index.js reads them via defineSecret() (FIREBASE_SETUP.md §7).
#
# Why this exists: `firebase functions:secrets:set NAME` is interactive (it prompts for the value on
# a terminal) and the values themselves — a Meta access token, an app secret, the OTP pepper — must
# never be pasted into a chat session or committed anywhere. This workflow reads them once from
# GitHub repository secrets (added the same way FIREBASE_SERVICE_ACCOUNT was: Settings → Secrets and
# variables → Actions → Repository secrets) and pipes each one straight into Secret Manager
# non-interactively. The values are never logged — only which secret NAMES were pushed.
#
# Add these GitHub repository secrets before dispatching (names match functions/index.js exactly):
#   WHATSAPP_TOKEN            Meta System User permanent access token
#   WHATSAPP_PHONE_NUMBER_ID  from WhatsApp → API Setup
#   WHATSAPP_VERIFY_TOKEN     any random string you choose, used to verify Meta's webhook handshake
#   WHATSAPP_APP_SECRET       Meta app → Settings → Basic → App Secret
#   OTP_PEPPER                any long random string — see the warning below, do NOT set this twice
#   MSG91_AUTHKEY             optional, only if AUTH_CONFIG.phoneOtpProvider will be 'msg91'
#   GH_DISPATCH_TOKEN         fine-grained GitHub PAT for admin/workflows.html's Run-a-Workflow panel
#                             (FIREBASE_SETUP.md §12 — Actions: Read and write on this repo ONLY,
#                             nothing else; never a classic repo-scoped PAT). Named GH_ rather than
#                             GITHUB_ because GitHub Actions refuses to create a secret whose name
#                             starts with the reserved GITHUB_ prefix — discovered 10 Sep 2026 the
#                             hard way, when the console rejected creating GITHUB_DISPATCH_TOKEN.
#   PAYMENT_WEBHOOK_SECRET    any random string — the `mock` payment gateway's shared HMAC secret
#                             (PAYMENTS_SETUP.md). Never actually used in production (mock refuses to
#                             run outside an emulator), but still has to EXIST for a deploy to succeed
#                             at all — a placeholder is fine and never needs a real value.
#   CASHFREE_CLIENT_ID        Cashfree dashboard → API Keys (Test App for sandbox, Live App for production)
#   CASHFREE_CLIENT_SECRET    same Cashfree App, the paired Secret Key — also what Cashfree signs webhooks with
#   RAZORPAY_KEY_SECRET       Razorpay dashboard → Settings → API Keys (paired with RAZORPAY_KEY_ID,
#                             which is NOT a secret — see index.js's own note on why — and is set as a
#                             plain non-secret param, RAZORPAY_KEY_ID, not pushed by this workflow)
#   RAZORPAY_WEBHOOK_SECRET   Razorpay dashboard → Settings → Webhooks → the secret YOU choose when
#                             creating the webhook — distinct from RAZORPAY_KEY_SECRET, never the same value
# Any of these left unset in GitHub is simply skipped (not pushed, not cleared).
#
# 8 Sep 2026: every defineSecret() in functions/index.js — not just the ones for whichever function
# you're deploying — gets resolved while firebase-tools loads and analyzes the codebase, so a Cloud
# Functions deploy FAILS OUTRIGHT if even one declared secret has no version in Secret Manager yet,
# regardless of `--only`. That includes GH_DISPATCH_TOKEN even though it has nothing to do with
# WhatsApp/OTP — this is why it is pushed here alongside the phone/WhatsApp ones, not left to the
# manual `firebase functions:secrets:set` §12 originally described. A WhatsApp/MSG91 value that isn't
# real yet is harmless to push as a placeholder (those transports are off in AUTH_CONFIG until turned
# on deliberately) — GH_DISPATCH_TOKEN needs a real token from day one, since admin/workflows.html
# calls it as soon as the functions exist.
#
# OTP_PEPPER must be set once and NEVER rotated: phone-account UIDs are derived from it, so changing
# it orphans every existing phone account (FIREBASE_SETUP.md §7). This workflow checks whether a
# version of OTP_PEPPER already exists in Secret Manager and refuses to overwrite it unless you tick
# rotate_otp_pepper — read the warning in that input before ever doing that.

name: Push Firebase Functions secrets

on:
  workflow_dispatch:
    inputs:
      rotate_otp_pepper:
        description: "DANGER — only tick this if you understand it orphans every existing phone account. Leave off for a normal run (OTP_PEPPER is skipped once it already has a version)."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the service-account key from the repository secrets
        # Same resolution as deploy-firebase-hosting.yml — see that file's header for the accepted
        # secret names. Prints only which secret NAMES were found, never a value.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found. Add ONE secret FIREBASE_SERVICE_ACCOUNT holding the whole JSON key file, "
                    "or the fields FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID.")
              sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key (should start with -----BEGIN PRIVATE KEY-----)"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service account:", sa.get("client_email"), "| source:", ", ".join(found))
          PY
      - name: Write .firebaserc (gitignored on purpose — the repo never carries a project id)
        run: |
          printf '{ "projects": { "default": "%s" } }\n' "${{ secrets.FIREBASE_PROJECT_ID }}" > dge/firebase/.firebaserc
      - name: Push each secret Firebase Functions needs, from GitHub repo secrets into Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROTATE_OTP_PEPPER: ${{ inputs.rotate_otp_pepper }}
          S_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          S_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          S_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          S_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          S_OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          S_MSG91_AUTHKEY: ${{ secrets.MSG91_AUTHKEY }}
          S_GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          S_PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          S_CASHFREE_CLIENT_ID: ${{ secrets.CASHFREE_CLIENT_ID }}
          S_CASHFREE_CLIENT_SECRET: ${{ secrets.CASHFREE_CLIENT_SECRET }}
          S_RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          S_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          npm install -g firebase-tools@15 >/dev/null 2>&1
          cd dge/firebase
          pushed=()
          skipped=()
          for NAME in WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET OTP_PEPPER MSG91_AUTHKEY GH_DISPATCH_TOKEN PAYMENT_WEBHOOK_SECRET CASHFREE_CLIENT_ID CASHFREE_CLIENT_SECRET RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
            VAR="S_${NAME}"
            VALUE="${!VAR}"
            if [ -z "$VALUE" ]; then
              skipped+=("$NAME (no GitHub secret set)")
              continue
            fi
            if [ "$NAME" = "OTP_PEPPER" ] && [ "$ROTATE_OTP_PEPPER" != "true" ]; then
              if firebase functions:secrets:access OTP_PEPPER --project "$PID" >/dev/null 2>&1; then
                skipped+=("OTP_PEPPER (already has a version — rotating it orphans every existing phone account; re-run with rotate_otp_pepper=true only if you mean it)")
                continue
              fi
            fi
            printf '%s' "$VALUE" | firebase functions:secrets:set "$NAME" --project "$PID" --data-file - --non-interactive
            pushed+=("$NAME")
          done
          echo "Pushed: ${pushed[*]:-none}"
          echo "Skipped: ${skipped[*]:-none}"
