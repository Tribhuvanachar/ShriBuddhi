# Push the WhatsApp / MSG91 / OTP secrets from GitHub repository secrets into Firebase's own Secret
# Manager, where firebase/functions/index.js reads them via defineSecret() (FIREBASE_SETUP.md §7).
#
# Why this exists: `firebase functions:secrets:set NAME` is interactive (it prompts for the value on
# a terminal) and the values themselves — a Meta access token, an app secret, the OTP pepper — must
# never be pasted into a chat session or committed anywhere. This workflow reads them once from
# GitHub repository secrets (added the same way FIREBASE_SERVICE_ACCOUNT was: Settings → Secrets and
# variables → Actions → Repository secrets) and pipes each one straight into Secret Manager
# non-interactively. The values are never logged — only which secret NAMES were pushed.
#
# Add these GitHub repository secrets before dispatching (names match functions/index.js exactly):
#   WHATSAPP_TOKEN            Meta System User permanent access token
#   WHATSAPP_PHONE_NUMBER_ID  from WhatsApp → API Setup
#   WHATSAPP_VERIFY_TOKEN     any random string you choose, used to verify Meta's webhook handshake
#   WHATSAPP_APP_SECRET       Meta app → Settings → Basic → App Secret
#   OTP_PEPPER                any long random string — see the warning below, do NOT set this twice
#   MSG91_AUTHKEY             optional, only if AUTH_CONFIG.phoneOtpProvider will be 'msg91'
#   GH_DISPATCH_TOKEN         fine-grained GitHub PAT for admin/workflows.html's Run-a-Workflow panel.
#                             NOT "GITHUB_DISPATCH_TOKEN" — GitHub rejects any repository secret whose
#                             name starts with GITHUB_. It is pushed INTO Secret Manager under the name
#                             GITHUB_DISPATCH_TOKEN, which is what functions/index.js reads.
#                             (FIREBASE_SETUP.md §12 — Actions: Read and write on this repo ONLY,
#                             nothing else; never a classic repo-scoped PAT)
#   PAYMENT_WEBHOOK_SECRET    any random string — the `mock` payment gateway's shared HMAC secret
#                             (PAYMENTS_SETUP.md). Never actually used in production (mock refuses to
#                             run outside an emulator), but still has to EXIST for a deploy to succeed
#                             at all — a placeholder is fine and never needs a real value.
#   CASHFREE_CLIENT_ID        Cashfree dashboard → API Keys (Test App for sandbox, Live App for production)
#   CASHFREE_CLIENT_SECRET    same Cashfree App, the paired Secret Key — also what Cashfree signs webhooks with
#   RAZORPAY_KEY_SECRET       Razorpay dashboard → Settings → API Keys (paired with RAZORPAY_KEY_ID,
#                             which is NOT a secret — see index.js's own note on why — and is set as a
#                             plain non-secret param, RAZORPAY_KEY_ID, not pushed by this workflow)
#   RAZORPAY_WEBHOOK_SECRET   Razorpay dashboard → Settings → Webhooks → the secret YOU choose when
#                             creating the webhook — distinct from RAZORPAY_KEY_SECRET, never the same value
# Any of these left unset in GitHub is simply skipped (not pushed, not cleared).
#
# 8 Sep 2026: every defineSecret() in functions/index.js — not just the ones for whichever function
# you're deploying — gets resolved while firebase-tools loads and analyzes the codebase, so a Cloud
# Functions deploy FAILS OUTRIGHT if even one declared secret has no version in Secret Manager yet,
# regardless of `--only`. That includes GITHUB_DISPATCH_TOKEN even though it has nothing to do with
# WhatsApp/OTP — this is why it is pushed here alongside the phone/WhatsApp ones, not left to the
# manual `firebase functions:secrets:set` §12 originally described. A WhatsApp/MSG91 value that isn't
# real yet is harmless to push as a placeholder (those transports are off in AUTH_CONFIG until turned
# on deliberately) — GITHUB_DISPATCH_TOKEN needs a real token from day one, since admin/workflows.html
# calls it as soon as the functions exist.
#
# OTP_PEPPER must be set once and NEVER rotated: phone-account UIDs are derived from it, so changing
# it orphans every existing phone account (FIREBASE_SETUP.md §7). This workflow checks whether a
# version of OTP_PEPPER already exists in Secret Manager and refuses to overwrite it unless you tick
# rotate_otp_pepper — read the warning in that input before ever doing that.

name: Push Firebase Functions secrets

on:
  workflow_dispatch:
    inputs:
      rotate_otp_pepper:
        description: "DANGER — only tick this if you understand it orphans every existing phone account. Leave off for a normal run (OTP_PEPPER is skipped once it already has a version)."
        required: true
        default: false
        type: boolean
      audit_only:
        description: "Change NOTHING — only report which secrets functions/index.js declares and which already have a version in Secret Manager. Run this first."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 16 Sep 2026: firebase/ now lives in THIS repo, so firebase-tools resolves every
      # defineSecret() call straight out of this checkout. There is no longer a second
      # copy of functions/index.js anywhere for the two to drift apart.
      - name: Assemble the service-account key from the repository secrets
        # Same resolution as deploy-firebase-hosting.yml — see that file's header for the accepted
        # secret names. Prints only which secret NAMES were found, never a value.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found. Add ONE secret FIREBASE_SERVICE_ACCOUNT holding the whole JSON key file, "
                    "or the fields FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID.")
              sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key (should start with -----BEGIN PRIVATE KEY-----)"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service account:", sa.get("client_email"), "| source:", ", ".join(found))
          PY
      - name: Write .firebaserc (gitignored on purpose — the repo never carries a project id)
        run: |
          printf '{ "projects": { "default": "%s" } }\n' "${{ secrets.FIREBASE_PROJECT_ID }}" > firebase/.firebaserc
      - name: Push each secret Firebase Functions needs, from GitHub repo secrets into Secret Manager
        if: ${{ !inputs.audit_only }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROTATE_OTP_PEPPER: ${{ inputs.rotate_otp_pepper }}
          S_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          S_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          S_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          S_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          S_OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          S_MSG91_AUTHKEY: ${{ secrets.MSG91_AUTHKEY }}
          # GitHub REFUSES to create a repository secret whose name begins with GITHUB_ —
          # the prefix is reserved — so `secrets.GITHUB_DISPATCH_TOKEN` has always read as an
          # empty string here and this secret was silently never pushed (found 11 Sep 2026,
          # against the live secret list: the one that exists is GH_DISPATCH_TOKEN). The old
          # name stays as a fallback only so a repository that somehow has one keeps working.
          S_GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          S_GITHUB_DISPATCH_TOKEN_LEGACY: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          S_PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          S_CASHFREE_CLIENT_ID: ${{ secrets.CASHFREE_CLIENT_ID }}
          S_CASHFREE_CLIENT_SECRET: ${{ secrets.CASHFREE_CLIENT_SECRET }}
          S_RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          S_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        working-directory: firebase
        run: |
          # gcloud, NOT `firebase functions:secrets:set`. On 22 Sep 2026 that
          # command created the RAZORPAY_KEY_SECRET version successfully and
          # then died with "Failed to list functions" -- it calls the Cloud
          # Functions API afterwards to tell you which functions need a
          # redeploy, and the CI service account cannot list functions. So the
          # loop aborted midway with one secret written and the next one not,
          # for a courtesy message nobody needed. `gcloud secrets versions add`
          # writes the version and stops, and needs only Secret Manager Admin.
          set +e
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          pushed=()
          skipped=()
          failed=()
          # The five payment secrets belong on this list for the reason the header already
          # gives: firebase-tools resolves EVERY defineSecret() in index.js while it analyzes
          # the codebase, so one secret with no version in Secret Manager fails the whole
          # deploy, `--only` or not. They were documented above but missing from this loop
          # until 11 Sep 2026, which meant a Functions deploy could not succeed at all.
          for NAME in WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET OTP_PEPPER MSG91_AUTHKEY GITHUB_DISPATCH_TOKEN PAYMENT_WEBHOOK_SECRET CASHFREE_CLIENT_ID CASHFREE_CLIENT_SECRET RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
            if [ "$NAME" = "GITHUB_DISPATCH_TOKEN" ]; then
              # The Secret Manager NAME stays GITHUB_DISPATCH_TOKEN (only GitHub reserves the
              # prefix, Google does not), so index.js's defineSecret is unchanged — it is only
              # the GitHub secret it is read FROM that has to be spelled GH_DISPATCH_TOKEN.
              VALUE="${S_GH_DISPATCH_TOKEN:-$S_GITHUB_DISPATCH_TOKEN_LEGACY}"
            else
              VAR="S_${NAME}"
              VALUE="${!VAR}"
            fi
            if [ -z "$VALUE" ]; then
              skipped+=("$NAME (no GitHub secret set)")
              continue
            fi
            if [ "$NAME" = "OTP_PEPPER" ] && [ "$ROTATE_OTP_PEPPER" != "true" ]; then
              if [ -n "$(gcloud secrets versions list OTP_PEPPER --project "$PID" --filter="state=enabled" --format="value(name)" --limit=1 2>/dev/null || true)" ]; then
                skipped+=("OTP_PEPPER (already has a version — rotating it orphans every existing phone account; re-run with rotate_otp_pepper=true only if you mean it)")
                continue
              fi
            fi
            if gcloud secrets describe "$NAME" --project "$PID" >/dev/null 2>&1; then
              OUT=$(printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" \
                      --project "$PID" --data-file=- 2>&1)
            else
              # The label is what firebase-tools puts on the secrets it makes,
              # so `firebase functions:secrets:prune` still recognises ours.
              OUT=$(printf '%s' "$VALUE" | gcloud secrets create "$NAME" \
                      --project "$PID" --replication-policy=automatic \
                      --labels=firebase-managed=true --data-file=- 2>&1)
            fi
            RC=$?   # captured immediately: any command in between resets it
            if [ "$RC" -eq 0 ]; then
              pushed+=("$NAME")
            else
              # Never echo $OUT unfiltered -- print only the first line, which
              # carries the reason, and never the value.
              echo "::error::could not set $NAME: $(printf '%s' "$OUT" | head -1)"
              failed+=("$NAME")
            fi
          done
          echo "Pushed: ${pushed[*]:-none}"
          echo "Skipped: ${skipped[*]:-none}"
          echo "Failed: ${failed[*]:-none}"
          # One failure must not be hidden by the ones that worked, but the
          # audit step below still has to run -- it is `if: always()`.
          [ ${#failed[@]} -eq 0 ]

      # WHY THIS EXISTS. "Check the other ten secrets exist" was advice with no
      # way to follow it: GitHub's own settings page lists the secrets held
      # HERE, which is not the same set as the versions held in Secret Manager,
      # and firebase-tools resolves EVERY defineSecret() in index.js while it
      # loads the codebase -- so one missing version fails the whole Functions
      # deploy, `--only` or not, naming it only at that point.
      #
      # The list is read out of index.js rather than typed here, so it cannot
      # drift from the code. Nothing is written and no value is ever printed --
      # `secrets:access` output goes to /dev/null and only the NAME and whether
      # a version exists are reported.
      # WHY THIS EXISTS. "Check the other ten secrets exist" was advice with no
      # way to follow it: GitHub's own settings page lists the secrets held
      # HERE, which is not the same set as the versions held in Secret Manager,
      # and firebase-tools resolves EVERY defineSecret() in index.js while it
      # loads the codebase -- so one missing version fails the whole Functions
      # deploy, `--only` or not, naming it only at that point.
      #
      # The list of names is read out of index.js rather than typed here, so it
      # cannot drift from the code. Nothing is written and no value is ever
      # printed -- only each NAME and whether a version exists.
      #
      # 22 Sep 2026: the first version of this step asked firebase-tools one
      # secret at a time with stderr thrown away, and reported all twelve as
      # MISSING. They were not missing -- the CI service account simply has no
      # Secret Manager role, so every call was PERMISSION_DENIED and the step
      # could not tell that apart from "no such secret". That is the same
      # mistake as reading an ambiguous GCS 404 as "the bucket is gone"
      # (see reindex.yml, DATA_INTEGRITY.md). One LIST call is made first, and
      # a permission failure is reported as one root cause instead of twelve
      # wrong answers.
      - name: Audit — which declared secrets actually have a version
        if: ${{ always() }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        working-directory: firebase
        run: |
          # NOT `set -e`. GitHub's default shell is `bash -e`, and the whole
          # point of this step is to keep going past a lookup that fails --
          # which is exactly what a missing secret looks like. Run 35722940080
          # reported OK for the first two names and then exited 1 on the third,
          # so ten of the twelve were never checked at all.
          set +e
          set -uo pipefail
          NAMES=$(grep -oE "defineSecret\('[A-Z0-9_]+'\)" functions/index.js \
                  | sed "s/defineSecret('//; s/')//" | sort -u)

          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format="value(account)" 2>/dev/null)

          # ONE list call. Its failure mode is unambiguous in a way that a
          # per-secret lookup's is not.
          # basename(), because some gcloud versions print the full resource
          # path (projects/N/secrets/NAME) and the membership test below is an
          # exact match.
          if ! gcloud secrets list --project "$PID" --format="value(name.basename())" \
               > /tmp/secrets.txt 2>/tmp/secrets.err; then
            sed 's/^/  /' /tmp/secrets.err
            if grep -qiE 'permission|denied|403|forbidden|not authorized' /tmp/secrets.err; then
              echo "::error::$ACCOUNT cannot read Secret Manager in $PID, so this audit cannot tell a missing secret from one it may not see — and the push step and a Functions deploy would fail for the same reason. Grant it the Secret Manager Admin role (roles/secretmanager.admin) at https://console.cloud.google.com/iam-admin/iam?project=$PID and run this again."
              {
                echo "## Secret Manager audit — could not run"
                echo ""
                echo "\`$ACCOUNT\` has no Secret Manager permission in \`$PID\`."
                echo "This is **one missing IAM role, not twelve missing secrets** — the audit"
                echo "cannot see them, which is not the same as their being absent."
                echo ""
                echo "Fix: IAM → that service account → **Secret Manager Admin**"
                echo "(\`roles/secretmanager.admin\`) →"
                echo "<https://console.cloud.google.com/iam-admin/iam?project=$PID>"
                echo ""
                echo "The push step above needs the same role to add a version, and a"
                echo "Cloud Functions deploy needs to resolve every declared secret, so"
                echo "nothing in playbook §D can proceed until this is granted."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not list secrets in $PID; see the error above."
              echo "## Secret Manager audit — could not run (see the job log)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          missing=0
          {
            echo "## Secret Manager audit — project \`$PID\`"
            echo ""
            echo "Read as \`$ACCOUNT\`. Names come from \`functions/index.js\`."
            echo ""
            echo "| secret declared in functions/index.js | has an enabled version? |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for NAME in $NAMES; do
            # A secret can EXIST with no version, which fails a deploy exactly
            # as an absent one does, so ask about versions rather than secrets.
            VER=$(gcloud secrets versions list "$NAME" --project "$PID" \
                    --filter="state=enabled" --format="value(name)" --limit=1 2>/dev/null || true)
            if [ -n "$VER" ]; then
              echo "  OK       $NAME"
              echo "| \`$NAME\` | yes |" >> "$GITHUB_STEP_SUMMARY"
            elif grep -qx "$NAME" /tmp/secrets.txt; then
              echo "  NO VERSION  $NAME"
              echo "| \`$NAME\` | **the secret exists but has no enabled version** |" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing+1))
            else
              echo "  MISSING  $NAME"
              echo "| \`$NAME\` | **no — a Functions deploy will fail** |" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing+1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            {
              echo ""
              echo "**$missing of the $(echo "$NAMES" | wc -w) declared secrets have no usable version.**"
              echo "A Cloud Functions deploy fails outright until every one of them does,"
              echo "whether or not you pass \`--only\`."
              echo ""
              echo "For each: add a GitHub repository secret of the same name on **ShriBuddhi**"
              echo "(<https://github.com/Tribhuvanachar/ShriBuddhi/settings/secrets/actions>),"
              echo "then run this workflow again with \`audit_only\` **unticked**."
              echo "\`GITHUB_DISPATCH_TOKEN\` is the one exception — GitHub reserves that"
              echo "prefix, so name it \`GH_DISPATCH_TOKEN\` on GitHub; this workflow renames"
              echo "it on the way in. A placeholder string is fine for anything not in use yet."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$missing declared secret(s) have no usable version in Secret Manager; a Functions deploy will fail until they do."
            # A warning, not a failure: the audit did its job. Failing here
            # would make an incomplete run and a successful one look the same.
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All declared secrets have an enabled version. A Functions deploy will not fail for this reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
