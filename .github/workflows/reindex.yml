# The built corpus-search index goes to the Cloud Storage bucket this project
# already has (js/config.js's storageBucket), under a prefix named for the data
# commit it was built from. What carries real, reviewable content
# (library-status.json, backlinks) still goes to BrahmaBuddhi as a PR, same as
# every other relocated content workflow.
#
# It used to go to a search-dist branch on the public repo behind a jsDelivr
# pin. See the note above the publish step for why that ended: 183,187 files,
# a 12-hour per-file CDN cache, and dist branches that no longer exist.
name: DGE re-index (search + library status)

# The "Re-index" job: rebuilds the corpus-wide search index and the Library
# Manager status snapshot so both reflect the current data.
#
# One way it runs, since 16 Sep 2026: by hand (Repository & Workflows →
# Search index, or the Actions tab). It opens a PR with the status/backlinks
# and prints the prefix it published to. It still skips the rebuild when no
# data has changed since the last publish (remembered in
# admin/config/search-index.state.json).
#
# The nightly schedule is commented out below, with the reason: its publish
# targets on the public Buddhi repo no longer exist. Restore the cron in the
# same breath as deciding where the built index should now be published.
#
# It regenerates two build products (generated-from-data artifacts, never
# hand-edited):
#   search_index/**               (build_search_index.py)
#   admin/config/library-status.json  (tools/gen_library_status.py)
# The index itself goes to Cloud Storage; only backlinks and status live on main.

on:
  # The nightly schedule is OFF as of 16 Sep 2026, and this is not a mute.
  #
  # The nightly schedule stays OFF until the first Cloud Storage publish has
  # actually run and been checked. The publish path below is new as of 16 Sep
  # and has never executed; a nightly job is the wrong place to find that out.
  # Restore this the day after a manual run succeeds.
  #
  #  schedule:
  #    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a PR with the refreshed index (off = commit straight to a branch you can inspect)"
        required: true
        default: true
        type: boolean
      include_kavya:
        description: "Also index the Kavya corpus from the kavya-dist branch"
        type: boolean
        default: true
      commentaries:
        description: "Index the commentaries themselves (bhashya/artha) as well as the mula -- larger index"
        type: boolean
        default: false
      bump_pin:
        description: "Bump the CDN pin in js and commit it to main (what the nightly run does)"
        type: boolean
        default: false
      force:
        description: "Rebuild even if data has not changed since the last publish"
        type: boolean
        default: true
      probe:
        description: "Check the bucket with ONE tiny file and stop. Builds nothing, publishes nothing, takes seconds."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reindex
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The nightly run is only worth its 25 minutes when something changed.
      - name: Has data changed since the last publish?
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          set -euo pipefail
          DATA_SHA=$(git log -1 --format=%H -- data)
          LAST=$(python3 -c "import json,os;p='admin/config/search-index.state.json';print(json.load(open(p)).get('data_sha','') if os.path.exists(p) else '')")
          echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"
          if [ "$PROBE" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "probe mode: nothing is built and nothing is published." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FORCE" = "true" ] || [ "$DATA_SHA" != "$LAST" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "data unchanged since the last publish ($LAST) — nothing to rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The Kavya corpus is not in data -- it is 50 MB on the kavya-dist
      # branch, served to the reader over jsDelivr. Checked out here so its
      # 67,000 verses are searchable; slugs come out relative to the checkout,
      # so they read kavya_alankara/<work>/<layer> exactly as if the corpus sat
      # in data, and core.js sends a hit on one of those to the CDN.
      - name: Fetch the Kavya corpus
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.include_kavya)
        run: |
          # kavya-dist lives in THIS repo. It used to be fetched from the
          # public Buddhi repo by URL, and that stopped working the day those
          # branches were cleaned off Buddhi: "couldn't find remote ref
          # kavya-dist", every night. The branch came across in the migration
          # and origin is already authenticated by actions/checkout, so ask
          # origin -- one less repo this has to be right about.
          git fetch --depth=1 origin kavya-dist
          rm -rf _kavya && mkdir -p _kavya
          git --work-tree=_kavya checkout FETCH_HEAD -- kavya_alankara
          du -sh _kavya

      - name: Rebuild global search index
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ARGS=(--data data --out search_index)
          [ -d _kavya ] && ARGS+=(--extra-data _kavya)
          [ "${{ inputs.commentaries }}" = "true" ] && ARGS+=(--commentaries)
          # tools/, not the repo root -- and PYTHONPATH because the script
          # imports search_toolkit_pkg, which sits at the root rather than
          # beside it. Neither had ever been reached: every run so far died
          # at the Kavya fetch above.
          PYTHONPATH="$PWD" python3 tools/build_search_index.py "${ARGS[@]}"

      - name: Put the Kavya checkout back
        if: ${{ always() }}
        run: |
          git reset -q HEAD -- kavya_alankara 2>/dev/null || true
          rm -rf _kavya kavya_alankara

      - name: Refresh library status snapshot
        if: steps.gate.outputs.run == 'true'
        run: python tools/gen_library_status.py

      - name: Show what changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git status --porcelain search_index admin/config/library-status.json || true

      # 16 Sep 2026: this used to force-push the whole index to a search-dist
      # branch on the public repo and serve it over jsDelivr behind a commit
      # pin that a person bumped by hand. Three things ended that:
      #
      #   * the index is 183,187 FILES. Firebase Hosting caps a version far
      #     below that and GitHub Pages caps the whole site at 1 GB, so
      #     neither can carry it. The many-small-files shape is right -- a
      #     posting file averages 10 KB and a query fetches a handful --
      #     so the answer is an object store, not a smaller index.
      #   * jsDelivr caches per file for about 12 hours, which is why the pin
      #     existed at all: without it a new manifest could meet stale shards
      #     and, in js/config.js's own words, break search entirely for those
      #     users.
      #   * the dist branches were cleaned off the public repo in September.
      #
      # So it goes to the Cloud Storage bucket this project already has, under
      # a prefix named for the data commit it was built from. Every path is
      # then immutable by construction: no staleness, and no pin to bump --
      # the config points at the new prefix as part of the build.
      - name: Assemble the service-account key from the repository secrets
        # NOT fatal. This step and the Cloud Storage publish under it are one
        # optional half of the job; the other half -- the refreshed backlinks
        # and library-status that go to BrahmaBuddhi as a PR -- is the half
        # that carries reviewable content, and it does not need a storage
        # credential to do its work. On 20 Sep 2026 this step exited 1 on
        # "FIREBASE_PROJECT_ID secret is not set", which aborted the job after
        # the index had already been rebuilt successfully, so the PR steps
        # never ran and a ten-minute rebuild was thrown away. The publish step
        # below was already continue-on-error; this one was the hard stop.
        continue-on-error: true
        # Accepts either the whole JSON in FIREBASE_SERVICE_ACCOUNT (or one of the common alternative names)
        # or the individual fields the lead stored one secret each (FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID,
        # FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID; the remaining fields are constants). Prints only which
        # secret NAMES were found — never a value. The assembled key is written to a file the deploy step reads.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found. Add ONE secret FIREBASE_SERVICE_ACCOUNT holding the whole JSON key file, "
                    "or the fields FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID.")
              sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key (should start with -----BEGIN PRIVATE KEY-----)"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service-account key assembled from:", ", ".join(found))
          PY

      # WHY THIS EXISTS. The first successful publish, on 22 Sep 2026, spent
      # 13 minutes building and 22 minutes uploading 215,933 files in order to
      # establish four things: that SEARCH_INDEX_BUCKET holds a valid bucket
      # name, that the service-account key activates, that the account may
      # write to the bucket, and that allUsers may read an object back. Every
      # one of those is answered by a single twelve-byte file in about five
      # seconds. Running the whole job to find out was the project lead's
      # criticism and it was correct.
      #
      # Run with probe = true after ANY change to the bucket, its permissions,
      # the secret, or the service account -- before committing half an hour
      # of runner time to a real publish.
      - name: Probe the bucket — no build, no publish
        if: github.event_name == 'workflow_dispatch' && inputs.probe
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          BUCKET: ${{ secrets.SEARCH_INDEX_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" || { echo "::error::SEARCH_INDEX_BUCKET secret is not set"; exit 1; }
          # Same normalisation as the publish step, for the same reason: the
          # secret is a NAME and has held a gs:// URL before now.
          BUCKET="${BUCKET#gs://}"
          BUCKET="${BUCKET%%/*}"
          if ! printf '%s' "$BUCKET" | grep -Eq '^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$'; then
            echo "::error::SEARCH_INDEX_BUCKET is not a valid bucket name: it must be 3-63 chars, lowercase, starting and ending alphanumeric — the NAME only."
            echo "PROBE FAILED: bad bucket name" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          OBJ="search_index/_probe/$GITHUB_RUN_ID.txt"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

          if ! printf 'probe %s\n' "$GITHUB_RUN_ID" | \
               gcloud storage cp - "gs://$BUCKET/$OBJ" --cache-control="no-store"; then
            echo "::error::Could not WRITE to gs://$BUCKET. A 404 here is ambiguous by design — the bucket may not exist, or this service account may not be allowed to see it. Check both: https://console.cloud.google.com/storage/browser , and that the bucket's PERMISSIONS tab grants Storage Admin to the account printed above."
            echo "PROBE FAILED: write" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          URL="https://storage.googleapis.com/$BUCKET/$OBJ"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          gcloud storage rm "gs://$BUCKET/$OBJ" >/dev/null 2>&1 || true

          if [ "$CODE" != "200" ]; then
            echo "::error::Wrote the object but an anonymous read of $URL returned HTTP $CODE. The bucket is not publicly readable: grant allUsers the Storage Object Viewer role on it. Readers fetch the index straight from this URL, so without that the search index is written and unreadable."
            echo "PROBE FAILED: public read returned $CODE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "probe OK — \`gs://$BUCKET\` is writable by the workflow and publicly readable."
            echo ""
            echo "Nothing was built and nothing was published. Re-run with probe unticked to publish for real."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the index to Cloud Storage
        id: publish
        # The build takes ~25 minutes and everything after this step is small,
        # cheap and useful on its own -- backlinks, library-status, the PR. A
        # missing bucket secret must not throw all of that away. Same rule as
        # MISTAKES #17: a step that persists expensive work is never gated on
        # an earlier one going well.
        continue-on-error: true
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          BUCKET: ${{ secrets.SEARCH_INDEX_BUCKET }}
          DATA_SHA: ${{ steps.gate.outputs.data_sha }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" || { echo "::error::SEARCH_INDEX_BUCKET secret is not set"; exit 1; }

          # The secret is a BUCKET NAME, not a URL. On 22 Sep 2026 it held a
          # value gcloud rejected -- "HTTPError 400: Invalid bucket name" --
          # after the job had rebuilt 215,933 index files, because this line
          # builds "gs://$BUCKET/..." and a secret that already carries the
          # scheme produces "gs://gs://...". Normalise the common shapes
          # rather than fail on them: strip a leading gs://, any trailing
          # slash, and any path the value carries.
          BUCKET="${BUCKET#gs://}"
          BUCKET="${BUCKET%%/*}"
          # Then check it against the rules GCS actually applies, so a bad
          # value is named here rather than 400ing halfway through a transfer.
          if ! printf '%s' "$BUCKET" | grep -Eq '^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$'; then
            echo "::error::SEARCH_INDEX_BUCKET is not a valid bucket name."
            echo "::error::It must be 3-63 chars, lowercase letters, digits, dots, hyphens or underscores, starting and ending alphanumeric — the NAME only, e.g. sarvamula-search, not a gs:// URL or a URL with a path."
            echo "PUBLISH FAILED: SEARCH_INDEX_BUCKET is not a valid bucket name" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BUILD="${DATA_SHA:0:12}"
          PREFIX="search_index/$BUILD"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          echo "uploading $(find search_index -type f | wc -l) files to gs://$BUCKET/$PREFIX/"
          # Immutable paths, so tell the browser it may keep them for a year.
          # NOTE: this step is continue-on-error, so a failure here does NOT
          # fail the job and the step still reports "success" in the API. Say
          # so in the summary, or a failed publish reads as a clean run --
          # which is exactly what happened on 22 Sep.
          if ! gcloud storage rsync -r --delete-unmatched-destination-objects \
            --cache-control="public, max-age=31536000, immutable" \
            search_index "gs://$BUCKET/$PREFIX"; then
            echo "::error::rsync to gs://$BUCKET/$PREFIX failed — nothing was published"
            # A 404 from GCS is deliberately ambiguous: it is returned both
            # when a bucket does not exist AND when the caller may not see
            # it, so that a stranger cannot probe which names are taken.
            # Saying so here saves an hour of looking in the wrong place --
            # on 22 Sep a valid name 404'd and either cause was possible.
            echo "::error::A 404 here means one of two things, and GCS will not say which: the bucket does not exist in this project, OR the service account in FIREBASE_SERVICE_ACCOUNT cannot see it. Check both: the bucket at https://console.cloud.google.com/storage/browser , and that its PERMISSIONS tab grants that service account Storage Admin (or at least Storage Object Admin)."
            echo "PUBLISH FAILED: rsync to the bucket did not complete" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "base=https://storage.googleapis.com/$BUCKET/$PREFIX" >> "$GITHUB_OUTPUT"
          {
            echo "published to \`gs://$BUCKET/$PREFIX\`"
            echo ""
            echo "read at https://storage.googleapis.com/$BUCKET/$PREFIX"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Checkout bhumandala for the pin bump
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.bump_pin)
        uses: actions/checkout@v4
        with:
          repository: Tribhuvanachar/bhumandala
          token: ${{ secrets.BUDDHI_TOKEN }}
          path: buddhi-pin

      - name: Copy freshly rebuilt status/backlinks into the bhumandala checkout
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.bump_pin)
        run: |
          set -euo pipefail
          cp admin/config/library-status.json buddhi-pin/admin/config/library-status.json
          rm -rf buddhi-pin/search_index/backlinks
          cp -r search_index/backlinks buddhi-pin/search_index/backlinks
          cp search_index/backlinks.json buddhi-pin/search_index/backlinks.json 2>/dev/null || true

      - name: Point the site at the new prefix and commit to main
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.bump_pin)
        env:
          BASE: ${{ steps.publish.outputs.base }}
          PREFIX: ${{ steps.publish.outputs.prefix }}
          DATA_SHA: ${{ steps.gate.outputs.data_sha }}
        working-directory: buddhi-pin
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/point_search_index.py" \
            --base "$BASE" --prefix "$PREFIX" --data-sha "$DATA_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js js/global-search.js admin/config/search-index.state.json \
                  admin/config/library-status.json search_index/backlinks search_index/backlinks.json 2>/dev/null || true
          git commit -q -m "Re-index: publish search index to ${PREFIX}, refresh status and backlinks" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && break
            git pull -q --rebase origin main || true
            sleep $((attempt * 3))
          done
          echo "Pin bumped to \`$SHA\` and committed to main." >> "$GITHUB_STEP_SUMMARY"

      # This job's own checkout (ShriBuddhi) does the rebuild above; the PR
      # targets BrahmaBuddhi as a staging repo instead of committing/PR-ing
      # straight into ShriBuddhi or bhumandala -- see
      # .github/workflows/push-to-brahmabuddhi.yml for the pattern this reuses.
      - name: Checkout BrahmaBuddhi
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && !inputs.bump_pin && fromJSON(inputs.open_pr)
        uses: actions/checkout@v4
        with:
          repository: Tribhuvanachar/BrahmaBuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          path: brahmabuddhi

      - name: Mirror changed content into the BrahmaBuddhi checkout
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && !inputs.bump_pin && fromJSON(inputs.open_pr)
        run: |
          set -euo pipefail
          mkdir -p brahmabuddhi/admin/config brahmabuddhi/search_index
          cp admin/config/library-status.json brahmabuddhi/admin/config/library-status.json
          rm -rf brahmabuddhi/search_index/backlinks
          cp -r search_index/backlinks brahmabuddhi/search_index/backlinks
          cp search_index/backlinks.json brahmabuddhi/search_index/backlinks.json 2>/dev/null || true

      - name: Open a PR for what does belong on main (against BrahmaBuddhi)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && !inputs.bump_pin && fromJSON(inputs.open_pr)
        uses: peter-evans/create-pull-request@v6
        with:
          path: brahmabuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          branch: reindex/status-and-backlinks
          title: "Re-index: library status and backlinks"
          commit-message: "Re-index: refresh library status and backlinks"
          body: |
            The search index itself is NOT here -- it is 183,187 files and
            was published to the Cloud Storage prefix named in the job
            summary. `appConfig.searchIndexBase` is pointed at that prefix by
            the same run when "bump_pin" is on; otherwise set it by hand from
            the summary.

            What this PR carries is the part that belongs on main:
            `admin/config/library-status.json` and
            `search_index/backlinks/**`.
