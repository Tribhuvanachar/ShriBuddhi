name: DGE Gemini deep analysis — chandas/alankara/samasa/pratipadartha (kavya)

# Runs tools/gemini_deep_analysis.py -- chandas (metre), alankara (figures
# of speech), samasa_vishesha (compound breakdown), pratipadartha (word-
# by-word gloss), and bhavartha (literary/devotional import) for shlokas
# that already have gemini_padaccheda/gemini_anvaya from
# gemini-summarize-kavya.yml. Run that workflow first -- this one skips
# (and reports) any verse that doesn't have both yet, rather than
# regenerating them at extra cost.
#
# Stored under shlokas[n].gemini_deep_analysis (a nested object, NOT
# shlokas[n].commentaries -- render.js's commentary blocks expect a plain
# string per key, and this is structured data with no reader UI yet, a
# real separate follow-up tracked in PENDING.md). Correspondingly this
# workflow does NOT open a PR labeled the same way as the commentary
# pipelines' "spot-check before merging a rendered commentary" language --
# there is nothing to render yet, just data landing in the corpus for that
# future UI to read.
#
# batch_size defaults to 1: this schema is heavier per verse (5 structured
# fields) than gemini_summarize.py's 3 short strings, and an external
# review's concern about batching risking output-token truncation is
# plausible for a schema this size (unlike gemini_summarize.py's schema,
# where a real gemini-bench.yml run already proved batch_size=10 works
# fine -- see PENDING.md). Benchmark before raising this, don't assume.
#
# Requires a GEMINI_API_KEY repository secret. Same deliberate, scoped
# exception to this project's BYOK-only convention as the other
# server-side Gemini pipelines -- see gemini-enrich.yml's header comment.

on:
  workflow_dispatch:
    inputs:
      sarga_dir:
        description: "Directory of sarga_N/data.json subfolders to process"
        required: true
        default: data/Tattvavada/Itara/Kavya/raghavendra_vijaya
      cantos:
        description: "Canto range or comma list, e.g. '1-10' or '1,3,5'"
        required: true
        default: "1-10"
      limit:
        description: "Analyze at most N verses total (blank = all) -- use this for a first smoke-test run"
        required: false
        default: ""
      model:
        description: "Gemini model to use. Default matches gemini-summarize-kavya.yml's own bench-backed choice."
        required: true
        default: gemini-flash-lite-latest
        type: choice
        options:
          - gemini-flash-lite-latest
          - gemini-flash-latest
      batch_size:
        description: "Verses per Gemini request. Default 1 -- see this workflow's header comment on why (heavier schema than gemini_summarize.py, not yet benchmarked at batch_size>1)."
        required: true
        default: "1"
      concurrency:
        description: "Parallel in-flight requests -- the time lever (does not change total tokens billed). 1 = sequential."
        required: true
        default: "1"
      direct_push:
        description: "Skip the review PR and push straight to main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  deep-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Gemini deep analysis (${{ inputs.sarga_dir }}, cantos ${{ inputs.cantos }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARGA_DIR: ${{ inputs.sarga_dir }}
          CANTOS: ${{ inputs.cantos }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi
          ARGS=(--sarga-dir "$SARGA_DIR" --cantos "$CANTOS" --model "$MODEL"
                --batch-size "$BATCH_SIZE" --concurrency "$CONCURRENCY")
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          python3 tools/gemini_deep_analysis.py "${ARGS[@]}"
      - name: Validate corpus data
        run: python3 tools/validate_data.py
      - name: Show what changed
        run: git status --porcelain "${{ inputs.sarga_dir }}"

      # This job's own checkout (this repo, ShriBuddhi) does the generation
      # above; the final publish targets BrahmaBuddhi as a staging repo
      # instead of committing/PR-ing straight into ShriBuddhi or bhumandala --
      # see .github/workflows/push-to-brahmabuddhi.yml for the pattern reused
      # here.
      - name: Checkout BrahmaBuddhi
        uses: actions/checkout@v4
        with:
          repository: Tribhuvanachar/BrahmaBuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          path: brahmabuddhi

      - name: Mirror changed output into the BrahmaBuddhi checkout
        run: |
          set -euo pipefail
          # A run that DELETES a file used to die here: `awk '{print $2}'`
          # reads a deleted path as something to copy and `cp` answers
          # "cannot stat". The same awk took the wrong field for a rename and
          # split any path with a space in it.
          git status --porcelain -z -- "${{ inputs.sarga_dir }}" > "$RUNNER_TEMP/changed.z"
          python3 tools/mirror_changed_paths.py "$RUNNER_TEMP/changed.z" brahmabuddhi

      - name: Push directly to BrahmaBuddhi's main
        if: ${{ fromJSON(inputs.direct_push) }}
        working-directory: brahmabuddhi
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git add -A
          git commit -m "data: gemini deep analysis for ${{ inputs.sarga_dir }} (cantos ${{ inputs.cantos }}) [direct-push]"
          git push origin HEAD:main

      - name: Open a review PR (against BrahmaBuddhi)
        if: ${{ !fromJSON(inputs.direct_push) }}
        uses: peter-evans/create-pull-request@v6
        with:
          path: brahmabuddhi
          token: ${{ secrets.BRAHMABUDDHI_TOKEN }}
          branch: gemini-deep-analysis/${{ github.run_id }}
          commit-message: "data: gemini deep analysis for ${{ inputs.sarga_dir }} (cantos ${{ inputs.cantos }})"
          title: "Gemini deep analysis: ${{ inputs.sarga_dir }} (cantos ${{ inputs.cantos }})"
          body: |
            Automated chandas/alankara/samasa_vishesha/pratipadartha/bhavartha
            generation via `tools/gemini_deep_analysis.py` (model: `${{ inputs.model }}`,
            batch_size: `${{ inputs.batch_size }}`, concurrency: `${{ inputs.concurrency }}`).

            Landed under `shlokas[n].gemini_deep_analysis` (structured data, not
            a `commentaries` entry -- no reader UI for this yet, see
            `PENDING.md`). Only verses that already had
            `gemini_padaccheda`/`gemini_anvaya` were processed; check the job
            log for how many were skipped for lacking those.
          add-paths: |
            ${{ inputs.sarga_dir }}/**
