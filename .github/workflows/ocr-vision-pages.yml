# Vision-only page OCR -> raw output in ParaBuddhi FIRST, then data/ocr_staging/ on ShriBuddhi main.
#
# Runs Google Cloud Vision (DOCUMENT_TEXT_DETECTION) over a PDF page range and commits the raw
# per-page result (1) to ParaBuddhi, unchanged, as the base data (this must succeed), and (2) to
# data/ocr_staging/<work_slug>/ on ShriBuddhi's main, where admin/ocr-review.html reads it. There are
# no ocr-staging/* branches any more (1 Oct 2026): everything staged lives in data/ocr_staging/.
# No Gemini call is made (₹0 Gemini). The local importer for the work merges this with a
# Tesseract pass, classifies agreement, and emits the human/Gemini verification queue.
# Needs the VISION_API_KEY repository secret (Settings -> Secrets and variables -> Actions).
name: OCR — Vision pages to ParaBuddhi and data/ocr_staging

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direct-download URL of the PDF (e.g. https://drive.google.com/uc?export=download&id=...)"
        required: true
      start_page:
        description: "First PDF page (1-indexed, inclusive)"
        required: true
      end_page:
        description: "Last PDF page (inclusive)"
        required: true
      work_slug:
        description: "Folder under data/ocr_staging/ and branch suffix, e.g. bhagavata_saroddhara"
        required: true
      dpi:
        description: "Render resolution"
        required: true
        default: "200"
      lang_hints:
        description: "Vision language hints, comma-separated"
        required: true
        default: "sa,kn,hi"

permissions:
  contents: write

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pymupdf
      - name: Download the PDF
        # `file` reads the magic bytes and nothing else, so a TRUNCATED download
        # passes it happily -- and then PyMuPDF opens a document with zero pages
        # and render() dies on "page 1 not in document", which reads like a bug in
        # the page range rather than a broken file. That cost five runs of a
        # 51-volume batch on 18 Sep 2026. The real check is whether the parser
        # that is about to use the file can count its pages, so that is the check.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            curl -sS -L --max-time 900 --retry 3 --retry-delay 5 -o source.pdf "${{ inputs.pdf_url }}" || true
            if ! file source.pdf | grep -qi pdf; then
              echo "attempt $attempt: not a PDF at all"
              head -c 300 source.pdf || true
              sleep 10; continue
            fi
            PAGES=$(python3 -c "
          import sys, fitz
          try:
              print(fitz.open('source.pdf').page_count)
          except Exception as e:
              print(0)
          " 2>/dev/null || echo 0)
            SIZE=$(stat -c%s source.pdf)
            if [ "${PAGES:-0}" -gt 0 ]; then
              echo "downloaded $SIZE bytes, $PAGES page(s) — usable"
              echo "PDF_PAGES=$PAGES" >> "$GITHUB_ENV"
              break
            fi
            echo "attempt $attempt: $SIZE bytes but PyMuPDF counts 0 pages — truncated, retrying"
            sleep 10
          done
          [ "${PDF_PAGES:-0}" != "0" ] || PDF_PAGES=$(python3 -c "
          import fitz
          try: print(fitz.open('source.pdf').page_count)
          except Exception: print(0)
          ")
          if [ "${PDF_PAGES:-0}" -eq 0 ]; then
            echo "::error::Could not get a readable PDF from that URL after 3 attempts."
            exit 1
          fi
      - name: Vision OCR
        env:
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VISION_API_KEY" ] || { echo "::error::VISION_API_KEY secret is not set"; exit 1; }
          python3 tools/vision_ocr_pages.py --pdf source.pdf --start "${{ inputs.start_page }}" --end "${{ inputs.end_page }}" \
            --dpi "${{ inputs.dpi }}" --lang "${{ inputs.lang_hints }}" \
            --out "data/ocr_staging/${{ inputs.work_slug }}/vision_pages_${{ inputs.start_page }}-${{ inputs.end_page }}.json"
      - name: Land the raw engine output in ParaBuddhi first
        env:
          PARABUDDHI_TOKEN: ${{ secrets.PARABUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PARABUDDHI_TOKEN" || { echo "::error::PARABUDDHI_TOKEN is not set. OCR output must land in ParaBuddhi first, so nothing else runs."; exit 2; }
          git clone --depth 1 "https://x-access-token:${PARABUDDHI_TOKEN}@github.com/Tribhuvanachar/ParaBuddhi.git" "$RUNNER_TEMP/pb"
          python3 tools/watch/dump_to_parabuddhi.py --pb "$RUNNER_TEMP/pb" --id "ocr_${{ inputs.work_slug }}" \
            --path "data/ocr_staging/${{ inputs.work_slug }}/vision_pages_${{ inputs.start_page }}-${{ inputs.end_page }}.json" \
            --note "Vision pages ${{ inputs.start_page }}-${{ inputs.end_page }}"

      - name: Commit to data/ocr_staging on main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          BR="${{ github.event.repository.default_branch }}"
          # Refresh the index the admin pages read, so a newly staged file is
          # in the dropdown without anyone remembering to regenerate it.
          python3 tools/build_ocr_staging_index.py
          git add "data/ocr_staging/${{ inputs.work_slug }}" data/ocr_staging/index.json
          git commit -m "ocr: Vision pages ${{ inputs.start_page }}-${{ inputs.end_page }} for ${{ inputs.work_slug }}" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:$BR" && exit 0
            git pull -q --rebase origin "$BR" || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 5 attempts; the OCR output is safe in ParaBuddhi."; exit 1
