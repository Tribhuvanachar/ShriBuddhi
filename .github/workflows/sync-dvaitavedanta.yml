name: Sync check dvaitavedanta.in

# The actionable half of change detection for dvaitavedanta.in. Where
# check-sources.yml answers "did the site change at all" from one seed per
# SECTION, this asks one seed per GRANTHA (~56 small requests) and diffs the
# sidebar id census against admin/config/dv_sync.state.json — so a change is
# reported as "these granthas gained these pages", precise enough to dispatch
# extract-dvaitavedanta.yml for just those granthas instead of re-crawling the
# whole corpus (nyaya_sudha alone is ~18 hours of fetching).
#
# It also re-fetches a random sample of already-imported items and reports any
# whose text no longer matches the live page (verify_source_content.py) — the
# drift that a census of ids cannot see.
#
# IT IMPORTS NOTHING. When something moved:
#   * the run summary and a GitHub issue name the exact granthas and the exact
#     extract-dvaitavedanta.yml inputs to pull them in
#   * with dispatch_extract=true (manual runs only) it dispatches those
#     extractions itself; each lands as a PR that still gets reviewed
#   * the new census is committed so the next run reports the NEXT change

on:
  schedule:
    # 03:30 UTC on the 2nd and the 17th = 9:00 am IST, the morning after
    # check-sources' fortnightly run on the 1st/16th — its coarse alarm and
    # this precise diff arrive as a pair.
    - cron: "30 3 2,17 * *"
  workflow_dispatch:
    inputs:
      sections:
        description: "Only these section slugs (comma-separated; blank = all)"
        type: string
        default: ""
      drift_sample:
        description: "Re-fetch N random already-imported pages and check the stored text still matches (0 = skip)"
        type: string
        default: "40"
      write_state:
        description: "Record the census, so the next run reports only what is new"
        type: boolean
        default: true
      dispatch_extract:
        description: "If granthas changed, dispatch extract-dvaitavedanta.yml for them right away"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-dvaitavedanta
  cancel-in-progress: false

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 indic_transliteration

      - name: Census the site, one seed per grantha
        id: census
        env:
          SECTIONS: ${{ inputs.sections }}
        run: |
          set -euo pipefail
          ARGS=(--json-out /tmp/dv_sync_changes.json --delay 2.0)
          [ -n "${SECTIONS:-}" ] && ARGS+=(--sections "$SECTIONS")
          # The scheduled run always remembers; a manual one asks.
          if [ "${{ inputs.write_state }}" != "false" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=(--write-state)
          fi
          python3 tools/dvaitavedanta/sync_check.py "${ARGS[@]}" | tee /tmp/report.md
          if grep -qE '^\| \*\*' /tmp/report.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Spot-check stored text against the live pages
        id: drift
        if: ${{ inputs.drift_sample != '0' }}
        run: |
          set -euo pipefail
          N="${{ inputs.drift_sample }}"; N="${N:-40}"
          # Freshly fetched, never from cache — a drift check answered from
          # cache would be this repo grading its own homework. Identify as
          # the importer: the site's protection lets that UA through and
          # challenges every other identity we have tried.
          UA=$(python3 -c 'import json;print(json.load(open("tools/dvaitavedanta/dv_sources.json"))["site"]["user_agent"])')
          python3 tools/dvaitavedanta/verify_source_content.py \
            --sample "$N" --delay 3 --cache /tmp/drift_cache \
            --user-agent "$UA" \
            --out /tmp/drift_report.json | tee /tmp/drift.md || true
          {
            echo ""
            echo "## Text drift sample"
            echo ""
            tail -n 20 /tmp/drift.md
          } >> /tmp/report.md
          # Colon-anchored on the summary block: verify_source_content's
          # summary lists a status ONLY when its count is nonzero, while the
          # progress lines always carry "DRIFT=0 MISSING=0 ..." — grepping the
          # bare words matched those zeros and opened a false-alarm issue on
          # the very first clean run (#144).
          if grep -qE '^[[:space:]]+(DRIFT|MISSING|PAGE_EMPTY):' /tmp/drift.md; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the run summary
        if: ${{ always() }}
        run: cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remember what was seen
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain admin/config/dv_sync.state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add admin/config/dv_sync.state.json
            git commit -q -m "DV sync check: record the census of $(date -u +%F)"
            for attempt in 1 2 3; do
              git push -q && break
              echo "push rejected, rebasing (attempt $attempt)"
              git pull -q --rebase origin main || true
              sleep $((attempt * 3))
            done
          fi

      - name: Say so where it will be seen
        if: ${{ steps.census.outputs.changed == 'true' || steps.drift.outputs.drifted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="dvaitavedanta.in moved — $(date -u +%F)"
          {
            echo "The fortnightly grantha-level sync check found differences against"
            echo "the last recorded census. **Nothing has been imported.** The rows"
            echo "below name the exact granthas and the extract inputs to pull them in."
            echo ""
            cat /tmp/report.md
          } > /tmp/issue.md
          gh issue create --title "$TITLE" --body-file /tmp/issue.md --repo "${{ github.repository }}" \
            || gh issue comment "$(gh issue list --repo "${{ github.repository }}" --search "dvaitavedanta.in moved" --limit 1 --json number --jq '.[0].number')" \
                 --body-file /tmp/issue.md --repo "${{ github.repository }}"

      - name: Dispatch targeted extraction
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_extract && steps.census.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One dispatch per changed section, narrowed to the changed granthas.
          # nyaya_sudha gets the long budget; its crawl outlives one job and
          # resumes from the Actions HTTP cache on re-dispatch.
          for sec in $(python3 -c "import json;print('\n'.join(json.load(open('/tmp/dv_sync_changes.json'))['changed']))"); do
            granthas=$(python3 -c "import json;print(','.join(json.load(open('/tmp/dv_sync_changes.json'))['changed']['$sec']))")
            timeout=240
            case ",$granthas," in *,nyaya_sudha,*) timeout=350;; esac
            echo "dispatching extract: scope=$sec granthas=$granthas job_timeout=$timeout"
            gh workflow run extract-dvaitavedanta.yml --repo "${{ github.repository }}" --ref main \
              -f scope="$sec" -f granthas="$granthas" -f limit_per_grantha=0 \
              -f delay=2.0 -f dry_run=false -f open_pr=true -f job_timeout="$timeout"
          done
