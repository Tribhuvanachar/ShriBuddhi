name: DGE OCR Lakshmi Vyakhya (Sanskrit, pratika-mode)

# Stage 1 of the Lakshmi Vyakhya pipeline (tools/lakshmi_kaumudi_ocr.py):
# archive.org PDF pages -> Vision OCR -> Gemini proofreading
# (pratika-anchored Sanskrit blocks, classification-gated) -> a staged
# JSON committed under data/ocr_staging/lakshmi_kaumudi/. Sutra
# alignment + merging is Stage 2, run deliberately after inspection.
# Same conventions as ocr-vasu-kaumudi.yml (committed staged files,
# GEMINI_HTTP_TIMEOUT, parallel disjoint page ranges).

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: "First PDF page to OCR (1-indexed, inclusive; the book is one 878-page PDF)"
        required: true
      end_page:
        description: "Last PDF page to OCR (inclusive). Overlap 1 page with the previous batch."
        required: true
      exclude_pages:
        description: "Pages to skip within the range"
        required: false
        default: ""
      context_anchor:
        description: "Extra context for Gemini, e.g. 'sandhi-prakarana region'"
        required: false
        default: ""
      model:
        description: "Gemini model"
        required: true
        default: gemini-flash-latest
        type: choice
        options:
          - gemini-flash-latest
          - gemini-flash-lite-latest
      pages_per_gemini_batch:
        description: "Pages per proofread call"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Stage 1 — OCR + proofread
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          GEMINI_HTTP_TIMEOUT: "300"
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$VISION_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY and/or VISION_API_KEY secret is not set."
            exit 1
          fi
          ARGS=(--start-page "${{ inputs.start_page }}" --end-page "${{ inputs.end_page }}"
                --model "${{ inputs.model }}"
                --pages-per-gemini-batch "${{ inputs.pages_per_gemini_batch }}")
          if [ -n "${{ inputs.exclude_pages }}" ]; then ARGS+=(--exclude-pages "${{ inputs.exclude_pages }}"); fi
          if [ -n "${{ inputs.context_anchor }}" ]; then ARGS+=(--context-anchor "${{ inputs.context_anchor }}"); fi
          python3 tools/lakshmi_kaumudi_ocr.py "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: staged-lakshmi-kaumudi
          path: data/ocr_staging/lakshmi_kaumudi/

      - name: Commit the staged file
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add data/ocr_staging/lakshmi_kaumudi/
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "data: stage Lakshmi Vyakhya OCR pages ${{ inputs.start_page }}-${{ inputs.end_page }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:main; then
              exit 0
            fi
            git fetch origin main && git rebase origin/main
            sleep $((i * 3))
          done
          exit 1
