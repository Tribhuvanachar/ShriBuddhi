name: Publish Dasa Sahitya local-asset imports

# Publishes data/dasa_sahitya_local/ (the app/export/dump imports still
# pending human review + merge, see dasa_sahitya_local/ARCHITECTURE.md) to
# this repo's "dasa-sahitya-local-dist" branch, then removes it from
# whichever branch this was dispatched against so it stops counting toward
# main's GitHub Pages footprint.
#
# Unlike publish-wordnet.yml/import-kavya.yml, there is no external source
# this can re-fetch and rebuild from on each run: each asset (an Android
# app's SQLite DB, a Firestore export, a flat JSON dump) was a one-off file
# uploaded straight into an editing session and imported there with
# tools/Tattvavada/Itara/DasaSahitya/import_dasa_sahitya_{local_db,collection_json,flat_json}.py.
# So the flow for a NEW asset arriving is: import it locally in a session,
# commit data/dasa_sahitya_local/<asset>/ to a branch same as always,
# THEN run this workflow (against that branch) to move it off main and onto
# the dist branch, publishing whatever is on disk at dispatch time rather
# than rebuilding it here.
#
# Nothing reads this branch yet -- there is no dasa_sahitya_local UI, only
# the plan in ARCHITECTURE.md for when composer-identity review finishes and
# a composer's data is ready to fold into data/Tattvavada/Itara/DasaSahitya/ (see
# tools/Tattvavada/Itara/DasaSahitya/merge_confirmed_composers.py for how that half works).
# This just keeps the pending, not-yet-merged data reviewable via git
# without it costing main anything.

on:
  workflow_dispatch:
    inputs:
      confirm_remove_from_source_branch:
        description: "After publishing, also remove data/dasa_sahitya_local/ from the branch this ran on and add it to .gitignore (leaves it committed on dasa-sahitya-local-dist regardless)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-dasa-sahitya-local
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check there is something to publish
        run: |
          set -euo pipefail
          if [ ! -d data/dasa_sahitya_local ]; then
            echo "::error::data/dasa_sahitya_local does not exist on this branch -- nothing to publish. If it was already moved to dasa-sahitya-local-dist and removed from here, this workflow has already done its job."
            exit 1
          fi
          du -sh data/dasa_sahitya_local

      # Published to BrahmaBuddhi (a staging repo) rather than to this repo
      # or bhumandala -- nothing here reads the branch over a CDN, it is a
      # pending-review git publication (see the header comment), so simply
      # retargeting the push is enough; no checkout of BrahmaBuddhi is
      # needed since this step already builds a throwaway repo from scratch.
      - name: Publish to dasa-sahitya-local-dist (BrahmaBuddhi)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Same shape as publish-wordnet.yml / reindex.yml's search-dist
          # step: a fresh history each run, force-pushed -- this is a
          # publication of current state, not a log of every past state.
          rm -rf /tmp/dasa-sahitya-local-dist
          mkdir -p /tmp/dasa-sahitya-local-dist
          cp -r data/dasa_sahitya_local/* /tmp/dasa-sahitya-local-dist/
          cp tools/Tattvavada/Itara/DasaSahitya/dasa_sahitya_local_dist_README.md /tmp/dasa-sahitya-local-dist/README.md
          cd /tmp/dasa-sahitya-local-dist
          git init -q -b dasa-sahitya-local-dist
          git add -A
          git commit -q -m "The pending Dasa Sahitya local-asset imports, published by publish-dasa-sahitya-local.yml"
          git push -q --force "https://x-access-token:${{ secrets.BRAHMABUDDHI_TOKEN }}@github.com/Tribhuvanachar/BrahmaBuddhi" \
            dasa-sahitya-local-dist:refs/heads/dasa-sahitya-local-dist
          SHA=$(git rev-parse HEAD)
          {
            echo "published to Tribhuvanachar/BrahmaBuddhi's dasa-sahitya-local-dist as \`$SHA\`"
            echo ""
            echo "Browse it: https://github.com/Tribhuvanachar/BrahmaBuddhi/tree/dasa-sahitya-local-dist"
            echo ""
            echo "No pin to bump yet -- nothing reads this branch over jsDelivr. Once a composer's data is ready to fold into the live corpus, that goes through tools/Tattvavada/Itara/DasaSahitya/merge_confirmed_composers.py, not through pointing a UI at this branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove data/dasa_sahitya_local from this branch
        if: ${{ fromJSON(inputs.confirm_remove_from_source_branch) }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm -rq data/dasa_sahitya_local
          if ! grep -qxF 'data/dasa_sahitya_local/' .gitignore; then
            {
              echo ""
              echo "# Published to the \"dasa-sahitya-local-dist\" branch by"
              echo "# .github/workflows/publish-dasa-sahitya-local.yml -- pending Dasa Sahitya"
              echo "# local-asset imports, kept off main the same reason wordnet/kavya/search-dist"
              echo "# are. Rebuild it here (or checkout the dist branch) to review or continue the"
              echo "# merge in tools/Tattvavada/Itara/DasaSahitya/merge_confirmed_composers.py."
              echo "data/dasa_sahitya_local/"
            } >> .gitignore
          fi
          git add .gitignore
          git commit -q -m "Move data/dasa_sahitya_local to the dasa-sahitya-local-dist branch"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            HEAD:${{ github.ref_name }}
