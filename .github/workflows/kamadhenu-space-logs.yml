# Diagnostics for the Kamadhenu ZeroGPU Space: prints the Space's runtime log tail and makes one
# authenticated /synthesize call from the runner. Needed because Space logs are owner-only (HF_TOKEN
# lives in the repository secrets, not on any developer machine) and the public API currently answers
# `event: error / data: null`, which hides the cause.
name: Kamadhenu Space — logs + API probe

on:
  workflow_dispatch:
    inputs:
      space:
        description: "Hugging Face Space id"
        required: true
        default: "SarvamulaOrg/kamadhenu"
      lines:
        description: "log lines to print"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runtime log (last N lines)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
          # the logs endpoints stream SSE; read for 25 s then stop (hub API first, legacy host as fallback)
          for kind in run build; do
            timeout 25 curl -sS -N -H "Authorization: Bearer $HF_TOKEN" -H "Accept: text/event-stream" \
              "https://huggingface.co/api/spaces/${{ inputs.space }}/logs/$kind" > $kind.log || true
            if [ ! -s $kind.log ]; then
              timeout 25 curl -sS -N -H "Authorization: Bearer $HF_TOKEN" -H "Accept: text/event-stream" \
                "https://api.hf.space/v1/${{ inputs.space }}/logs/$kind" > $kind.log || true
            fi
            echo "==== $kind log ($(wc -l < $kind.log) lines) ===="; tail -n "${{ inputs.lines }}" $kind.log | sed 's/^data: //' | python3 -c 'import sys,json
          for l in sys.stdin:
              l=l.strip()
              if not l: continue
              try: d=json.loads(l); print(d.get("data", l)[:400] if isinstance(d, dict) else l[:400])
              except Exception: print(l[:400])'
          done
      - name: Authenticated /synthesize call
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HOST="https://$(echo '${{ inputs.space }}' | tr '/' '-' | tr 'A-Z' 'a-z').hf.space"
          BODY='{"data":["धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः ।\nमामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥","अनुष्टुप्",60]}'
          EV=$(curl -sS -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" -d "$BODY" "$HOST/gradio_api/call/synthesize")
          echo "event: $EV"
          ID=$(echo "$EV" | python3 -c 'import sys,json; print(json.load(sys.stdin)["event_id"])')
          timeout 300 curl -sS -N -H "Authorization: Bearer $HF_TOKEN" "$HOST/gradio_api/call/synthesize/$ID" | head -c 3000; echo
          echo "==== Kamadhenu trial engine (IndicF5 zero-shot, ref tp_anushtubh_19) ===="
          BODY2='{"data":["धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः ।\nमामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥","tp_anushtubh_19",60]}'
          EV3=$(curl -sS -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" -d "$BODY2" "$HOST/gradio_api/call/synthesize_kamadhenu")
          echo "event: $EV3"
          ID3=$(echo "$EV3" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("event_id",""))')
          [ -n "$ID3" ] && timeout 600 curl -sS -N -H "Authorization: Bearer $HF_TOKEN" "$HOST/gradio_api/call/synthesize_kamadhenu/$ID3" | head -c 3000; echo
          echo "==== anonymous call for comparison ===="
          EV2=$(curl -sS -H "Content-Type: application/json" -d "$BODY" "$HOST/gradio_api/call/synthesize")
          ID2=$(echo "$EV2" | python3 -c 'import sys,json; print(json.load(sys.stdin)["event_id"])')
          timeout 120 curl -sS -N "$HOST/gradio_api/call/synthesize/$ID2" | head -c 1500; echo
