# Kamadhenu — does each pilot recording say its verse? Local Whisper (CPU, free runners, no API) over the pilot set,
# four shards in parallel, merged into one report (kamadhenu/training/verify_pilot_transcripts.py). The report is
# the gate the exporter honours (--require-verified). Costs nothing; ~40 min.
name: Kamadhenu — pilot transcript check

on:
  workflow_dispatch:
    inputs:
      model:
        description: "faster-whisper model (small | base | medium)"
        required: true
        default: "small"

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        i: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kamadhenu
            kamadhenu_dataset
            tools/kamadhenu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q faster-whisper indic-transliteration
      - name: Fetch the pilot recordings
        run: python3 kamadhenu/training/fetch_pilot_audio.py
      - name: Transcribe and compare (shard ${{ matrix.i }}/4)
        run: python3 kamadhenu/training/verify_pilot_transcripts.py --model "${{ inputs.model }}" --shard "${{ matrix.i }}/4" --workers 1 --out "kamadhenu/reports/ptc_shard_${{ matrix.i }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ptc-shard-${{ matrix.i }}
          path: kamadhenu/reports/ptc_shard_${{ matrix.i }}.json
  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kamadhenu
            kamadhenu_dataset/text_index.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q indic-transliteration
      - uses: actions/download-artifact@v4
        with:
          pattern: ptc-shard-*
          path: shards
          merge-multiple: true
      - run: |
          ls -la shards
          python3 kamadhenu/training/verify_pilot_transcripts.py --model "${{ inputs.model }}" --merge shards/*.json --out kamadhenu/reports/pilot_transcript_check
          head -40 kamadhenu/reports/pilot_transcript_check.md
      - name: Cross-match every recording against the whole work (which verse is it really?)
        run: |
          python3 kamadhenu/training/verify_pilot_transcripts.py --crossmatch kamadhenu/reports/pilot_transcript_check.json --out kamadhenu/reports/pilot_transcript_check
          head -60 kamadhenu/reports/pilot_transcript_check/crossmatch.md
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-transcript-check
          path: |
            kamadhenu/reports/pilot_transcript_check.json
            kamadhenu/reports/pilot_transcript_check.md
            kamadhenu/reports/pilot_transcript_check/crossmatch.json
            kamadhenu/reports/pilot_transcript_check/crossmatch.md
