# The Sanskrit WordNet is rebuilt into data/_wordnet/ of THIS repository and proposed as
# a pull request. It ships with the site like the rest of the corpus (26 MB; about
# 30 MB gzipped against a whole site of about 300 MB gzipped), so it is read by
# js/intellisense.js from data/_wordnet/ and reaches Jagat with the next publish.
# It used to live on a separate CDN-served branch because the site was tight
# against a size ceiling; that reason is gone.
name: Publish the Sanskrit WordNet

# Rebuilds data/_wordnet/ from IndoWordNet and opens a pull request with the result.
#
# A rebuild is a new corpus, not a patch: the PR replaces the whole tree. Run it when
# tools/build_wordnet.py changes, or when IndoWordNet publishes a new dump. The
# builder normalises everything to Unicode NFC (the repo's CI gate) and merges word
# spellings that collapse under NFC, so the PR should pass `normalize_nfc.py --check`.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Other IndoWordNet languages to carry equivalents from"
        type: string
        default: kannada
      examples:
        description: "Include the Sanskrit usage sentences (24 MB with, 17 MB without)"
        type: boolean
        default: true
      dry_run:
        description: "Build and report only — publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-wordnet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build from the IndoWordNet dump
        env:
          LANGUAGES: ${{ inputs.languages }}
          EXAMPLES: ${{ inputs.examples }}
        run: |
          set -euo pipefail
          ARGS=(--download --languages "$LANGUAGES")
          [ "$EXAMPLES" = "true" ] || ARGS+=(--no-examples)
          python tools/build_wordnet.py "${ARGS[@]}" | tee build.log

      - name: Report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = pathlib.Path("data/_wordnet")
          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          mb = sum(f.stat().st_size for f in d.glob("*.json")) / 1024 / 1024
          print("## Sanskrit WordNet\n")
          print(f"- synsets: **{m['synsets']:,}**")
          print(f"- indexed words: **{m['words']:,}**")
          print(f"- with a hypernym: **{m['hypernyms']:,}**")
          print(f"- buckets: **{len(m['buckets'])}**, {mb:.1f} MB")
          print(f"- usage sentences: **{'included' if m['examples'] else 'dropped'}**")
          print(f"- other languages: **{', '.join(m['languages']) or 'none'}**")
          print(f"\nSource: {m['source']} — {m['licence']}")
          PY

      # A synset whose words are empty, or a bucket that is not the shape the
      # client reads, would reach the reader as a silently empty popover. The
      # build is checked here rather than trusted, because nothing downstream
      # of this branch looks at it again.
      - name: Check the tree is readable
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = pathlib.Path("data/_wordnet")
          man = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          missing = [b for b in man["buckets"] if not (d / f"{b}.json").exists()]
          if missing:
              sys.exit(f"manifest names {len(missing)} buckets that were not written: {missing[:5]}")
          words = 0
          for b in man["buckets"]:
              bucket = json.loads((d / f"{b}.json").read_text(encoding="utf-8"))
              if set(bucket) != {"s", "w"}:
                  sys.exit(f"{b}.json is not {{s, w}}")
              for key, ids in bucket["w"].items():
                  words += 1
                  for i in ids:
                      rec = bucket["s"][i]
                      if len(rec) < 5 or not rec[1] or not rec[3]:
                          sys.exit(f"{b}.json: {key} points at an empty synset")
          if words != man["words"]:
              sys.exit(f"manifest says {man['words']} words, the buckets hold {words}")
          print(f"{len(man['buckets'])} buckets, {words} words, all readable")
          PY

      - name: Open a pull request with the rebuilt data/_wordnet/
        if: ${{ !fromJSON(inputs.dry_run) }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: wordnet/rebuild
          delete-branch: true
          add-paths: data/_wordnet
          commit-message: "data: rebuild the Sanskrit WordNet (data/_wordnet)"
          title: "Sanskrit WordNet rebuild"
          body: |
            Automated rebuild of `data/_wordnet/` by `publish-wordnet.yml`
            (`tools/build_wordnet.py`, from the IndoWordNet dump).

            The step summary of the run lists synsets, indexed words and buckets.
            The tree was checked for readability before this PR was opened. Merging
            it puts the new WordNet into the next Jagat publish.
