# One Kavya corpus, in one place: data/kavya_alankara/ on ShriBuddhi main. It ships to
# Jagat with the rest of the site; there is no kavya-dist branch and no CDN pin any more
# (30 Sep 2026, the lead: "just one kavya_alankara sitting inside the main of both").
# This workflow first lands the raw fetch in ParaBuddhi (source/_raw/kavya/), then imports INTO that
# folder and opens a pull request. Nothing is pushed
# to main and nothing reaches Jagat from here.
name: Import Kavya corpus

# Manual only, like the Kosha and re-index workflows: fetching from GRETIL and
# sanskritsahitya should be a deliberate act, not something a push triggers.
#
# The import merges into data/kavya_alankara with kavya.merge.merge_into_existing,
# which refuses to shrink a text. Source and licence are not written into the data
# (provenance stays out of the published tree); credit lives in content/legal.json.
on:
  workflow_dispatch:
    inputs:
      works:
        description: 'Comma-separated work ids, or "all"'
        required: true
        default: 'all'
      sources:
        description: 'Comma-separated source keys (blank = every declared source)'
        required: false
        default: ''
      probe_only:
        description: 'Probe and report only — writes no data'
        type: boolean
        required: false
        default: false
      open_pr:
        description: 'Open a pull request with the result'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kavya-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: .kavya_cache
          key: kavya-src-${{ github.run_id }}
          restore-keys: kavya-src-

      - name: Probe sources
        if: ${{ inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: |
          python3 -m kavya.import_kavya \
            ${{ inputs.works == 'all' && '--all' || format('--works {0}', inputs.works) }} \
            ${{ inputs.sources != '' && format('--sources {0}', inputs.sources) || '' }} \
            --probe-only \
            --report _dump/KAVYA_PROBE.json

      - name: Import
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: |
          python3 -m kavya.import_kavya \
            ${{ inputs.works == 'all' && '--all' || format('--works {0}', inputs.works) }} \
            ${{ inputs.sources != '' && format('--sources {0}', inputs.sources) || '' }} \
            --data-root data \
            --report _dump/KAVYA_IMPORT_REPORT.json

      - name: Land the raw fetch in ParaBuddhi first
        if: ${{ !inputs.probe_only }}
        env:
          PARABUDDHI_TOKEN: ${{ secrets.PARABUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PARABUDDHI_TOKEN" || { echo "::error::PARABUDDHI_TOKEN is not set. What GRETIL, sanskritsahitya, Ambuda and Wikisource returned must land in ParaBuddhi before anything is built from it."; exit 2; }
          git clone --depth 1 "https://x-access-token:${PARABUDDHI_TOKEN}@github.com/Tribhuvanachar/ParaBuddhi.git" "$RUNNER_TEMP/pb"
          python3 tools/watch/dump_to_parabuddhi.py --pb "$RUNNER_TEMP/pb" --id kavya --path .kavya_cache \
            --note "works=${{ inputs.works }}" --keep 2

      - name: Validate schema
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.validate_data --data-root data

      - name: Build index
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.build_kavya_index --data-root data

      - name: Verify
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.verify_kavya --data-root data

      - name: Report sizes
        run: |
          echo "### Kavya import" >> $GITHUB_STEP_SUMMARY
          du -sh data/kavya_alankara 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          p = "data/kavya_alankara/_index.json"
          if os.path.exists(p):
              t = json.load(open(p))["totals"]
              print("- %d works / %d layers / %d entries" %
                    (t["works"], t["layers"], t["entries"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kavya-report
          path: _dump/

      - name: Normalise to the repository's canonical data format
        if: ${{ !inputs.probe_only }}
        run: |
          python3 tools/format_data_json.py --fix --all >/dev/null
          python3 tools/normalize_nfc.py --fix >/dev/null || true
          python3 tools/register_layers.py --only kavya_alankara >/dev/null || true

      - name: Open a pull request
        if: ${{ !inputs.probe_only && inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing changed in data/: the corpus is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BR="import-kavya/${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data
          git commit -q -m "Import Kavya corpus (import-kavya.yml run ${GITHUB_RUN_ID})"
          git push -q origin "$BR"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BR" \
            --title "Import Kavya corpus" \
            --body "Merged into data/kavya_alankara by import-kavya.yml. Review the size summary in the run, then merge. Publishing to Jagat is a separate manual step."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
