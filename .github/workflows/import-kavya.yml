# kavya-dist publishes to bhumandala (Buddhi) directly, not BrahmaBuddhi --
# jsDelivr's GitHub CDN only serves PUBLIC repositories, and ShriBuddhi/
# BrahmaBuddhi are both private, so a dist branch has to live on bhumandala
# regardless of where the build itself runs. This is the same "no history in
# common with main, replaced wholesale, bypasses review by design" exemption
# the dist branches already had before this migration -- see BUDDHI_TOKEN
# (Contents:Read-write, scoped to bhumandala only) below.
name: Import Kavya corpus

# Manual only, like the Kosha and re-index workflows: fetching from GRETIL and
# sanskritsahitya should be a deliberate act, not something a push triggers.
#
# The corpus is built into _build/ and published to the "kavya-dist" branch,
# NEVER into data on main. Two reasons, both learned the hard way on the
# first real run:
#   * 50 MB of text on a published site that has about 1% of the GitHub Pages
#     1 GB limit left is the whole 1 GB problem again.
#   * raghuvamsha, kumarasambhava, kiratarjuniya and shishupalavadha already
#     exist on main in the pre-package shape -- items keyed sarga_01 where this
#     writes 1, shlokas keyed by number where this keys by id. Merging into
#     them appends a second copy of each text rather than updating it, so the
#     import deliberately starts from an empty root and the published granthas
#     are left alone. See PENDING.md.
on:
  workflow_dispatch:
    inputs:
      works:
        description: 'Comma-separated work ids, or "all"'
        required: true
        default: 'all'
      sources:
        description: 'Comma-separated source keys (blank = every declared source)'
        required: false
        default: ''
      probe_only:
        description: 'Probe and report only — writes no data'
        type: boolean
        required: false
        default: false
      open_pr:
        description: 'Open a pull request with the result'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kavya-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: .kavya_cache
          key: kavya-src-${{ github.run_id }}
          restore-keys: kavya-src-

      - name: Probe sources
        if: ${{ inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: |
          python3 -m kavya.import_kavya \
            ${{ inputs.works == 'all' && '--all' || format('--works {0}', inputs.works) }} \
            ${{ inputs.sources != '' && format('--sources {0}', inputs.sources) || '' }} \
            --probe-only \
            --report _dump/KAVYA_PROBE.json

      - name: Import
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: |
          python3 -m kavya.import_kavya \
            ${{ inputs.works == 'all' && '--all' || format('--works {0}', inputs.works) }} \
            ${{ inputs.sources != '' && format('--sources {0}', inputs.sources) || '' }} \
            --data-root _build/data \
            --report _dump/KAVYA_IMPORT_REPORT.json

      - name: Validate schema
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.validate_data --data-root _build/data

      - name: Build index
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.build_kavya_index --data-root _build/data

      - name: Verify
        if: ${{ !inputs.probe_only }}
        env:
          PYTHONPATH: tools
        run: python3 -m kavya.verify_kavya --data-root _build/data

      - name: Report sizes
        run: |
          echo "### Kavya import" >> $GITHUB_STEP_SUMMARY
          du -sh _build/data/kavya_alankara 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          p = "_build/data/kavya_alankara/_index.json"
          if os.path.exists(p):
              t = json.load(open(p))["totals"]
              print("- %d works / %d layers / %d entries" %
                    (t["works"], t["layers"], t["entries"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kavya-report
          path: _dump/

      - name: Publish to kavya-dist
        if: ${{ !inputs.probe_only && inputs.open_pr }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # A fresh history pushed over the branch: the branch is a publication,
          # not a log, and a history of superseded 50 MB corpora would cost
          # repository size for nothing. The reader picks the new data up as
          # jsDelivr's cache turns over.
          rm -rf /tmp/kavya-dist
          mkdir -p /tmp/kavya-dist
          cp -r _build/data/kavya_alankara /tmp/kavya-dist/
          cp tools/kavya/kavya_dist_README.md /tmp/kavya-dist/README.md
          cd /tmp/kavya-dist
          git init -q -b kavya-dist
          git add -A
          git commit -q -m "The built Kavya corpus, rebuilt by import-kavya.yml"
          git push -q --force "https://x-access-token:${{ secrets.BUDDHI_TOKEN }}@github.com/Tribhuvanachar/bhumandala" \
            kavya-dist:refs/heads/kavya-dist
          SHA=$(git rev-parse HEAD)
          # The reader pins a COMMIT, not this branch: jsDelivr caches a
          # @branch URL for 12 hours at the edge, so the first republish left
          # readers on the superseded build with nothing to say so. A hash is
          # immutable and served the moment it exists -- at the cost of this
          # second step.
          {
            echo "published to kavya-dist as \`$SHA\`"
            echo ""
            echo "**Now bump the pin** in js/config.js (appConfig.kavyaDataBase) and js/kavya.js (CDN):"
            echo ""
            echo '```'
            echo "https://cdn.jsdelivr.net/gh/Tribhuvanachar/bhumandala@$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
