name: DGE ingest (commentaries & word-meaning)

# Word-to-word meaning + commentary layers for Ramayana / Mahabharata,
# the new Bhagavad Gita section, and Shankaracharya's bhashya corpus.
# Runs the Python importers under importers/ and opens a PR with the data.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Which layer to (re)generate"
        required: true
        default: bhagavad_gita
        type: choice
        options:
          - ramayana_saartha       # Valmiki Ramayana word-meaning + English (valmikiramayan.net)
          - mahabharata_ganguli    # Mahabharata English prose (Ganguli / sacred-texts)
          - bhagavad_gita          # NEW Gita section: mula + word-meaning + all commentaries
          - shankara_bhashya       # Brahmasutra + Upanishad + Gita bhashyas (Shankara)
      gita_supersite:
        description: "Also pull GitaSupersite classical Sanskrit bhashyas (Gita only; slow, best-effort)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r importers/requirements.txt
      - name: Run importer (${{ inputs.text }})
        # Run from repo root (like ingest.yml): Python puts importers/ on the
        # path so `import common` resolves, and write_grantha() finds data.
        env:
          GITA_SUPERSITE: ${{ inputs.gita_supersite && '1' || '0' }}
        run: python importers/dispatch.py "${{ inputs.text }}"
      - name: Validate written data against schemas
        run: python tools/validate_data.py
      - name: Register any new layers in library.json
        run: python tools/register_layers.py
      - name: Refresh library status snapshot
        run: python tools/gen_library_status.py

      - name: Land the importer's output in ParaBuddhi first
        env:
          PARABUDDHI_TOKEN: ${{ secrets.PARABUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          git status --porcelain -uall data | sed 's/^...//' > "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo "the importer wrote nothing; nothing to land"; exit 0; fi
          test -n "$PARABUDDHI_TOKEN" || { echo "::error::PARABUDDHI_TOKEN is not set. What this importer produced must land in ParaBuddhi before a pull request is opened from it."; exit 2; }
          git clone --depth 1 "https://x-access-token:${PARABUDDHI_TOKEN}@github.com/Tribhuvanachar/ParaBuddhi.git" "$RUNNER_TEMP/pb"
          # These importers fetch and transform in one pass, so what can be kept is their first output
          # (before any stitching into the library), not the bytes the site sent.
          python3 tools/watch/dump_to_parabuddhi.py --pb "$RUNNER_TEMP/pb" --id "ingest_commentaries" --files-from "$RUNNER_TEMP/changed.txt" \
            --note "commentary ingest importer output"

      - name: Open Pull Request (against ShriBuddhi)
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/${{ inputs.text }}
          commit-message: "data: ingest ${{ inputs.text }}"
          title: "Ingest (commentary): ${{ inputs.text }}"
          body: |
            Automated ingest of **${{ inputs.text }}** via GitHub Actions.
            Importer: `importers/`. GitaSupersite enrichment: ${{ inputs.gita_supersite }}.

            Please spot-check before merging:
            - Devanagari fidelity of a few verses.
            - That commentary/author labels are attributed correctly.
            - `data/taxonomy.json` + `data/library.json` list the new layers
              (run `python tools/register_layers.py` if a new subtree is missing).
          add-paths: |
            data/**
