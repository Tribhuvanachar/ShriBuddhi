# Deploy Firestore security rules + composite indexes (project from FIREBASE_PROJECT_ID).
#
# Context: FIREBASE_SETUP.md §3-4 and GO_LIVE_ARCHITECTURE.md §3. The Firestore database
# itself is created once by hand in the Firebase console (production mode — see FIREBASE_SETUP.md
# §3); this workflow only pushes firebase/firestore.rules and firestore.indexes.json to it.
# Run it every time either file changes; rules take effect within a minute, indexes can take
# longer to build (the deploy step reports whether they're already built or building).
#
# 8 Sep 2026: run 1, right after FIREBASE_SERVICE_ACCOUNT was added, failed at the deploy step with:
#   Error: Request to https://firebaserules.googleapis.com/v1/projects/...:test had HTTP Error:
#   403, The caller does not have permission
# The secret itself is fine (Assemble step succeeded and logged the right client_email). This is a
# Google Cloud IAM role gap: the default firebase-adminsdk-* service account only carries "Firebase
# Admin SDK Administrator Service Agent" (roles/firebase.sdkAdminServiceAgent), which covers
# server-side Admin SDK reads/writes but NOT control-plane deploys (rules, indexes, hosting). Fix, in
# Google Cloud Console (not the Firebase console): IAM & Admin -> IAM, project sarvamula-org, find
# firebase-adminsdk-fbsvc@sarvamula-org.iam.gserviceaccount.com, Edit principal, Add another role ->
# "Firebase Admin" (roles/firebase.admin) -> Save. That one role covers rules, indexes, and hosting.
#
# Secrets: same service-account resolution as deploy-firebase-hosting.yml — see that file's header
# for the accepted secret names. Only rules + indexes are deployed here, never hosting or functions.

name: Deploy — Firestore rules & indexes

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 12 Sep 2026: this workflow moved here from bhumandala (Buddhi) -- the
      # firestore.rules/indexes to deploy have to come from THERE, not from
      # this repo's own (possibly stale) copy.
      - name: Checkout bhumandala (the site actually being deployed)
        uses: actions/checkout@v4
        with:
          repository: Tribhuvanachar/bhumandala
          token: ${{ secrets.BUDDHI_TOKEN }}
          path: bhumandala
      - name: Assemble the service-account key from the repository secrets
        # Same resolution as deploy-firebase-hosting.yml: accepts the whole JSON key in one of
        # several secret names, or the four separate fields. Prints only which secret NAMES were
        # found — never a value.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found. Add ONE secret FIREBASE_SERVICE_ACCOUNT holding the whole JSON key file, "
                    "or the fields FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID.")
              sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key (should start with -----BEGIN PRIVATE KEY-----)"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service account:", sa.get("client_email"), "| source:", ", ".join(found))
          PY
      - name: Sanity-check FIREBASE_PROJECT_ID without ever printing it
        # 8 Sep 2026: the earlier 403 (firebaserules) and this run's new 400 "Project ... not found"
        # (serviceusage) are both consistent with $PID NOT being the literal project id "sarvamula-org"
        # -- e.g. missing the "-org" suffix, wrong case, or a stray space/newline from how the secret
        # was pasted. This step reports only shape (length, suffix), never the value, so a wrong secret
        # can be diagnosed without a raw-value leak either way.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "PID length: ${#PID}"
          echo "PID ends with '-org': $( [[ "$PID" == *-org ]] && echo yes || echo no )"
          echo "PID ends with '.org': $( [[ "$PID" == *.org ]] && echo yes || echo no )"
          echo "PID has leading/trailing whitespace: $( [[ "$PID" != "$(echo -n "$PID" | xargs echo -n)" ]] && echo yes || echo no )"
          echo "PID is all-lowercase: $( [[ "$PID" == "$(echo "$PID" | tr '[:upper:]' '[:lower:]')" ]] && echo yes || echo no )"
      - name: Write .firebaserc (gitignored on purpose — the repo never carries a project id)
        run: |
          printf '{ "projects": { "default": "%s" } }\n' "${{ secrets.FIREBASE_PROJECT_ID }}" > bhumandala/firebase/.firebaserc
      - name: Deploy Firestore rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        working-directory: bhumandala/firebase
        run: |
          npm install -g firebase-tools@15 >/dev/null 2>&1
          firebase deploy --only firestore:rules,firestore:indexes --project "$PID" --non-interactive
          echo "Firestore rules + indexes deployed to project $PID"
