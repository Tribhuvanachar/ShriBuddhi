# Deploy the Cloud Functions (project from FIREBASE_PROJECT_ID). Needed for phoneOtpProvider
# 'whatsapp'/'msg91', WhatsApp broadcasts, and the admin workflow-dispatch panel — see
# FIREBASE_SETUP.md §6, §7, §12. Requires the Blaze plan (already active as of 8 Sep 2026) and,
# for the whatsapp/msg91/broadcast functions to actually work once deployed, the secrets pushed by
# push-firebase-function-secrets.yml — deploying this workflow first is fine, the functions that read
# a missing secret simply error at call time until it's pushed, they don't block the deploy itself.
#
# firebase/functions uses the v2 Cloud Functions SDK (functions run on Cloud Run under the hood),
# which is more permission-hungry to deploy than Hosting or Firestore rules. If this fails with a 403
# naming a different API (cloudfunctions.googleapis.com, run.googleapis.com, artifactregistry.googleapis.com,
# eventarc.googleapis.com, cloudscheduler.googleapis.com, or "iam.serviceaccounts.actAs"), that is the
# same class of problem deploy-firestore.yml hit and fixed on 8 Sep 2026: read the exact error, it
# names the missing role; grant it to firebase-adminsdk-fbsvc@sarvamula-org.iam.gserviceaccount.com
# in Google Cloud Console -> IAM & Admin -> IAM, the same way "Firebase Admin" was added. Don't guess
# a bundle of roles up front — grant only what the actual error asks for, one at a time.
#
# 8 Sep 2026, run 1: hit "Error: Permissions denied enabling artifactregistry.googleapis.com. Please
# ask a project owner to visit [console link] to enable this service." Not an IAM-role problem — the
# CLI auto-enabled cloudbuild.googleapis.com and cloudfunctions.googleapis.com fine, then a project
# owner (not the service account) needs to manually enable Artifact Registry API once, the same way
# Firestore/Rules APIs were checked earlier: Google Cloud Console -> APIs & Services -> Library ->
# search "Artifact Registry API" -> Enable. One-time; re-dispatch after.

name: Deploy — Firebase Functions

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: a specific function or comma list (e.g. "requestOtp,verifyOtp"). Leave blank to deploy all functions.'
        required: false
        default: ""
      corpus_bucket:
        description: 'Authenticated corpus proxy: the PRIVATE GCS bucket holding the corpus (e.g. sarvamula-corpus). Blank leaves corpusFile switched off — it answers 503 and the reader keeps using static files. Upload with tools/migrate_corpus_to_gcs.py first.'
        required: false
        default: ""
      corpus_prefix:
        description: 'Object-name prefix inside that bucket. Must match the --prefix the migration script used.'
        required: false
        default: "corpus/"
      corpus_config_url:
        description: 'Where corpusFile reads the live shelf from (usually https://<project>.web.app/admin/config/library-overrides.json). Blank falls back to the copy bundled at deploy time, below.'
        required: false
        default: ""
      install_pdf_renderer:
        description: 'Install puppeteer so renderBook can return real PDFs. Adds ~170 MB to the image and a few minutes to the build; leave off and renderBook answers 503 while every other function deploys normally.'
        required: false
        default: false
        type: boolean
      # Until 22 Sep 2026 the three values below were HARDCODED into the .env
      # step as mock/mock/blank, with no way to change them. That made the
      # payments half of SETUP_PLAYBOOK.md §D impossible to finish: you could
      # get Razorpay keys, push RAZORPAY_KEY_SECRET into Secret Manager and
      # create the webhook, and the deployed createDonation would still be on
      # the mock gateway with no key id -- and `mock` is emulator-only
      # (payment-providers.js assertGatewayAllowed), so every donation threw
      # "Donations are not accepting payments on this deployment yet."
      payment_gateway:
        description: 'Default payment gateway for this deployment. mock is EMULATOR-ONLY — a deployed mock refuses every donation by design.'
        required: false
        type: choice
        options: [mock, razorpay, cashfree]
        default: mock
      payment_gateways_enabled:
        description: 'Comma list a client may ask for, e.g. "razorpay" or "razorpay,cashfree". Must contain payment_gateway. Anything else the client asks for falls back to the default.'
        required: false
        default: "mock"
      razorpay_key_id:
        description: 'Razorpay Key Id (rzp_test_… or rzp_live_…). NOT a secret — it is sent to the browser. Required when razorpay is enabled. The paired Key SECRET is a GitHub secret pushed by push-firebase-function-secrets.yml, never typed here.'
        required: false
        default: ""
      cashfree_env:
        description: 'Cashfree only: sandbox or production.'
        required: false
        type: choice
        options: [sandbox, production]
        default: sandbox

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 16 Sep 2026: firebase/ now lives in THIS repo. It used to be checked out from the
      # public site repo, because that is where the code sat -- which put the server side of
      # sarvamula.org (OTP, payments, WhatsApp, the workflow dispatcher and its catalogue) in
      # a repository whose only job is to hold readable text. The pipeline was private and the
      # payload was public, which is backwards. One checkout now; every `firebase/...` path
      # below is this repo's own.
      - name: Assemble the service-account key from the repository secrets
        # Same resolution as deploy-firebase-hosting.yml — see that file's header for the accepted
        # secret names. Prints only which secret NAMES were found, never a value.
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found. Add ONE secret FIREBASE_SERVICE_ACCOUNT holding the whole JSON key file, "
                    "or the fields FIREBASE_PRIVATE_KEY, FIREBASE_PRIVATE_KEY_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_CLIENT_ID.")
              sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key (should start with -----BEGIN PRIVATE KEY-----)"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service account:", sa.get("client_email"), "| source:", ", ".join(found))
          PY
      - name: Write .firebaserc (gitignored on purpose — the repo never carries a project id)
        run: |
          printf '{ "projects": { "default": "%s" } }\n' "${{ secrets.FIREBASE_PROJECT_ID }}" > firebase/.firebaserc
      - name: Bundle the shelf snapshot the corpus proxy falls back to
        # corpusFile reads the LIVE shelf over HTTPS so widening it is a commit
        # plus a Hosting deploy, not a function redeploy. This copy is the floor
        # under that: if the fetch fails on a cold start the function must not
        # end up with "no shelf", because no shelf means everything is open —
        # failing open on a network blip is precisely what the proxy exists to
        # prevent. Worst case with the snapshot is a stale shelf, and a stale one
        # is only wrong in the widening direction, since the deploy that narrows
        # it carries the new snapshot along.
        run: |
          cp admin/config/library-overrides.json firebase/functions/library-overrides.json
          python3 -c "import json;d=json.load(open('firebase/functions/library-overrides.json'));print('bundled shelf:', 'enabled' if (d.get('shelf') or {}).get('enabled') else 'disabled', '|', len((d.get('shelf') or {}).get('allow') or []), 'allow entries')"
      - name: Write the non-secret params Cloud Functions params need
        # defineString() params come from this .env at deploy time. It holds no
        # credentials — a bucket name, two URLs, and a handful of plain config
        # strings — and is written fresh on every run so a blank input
        # genuinely means "off" rather than "keep whatever the last deploy set".
        #
        # 13 Sep 2026: firebase-tools refuses to fall back to a defineString()'s
        # own code-level `default` in --non-interactive mode -- it wants an
        # explicit value here for EVERY declared param or the deploy fails
        # outright listing all of them with no value, `--only` or not (same
        # class of problem as the Secret Manager one push-firebase-function-secrets.yml
        # already documents). The twelve below are every non-secret param
        # index.js declares beyond the three corpus ones already handled here;
        # values are each param's own already-declared default.
        env:
          CORPUS_BUCKET: ${{ inputs.corpus_bucket }}
          CORPUS_PREFIX: ${{ inputs.corpus_prefix }}
          CORPUS_CONFIG_URL: ${{ inputs.corpus_config_url }}
          PAYMENT_GATEWAY: ${{ inputs.payment_gateway }}
          PAYMENT_GATEWAYS_ENABLED: ${{ inputs.payment_gateways_enabled }}
          RAZORPAY_KEY_ID: ${{ inputs.razorpay_key_id }}
          CASHFREE_ENV: ${{ inputs.cashfree_env }}
        run: |
          set -euo pipefail
          GATEWAY="${PAYMENT_GATEWAY:-mock}"
          ENABLED="${PAYMENT_GATEWAYS_ENABLED:-mock}"

          # Catch the three ways this is easy to get half-right, here, rather
          # than at the first live donation.
          case ",$ENABLED," in
            *",$GATEWAY,"*) ;;
            *) echo "::error::payment_gateway is \"$GATEWAY\" but payment_gateways_enabled is \"$ENABLED\", which does not contain it. createDonation would fall back to a gateway this deployment does not accept."; exit 1 ;;
          esac
          case ",$ENABLED," in
            *",razorpay,"*)
              if [ -z "${RAZORPAY_KEY_ID}" ]; then
                echo "::error::razorpay is enabled but razorpay_key_id is blank. The Key Id is the public half of the pair (dashboard.razorpay.com -> Settings -> API Keys) and the browser needs it to open checkout. The Key SECRET is not set here -- it belongs in the GitHub secret RAZORPAY_KEY_SECRET, pushed by push-firebase-function-secrets.yml."
                exit 1
              fi
              case "$RAZORPAY_KEY_ID" in
                rzp_test_*|rzp_live_*) ;;
                *) echo "::error::razorpay_key_id should start with rzp_test_ or rzp_live_. Got something else -- this is probably the Key Secret, which must never be typed into a workflow input (it would be recorded in the run's parameters in clear text). If you pasted a secret here, rotate it at dashboard.razorpay.com now."; exit 1 ;;
              esac
              # Printing it is fine: the Key Id is public by design -- the
              # browser receives it to open Razorpay checkout.
              echo "::notice::Razorpay enabled with key id $RAZORPAY_KEY_ID" ;;
          esac
          if [ "$GATEWAY" = "mock" ]; then
            echo "::warning::PAYMENT_GATEWAY=mock. mock is emulator-only (payment-providers.js assertGatewayAllowed), so every deployed donation will be refused with \"Donations are not accepting payments on this deployment yet.\" That is the safe default, not a fault -- set payment_gateway when you mean to take money."
          fi
          {
            echo "CORPUS_BUCKET=${CORPUS_BUCKET}"
            echo "CORPUS_PREFIX=${CORPUS_PREFIX:-corpus/}"
            echo "CORPUS_CONFIG_URL=${CORPUS_CONFIG_URL}"
            echo "OTP_PROVIDER=whatsapp"
            echo "OTP_TEMPLATE_NAME=dge_otp"
            echo "OTP_TEMPLATE_LANG=en"
            echo "OTP_DEFAULT_COUNTRY=91"
            echo "MSG91_TEMPLATE_ID="
            echo "GITHUB_REPO=Tribhuvanachar/shribuddhi"
            echo "PAYMENT_GATEWAY=${GATEWAY}"
            echo "PAYMENT_GATEWAYS_ENABLED=${ENABLED}"
            echo "CASHFREE_ENV=${CASHFREE_ENV:-sandbox}"
            echo "CASHFREE_API_VERSION=2023-08-01"
            echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}"
            echo "EMAIL_PROVIDER=console"
          } > firebase/functions/.env
          cat firebase/functions/.env
          if [ -z "$CORPUS_BUCKET" ]; then
            echo "::notice::corpusFile will answer 503 (no CORPUS_BUCKET). The reader keeps reading static files."
          fi
      - name: Install function dependencies
        env:
          WANT_PDF: ${{ inputs.install_pdf_renderer }}
        run: |
          cd firebase/functions
          if [ "$WANT_PDF" = "true" ]; then
            npm install
            # Prove the browser is actually inside the directory that gets
            # deployed. Without this the build passes and renderBook fails at
            # runtime with "Could not find Chrome", which reads like a code bug.
            ls -la .puppeteer-cache 2>/dev/null || { echo "puppeteer did not populate .puppeteer-cache — see .puppeteerrc.cjs"; exit 1; }
          else
            npm install --omit=optional
            echo "::notice::renderBook will answer 503 (puppeteer not installed). The book builder's Prepare → print route is unaffected."
          fi
      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ONLY: ${{ inputs.only }}
        run: |
          npm install -g firebase-tools@15 >/dev/null 2>&1
          cd firebase
          if [ -n "$ONLY" ]; then
            TARGET="$(echo "$ONLY" | sed 's/^/functions:/; s/,/,functions:/g')"
          else
            TARGET="functions"
          fi
          # --force also auto-sets an Artifact Registry cleanup policy for build images on
          # first deploy -- without it, firebase-tools exits 1 AFTER a fully successful
          # function deploy just because that one-time policy step was skipped, which looks
          # like a failure even when every function deployed fine. Discovered 10 Sep 2026.
          firebase deploy --only "$TARGET" --project "$PID" --non-interactive --force
          echo "Functions deployed to project $PID (region asia-south1, per functions/index.js setGlobalOptions)"
