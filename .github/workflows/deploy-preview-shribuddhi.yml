# One-off: deploy THIS repo's own working tree to a Firebase Hosting PREVIEW
# channel, so the lead can click-test a change before it goes through the
# real promotion pipeline (ShriBuddhi -> BrahmaBuddhi/bhumandala -> Jagat).
#
# Why this exists instead of reusing deploy-firebase-hosting.yml: that
# workflow deploys bhumandala's checkout on purpose (see its own header) --
# bhumandala is the public side, with admin/ and provenance already gone.
# Deploying ShriBuddhi straight is deliberately NOT what that workflow does.
#
# Why this can't just run tools/publish_clean_repo.py instead: that tool
# refuses to build at all right now (8 files still name the old repo/host,
# `--scan` on 20 Sep 2026), and even once clean it hard-excludes every path
# under data/darshana/vedanta/dvaita/DvaitaVedantaIn on principle --
# tools/opaque_ids.py's STRUCTURE_PRIVATE, added 19-20 Sep 2026: the folder
# name alone names the source website, so nothing under it may ship at a
# path a reader (or a crawler) can see. sutra_prasthana/anuvyakhyana_sudha
# lives under that folder, so the real pipeline will never preview it.
#
# This workflow exists ONLY because the lead explicitly asked for a private
# link to test that specific content NOW, and explicitly authorized
# overriding the DvaitaVedantaIn exclusion for exactly one unlisted,
# expiring preview channel -- not a public release. It still strips
# admin/ (via firebase-hosting.json's own ignore list, unchanged) and
# refuses to touch the `live` channel, so it can never become the
# permanent public URL by accident.
#
# DELETE THIS FILE once the real pipeline (promote_to_tattvavada.py /
# publish_opaque_rewrite.py) can preview this content properly -- it is
# a deliberate, temporary exception, not a second deploy path to keep.
name: Deploy — ShriBuddhi preview (temporary, private link only)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Firebase Hosting preview channel name (NEVER 'live' -- rejected below)"
        required: true
        default: "nyaya-sudha-test"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a 'live' channel
        run: |
          if [ "${{ inputs.channel }}" = "live" ]; then
            echo "This workflow only makes preview channels. Use deploy-firebase-hosting.yml for live." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Assemble the service-account key from the repository secrets
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_JSON_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SA_JSON_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARVAMULA_ORG }}
          SA_JSON_4: ${{ secrets.FIREBASE_ADMIN_SDK }}
          SA_JSON_5: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          F_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          F_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          F_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          F_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          found = []
          sa = None
          for name in ("SA_JSON_1", "SA_JSON_2", "SA_JSON_3", "SA_JSON_4", "SA_JSON_5"):
              v = os.environ.get(name, "").strip()
              if v:
                  try:
                      sa = json.loads(v); found.append(name); break
                  except Exception:
                      print(f"{name} is set but is not valid JSON")
          if sa is None:
              f = {k: os.environ.get(k, "") for k in ("F_PRIVATE_KEY", "F_PRIVATE_KEY_ID", "F_CLIENT_EMAIL", "F_CLIENT_ID")}
              present = [k for k, v in f.items() if v.strip()]
              print("per-field secrets present:", ", ".join(present) or "none")
              if f["F_PRIVATE_KEY"].strip() and f["F_CLIENT_EMAIL"].strip():
                  key = f["F_PRIVATE_KEY"].replace("\\n", "\n")
                  email = f["F_CLIENT_EMAIL"].strip()
                  sa = {"type": "service_account", "project_id": os.environ["PID"], "private_key_id": f["F_PRIVATE_KEY_ID"].strip(),
                        "private_key": key, "client_email": email, "client_id": f["F_CLIENT_ID"].strip(),
                        "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
                        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                        "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/" + email.replace("@", "%40"),
                        "universe_domain": "googleapis.com"}
                  found.append("assembled from FIREBASE_PRIVATE_KEY + FIREBASE_CLIENT_EMAIL (+ id fields)")
          if sa is None:
              print("No service-account key found."); sys.exit(1)
          if not str(sa.get("private_key", "")).startswith("-----BEGIN"):
              print("private_key does not look like a PEM key"); sys.exit(1)
          os.makedirs(os.path.expanduser("~/.sa"), exist_ok=True)
          with open(os.path.expanduser("~/.sa/key.json"), "w") as fh:
              json.dump(sa, fh)
          print("service account:", sa.get("client_email"), "| source:", ", ".join(found))
          PY
      - name: Deploy this checkout to a Hosting preview channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.sa/key.json
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          npm install -g firebase-tools@15 >/dev/null 2>&1
          firebase hosting:channel:deploy "$CHANNEL" --project "$PID" --expires 7d --non-interactive --config firebase-hosting.json
