# Delete the branches listed in config/cleanup/branch-plan.json, group by group.
#
# This is the one-click way to do the clean-up. A session cannot delete a remote branch (that is
# a destructive git action an operator has to approve); this workflow can, with the repository's own
# token, because a person starts it:  Actions -> "Clean up branches" -> Run workflow.
#
#   groups   which groups of the plan to delete: verified | superseded | decide (comma-separated)
#   confirm  must be exactly DELETE
#   dry_run  default ON: lists what WOULD go, deletes nothing. Untick to delete.
#
# Safety: only branches NAMED in the plan are touched, the plan's `keep` group and the default
# branch are never deleted whatever is ticked, and a branch that no longer exists is skipped.
# Commits on a deleted branch that are on no other branch become unreachable (GitHub keeps them a
# while, then collects them) -- the plan's own notes say, group by group, why each is safe.
name: Clean up branches

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups to delete (verified, superseded, decide), comma-separated"
        default: "verified"
      confirm:
        description: "Type DELETE to allow deletion"
        default: ""
      dry_run:
        description: "List only, delete nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete
        env:
          GROUPS_IN: ${{ inputs.groups }}
          CONFIRM: ${{ inputs.confirm }}
          DRY: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          plan = json.load(open("config/cleanup/branch-plan.json"))["groups"]
          want = [g.strip() for g in os.environ["GROUPS_IN"].split(",") if g.strip()]
          bad = [g for g in want if g not in plan or g == "keep"]
          if bad:
              sys.exit("unknown or protected group(s): %s" % ", ".join(bad))
          dry = os.environ["DRY"] == "true"
          if not dry and os.environ["CONFIRM"] != "DELETE":
              sys.exit("confirm must be DELETE to delete; run with dry_run on to preview")
          protected = set(plan["keep"]) | {os.environ["DEFAULT_BRANCH"]}
          live = set(l.split("refs/heads/", 1)[1] for l in subprocess.run(
              ["git", "ls-remote", "--heads", "origin"], capture_output=True, text=True, check=True).stdout.splitlines())
          todo = [b for g in want for b in plan[g] if b in live and b not in protected]
          print("%s %d branch(es) from group(s) %s" % ("WOULD DELETE" if dry else "DELETING", len(todo), ", ".join(want)))
          out = []
          for b in todo:
              if dry:
                  print("  -", b)
                  continue
              r = subprocess.run(["git", "push", "origin", "--delete", b], capture_output=True, text=True)
              print("  %s %s" % ("deleted" if r.returncode == 0 else "FAILED ", b), (r.stderr.strip()[-120:] if r.returncode else ""))
              out.append((b, r.returncode))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Branch clean-up (%s)\n- groups: %s\n- %s: %d\n" % ("dry run" if dry else "deleted", ", ".join(want), "listed" if dry else "attempted", len(todo)))
              if not dry:
                  fh.write("- failed: %d\n" % sum(1 for _, rc in out if rc))
          if not dry and any(rc for _, rc in out):
              sys.exit(1)
          PY
