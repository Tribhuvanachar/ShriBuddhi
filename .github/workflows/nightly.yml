name: Nightly — library sync and inventory

# Midnight housekeeping, so the library catalogue, the status snapshot and
# the repository inventory never drift more than a day from the data.
#
#   00:00 IST (18:30 UTC)  this job
#   00:30 IST (19:00 UTC)  reindex.yml, scheduled — rebuilds and republishes
#                          the search index only if data changed since the
#                          last publish, and bumps the CDN pin itself
#
# What it commits, and where:
#   * generated files straight to main — admin/config/library-status.json,
#     admin/config/repo-map.json (branch snapshots refreshed),
#     docs/REPO_INVENTORY.md. Nobody hand-edits these; a bot commit is the
#     right author.
#   * catalogue repairs (library.json / taxonomy.json from
#     `audit_library.py --fix`: orphaned folders registered, stale flags,
#     facets re-derived) to ONE rolling pull request, `nightly/library-sync`,
#     updated in place each night. Those change what readers can browse, so a
#     person merges them — but the diff is ready every morning.
#
# The names audit runs as a report into the job summary (docs/NAMING_CONVENTIONS.md).

on:
  # Timing lives in config/schedules.json (IST) and is started by scheduler.yml: change it there, not here.
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open/update the library-sync pull request (off = report only)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml

      - name: Structural check first (a broken data.json stops everything)
        run: python3 tools/validate_data.py

      - name: Refresh generated files (status, inventory, names report)
        run: |
          set -euo pipefail
          python3 tools/gen_library_status.py
          python3 tools/build_repo_inventory.py
          python3 tools/build_sitemap.py
          python3 tools/audit_names.py | tee /tmp/names.md
          {
            echo "## Names audit (report only)"
            echo ""
            head -40 /tmp/names.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated files to ShriBuddhi's main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/config/library-status.json admin/config/repo-map.json docs/REPO_INVENTORY.md sitemap.xml robots.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Generated files unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Nightly: refresh library status and repository inventory ($(TZ=Asia/Kolkata date +'%d %b %Y'))"
            for attempt in 1 2 3; do
              git push -q origin HEAD:main && break
              git pull -q --rebase origin main || true
              sleep $((attempt * 3))
            done
            echo "Generated files refreshed and committed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Catalogue repairs (audit_library.py --fix)
        id: fix
        run: |
          set -euo pipefail
          python3 tools/audit_library.py > /tmp/audit_before.md || true
          python3 tools/audit_library.py --fix > /tmp/audit_fix.md || true
          python3 tools/validate_data.py
          if git diff --quiet -- data/library.json data/taxonomy.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalogue in step with disk — nothing to repair." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Catalogue repairs proposed (pull request nightly/library-sync)"
              echo ""
              head -30 /tmp/audit_before.md
              echo ""
              git --no-pager diff --stat -- data/library.json data/taxonomy.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The default GITHUB_TOKEN can open this pull request only if the repository
      # allows it: Settings -> Actions -> General -> "Allow GitHub Actions to create
      # and approve pull requests". If that is off the step fails, and failing the
      # whole run over it would throw away the generated-files commit above, so it
      # is allowed to fail and the next step says what is left to do.
      - name: Open or update the library-sync pull request (against ShriBuddhi)
        id: library_sync_pr
        continue-on-error: true
        if: steps.fix.outputs.changed == 'true' && inputs.open_pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nightly/library-sync
          title: "Nightly library sync: catalogue repairs from audit_library.py --fix"
          commit-message: "Nightly library sync: register orphaned folders, refresh flags and facets"
          body: |
            `tools/audit_library.py --fix` found the catalogue out of step with the
            data on disk and repaired it. This PR is rolled forward every night
            until merged; nothing here is hand-written.

            Review the diff of `data/library.json` / `data/taxonomy.json`
            — new entries become visible in the Library once merged.
          add-paths: |
            data/library.json
            data/taxonomy.json
          delete-branch: true

      - name: Say where the sync landed, and what it could not do
        if: always() && steps.fix.outputs.changed == 'true'
        run: |
          {
            if [ "${{ steps.library_sync_pr.outcome }}" = "success" ]; then
              echo "Library sync is on \`nightly/library-sync\` and its pull request is open."
            else
              echo "### Library sync NOT opened as a pull request"
              echo ""
              echo "Opening the PR was refused. Turn on Settings -> Actions -> General ->"
              echo "\"Allow GitHub Actions to create and approve pull requests\", then re-run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
