<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('sub').textContent = DATA.meta.node_count + " figures · drag to explore the lineage in 3D";
const COLORS={mula:"#8a94a6",core:"#c9a227",lay:"#6b7280",uttaradi:"#e8574c",vyasaraja:"#4f9d69",raghavendra:"#f4a020",
 sripadaraja:"#c678dd",kashi:"#00b3a4",gokarna:"#2aa7c7",palimaru:"#5aa9e6",adamaru:"#e6739f",krishnapura:"#7c83fd",
 puttige:"#f6b26b",shirur:"#93c47d",sode:"#e0b24a",kaniyooru:"#c98bdb",pejawara:"#ff8a5c",peripheral:"#7f8c9b",haridasa:"#d9b310"};
const colorOf=m=>COLORS[m]||"#9aa6b6";
const byId=new Map(DATA.nodes.map(n=>[n.id,n]));
const childrenMap=new Map();
DATA.nodes.forEach(n=>{if(n.guru){(childrenMap.get(n.guru)||childrenMap.set(n.guru,[]).get(n.guru)).push(n);}});
function build(n){const o={data:n,children:(childrenMap.get(n.id)||[]).map(build)};o.children.forEach(c=>c.parent=o);return o;}
const rootT=build(DATA.nodes.find(n=>!n.guru));

// ---- 3D vector helpers ----
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sc=(a,s)=>V(a.x*s,a.y*s,a.z*s);
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const len=a=>Math.hypot(a.x,a.y,a.z)||1e-9;
const norm=a=>sc(a,1/len(a));
function perp(d){let a=Math.abs(d.y)<0.9?V(0,1,0):V(1,0,0);let u=norm(cross(d,a));let v=cross(d,u);return{u,v};}
function fib(i,n){const ga=Math.PI*(3-Math.sqrt(5));const y=1-(i+0.5)/n*2;const r=Math.sqrt(Math.max(0,1-y*y));const t=ga*i;return V(Math.cos(t)*r,y,Math.sin(t)*r);}

// ---- deterministic 3D radial cone-tree layout ----
const NODES=[]; // flat list with pos
(function layout(node,pos,dir,depth){
  node.pos=pos; node.depth=depth; NODES.push(node);
  const kids=node.children||[]; const n=kids.length; if(!n) return;
  const seg=(46*Math.pow(0.9,depth))+16;
  const {u,v}=perp(dir);
  for(let i=0;i<n;i++){
    let cdir;
    if(depth===0){ cdir=fib(i,n); }
    else if(n===1){ const bend=0.13; cdir=norm(add(sc(dir,Math.cos(bend)),sc(u,Math.sin(bend)))); }
    else{
      const half=Math.min(1.35,0.55+1.1/Math.sqrt(n));
      const t=2*Math.PI*i/n + depth*0.7;
      const a=half*Math.sqrt((i+0.6)/n);
      cdir=norm(add(sc(dir,Math.cos(a)), sc(add(sc(u,Math.cos(t)),sc(v,Math.sin(t))),Math.sin(a))));
    }
    layout(kids[i], add(pos,sc(cdir,seg)), cdir, depth+1);
  }
})(rootT, V(0,0,0), V(0,1,0), 0);

// center & scale
let cx=0,cy=0,cz=0; NODES.forEach(n=>{cx+=n.pos.x;cy+=n.pos.y;cz+=n.pos.z;});
cx/=NODES.length;cy/=NODES.length;cz/=NODES.length;
let maxR=0; NODES.forEach(n=>{n.pos=V(n.pos.x-cx,n.pos.y-cy,n.pos.z-cz);maxR=Math.max(maxR,len(n.pos));});
const WORLD=340/maxR; NODES.forEach(n=>n.pos=sc(n.pos,WORLD));
// which nodes show a label by default
NODES.forEach(n=>{n.lbl=(n.data.tag==="acharya"&&n.data.confidence==="high")||(n.data.role||"").startsWith("present")||["madhva","jayatirtha","vyasatirtha","raghavendra","vadiraja","sripadaraja","akshobhya","padmanabha","vijayadhwaja","vishvesha"].includes(n.data.id);});
const EDGES=NODES.filter(n=>n.parent).map(n=>[n.parent,n]);

// ---- canvas / camera ----
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize); resize();
let rotY=0.5, rotX=-0.35, tRotY=0.5,tRotX=-0.35, zoom=1,tZoom=1, spin=true, showLabels=true;
let selected=null, hover=null;
const F=620; // focal
function rot(p){
  // rotate Y then X
  let cyr=Math.cos(rotY),syr=Math.sin(rotY);
  let x=p.x*cyr - p.z*syr, z=p.x*syr + p.z*cyr, y=p.y;
  let cxr=Math.cos(rotX),sxr=Math.sin(rotX);
  let y2=y*cxr - z*sxr, z2=y*sxr + z*cxr;
  return {x:x, y:y2, z:z2};
}
function project(p){const r=rot(p);const s=zoom*F/(F+ r.z + 60);return {x:W/2+r.x*s, y:H/2+r.y*s, z:r.z, s};}

let activeM=new Set(Object.keys(COLORS));
function draw(){
  // ease
  rotY+=(tRotY-rotY)*0.12; rotX+=(tRotX-rotX)*0.12; zoom+=(tZoom-zoom)*0.12;
  if(spin && !drag) tRotY+=0.0022;
  ctx.clearRect(0,0,W,H);
  // project all
  const pr=NODES.map(n=>({n,p:project(n.pos)}));
  const pm=new Map(pr.map(o=>[o.n,o.p]));
  // edges (draw back-to-front)
  const edrawn=EDGES.map(([a,b])=>({a,b,pa:pm.get(a),pb:pm.get(b),z:(pm.get(a).z+pm.get(b).z)/2}))
    .sort((A,B)=>B.z-A.z);
  ctx.lineWidth=1;
  edrawn.forEach(e=>{
    const on=activeM.has(e.b.data.matha)||["mula","core"].includes(e.b.data.matha);
    const dz=(e.z+400)/800; const al=Math.max(.05,Math.min(.5,dz))*(on?1:.15);
    ctx.strokeStyle=`rgba(120,140,165,${al})`;
    ctx.beginPath();ctx.moveTo(e.pa.x,e.pa.y);ctx.lineTo(e.pb.x,e.pb.y);ctx.stroke();
  });
  // nodes back-to-front
  const ndrawn=pr.slice().sort((A,B)=>B.p.z-A.p.z);
  ndrawn.forEach(o=>{
    const n=o.n,p=o.p; const on=activeM.has(n.data.matha)||["mula","core"].includes(n.data.matha);
    const depthF=Math.max(.25,Math.min(1,(p.z+420)/760)); // closer=brighter
    let r=(n.data.tag==="acharya"?3.6:3.0)*p.s* (n===selected?1.7:1);
    r=Math.max(1.4,r);
    const col=colorOf(n.data.matha);
    ctx.globalAlpha=on?1:0.18;
    // glow for selected/hover/present
    if(n===selected||n===hover){ctx.beginPath();ctx.arc(p.x,p.y,r+6,0,7);ctx.fillStyle='rgba(255,209,102,.18)';ctx.fill();}
    if((n.data.role||"").startsWith("present")){ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,7);ctx.strokeStyle='rgba(255,209,102,.9)';ctx.lineWidth=1.3;ctx.stroke();}
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=shade(col,depthF); ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle=shade(col,Math.min(1,depthF+0.25)); ctx.stroke();
    // labels
    if(on && (n===selected||n===hover || (showLabels && n.lbl && depthF>0.55))){
      ctx.globalAlpha=on?Math.min(1,depthF+0.3):0.2;
      ctx.font=(n===selected?'600 12px':'11px')+' -apple-system,Segoe UI,Roboto,sans-serif';
      const tx=p.x+r+4, ty=p.y+3.5;
      ctx.lineWidth=3;ctx.strokeStyle='rgba(6,9,13,.9)';ctx.strokeText(n.data.name,tx,ty);
      ctx.fillStyle='#e8ecf3';ctx.fillText(n.data.name,tx,ty);
    }
    o._r=r; o._p=p;
  });
  ctx.globalAlpha=1;
  lastPr=ndrawn;
  requestAnimationFrame(draw);
}
function shade(hex,f){ // multiply rgb by f (fog)
  const c=hex.replace('#','');const R=parseInt(c.substr(0,2),16),G=parseInt(c.substr(2,2),16),B=parseInt(c.substr(4,2),16);
  const g=v=>Math.round(18+(v-18)*f); return `rgb(${g(R)},${g(G)},${g(B)})`;
}
let lastPr=[];
requestAnimationFrame(draw);

// ---- interaction ----
let drag=false,px=0,py=0,moved=0;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    tRotY+=dx*0.006; tRotX+=dy*0.006; tRotX=Math.max(-1.4,Math.min(1.4,tRotX));}
  else{ hover=pick(e.clientX,e.clientY); cv.style.cursor=hover?'pointer':'grab'; }
});
cv.addEventListener('pointerup',e=>{drag=false; if(moved<5){const n=pick(e.clientX,e.clientY); if(n){selected=n;openDetail(n.data);} }});
cv.addEventListener('wheel',e=>{e.preventDefault();tZoom=Math.max(0.4,Math.min(4,tZoom*(e.deltaY<0?1.12:0.89)));},{passive:false});
// pinch
let pd=0;
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)tZoom=Math.max(0.4,Math.min(4,tZoom*d/pd));pd=d;e.preventDefault();}},{passive:false});
cv.addEventListener('touchend',()=>pd=0);
function pick(mx,my){
  const rect=cv.getBoundingClientRect();mx-=rect.left;my-=rect.top;
  let best=null,bd=14;
  for(let i=lastPr.length-1;i>=0;i--){const o=lastPr[i];const on=activeM.has(o.n.data.matha)||["mula","core"].includes(o.n.data.matha);if(!on)continue;
    const dx=o._p.x-mx,dy=o._p.y-my,d=Math.hypot(dx,dy);if(d<Math.max(bd,o._r+5)&&d<bd){bd=d;best=o.n;}}
  return best;
}

// ---- fly to a node ----
function flyTo(n){
  selected=n; spin=false; document.getElementById('spin').classList.remove('on');
  // rotate so node comes toward camera front (negative z after rotation) and centered
  const p=n.pos;
  tRotY=-Math.atan2(p.x,p.z);
  tRotX=Math.max(-1.3,Math.min(1.3, Math.atan2(p.y,Math.hypot(p.x,p.z))));
  tZoom=1.8;
}

// ---- search ----
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{
  const q=searchEl.value.trim().toLowerCase(); if(!q)return;
  const m=NODES.find(n=>(n.data.name||'').toLowerCase().includes(q))||
          NODES.find(n=>((n.data.place||'')+(n.data.brindavana||'')).toLowerCase().includes(q));
  if(m){flyTo(m);openDetail(m.data);}
});

// ---- buttons ----
const spinBtn=document.getElementById('spin');spinBtn.onclick=()=>{spin=!spin;spinBtn.classList.toggle('on',spin);};
const lblBtn=document.getElementById('lbls');lblBtn.onclick=()=>{showLabels=!showLabels;lblBtn.classList.toggle('on',showLabels);};
document.getElementById('reset').onclick=()=>{tRotY=0.5;tRotX=-0.35;tZoom=1;selected=null;searchEl.value='';spin=true;spinBtn.classList.add('on');detail.classList.remove('open');};

// ---- legend ----
const legOrder=["mula","core","uttaradi","raghavendra","vyasaraja","sripadaraja","kashi","gokarna","palimaru","adamaru","krishnapura","puttige","shirur","sode","kaniyooru","pejawara","peripheral","haridasa","lay"];
const used=[...new Set(NODES.map(n=>n.data.matha))];
const legItems=document.getElementById('legitems');
legOrder.filter(m=>used.includes(m)&&COLORS[m]).forEach(m=>{
  const el=document.createElement('div');el.className='lg';
  el.innerHTML=`<span class="sw" style="background:${colorOf(m)}"></span><span>${DATA.matha_labels[m]||m}</span>`;
  el.onclick=()=>{if(activeM.has(m)){activeM.delete(m);el.classList.add('off');}else{activeM.add(m);el.classList.remove('off');}};
  legItems.appendChild(el);
});
const legToggle=document.getElementById('legtoggle'),legend=document.getElementById('legend');
legToggle.onclick=()=>{const v=legend.style.display==='none';legend.style.display=v?'block':'none';legToggle.style.display=v?'none':'block';};

// ---- detail panel (shared) ----
const detail=document.getElementById('detail');
document.getElementById('close').onclick=()=>detail.classList.remove('open');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function openDetail(n){
  document.getElementById('d_name').textContent=n.name;
  document.getElementById('d_titles').textContent=(n.titles||[]).join(' · ');
  document.getElementById('d_purva').textContent=n.purva?'Purvashrama: '+n.purva:'';
  const b=document.getElementById('d_body');b.innerHTML='';
  const add=(k,v)=>{if(!v)return;const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`;b.appendChild(r);};
  add('Lineage',`<span class="chip" style="border-color:${colorOf(n.matha)}">${DATA.matha_labels[n.matha]||n.matha}</span>`);
  if(n.role)add('Status',`<b style="color:var(--gold)">${esc(n.role)}</b>`);
  add('Period',esc(n.period));
  if(n.guru&&byId.get(n.guru))add('Guru / predecessor',esc(byId.get(n.guru).name));
  const kids=(childrenMap.get(n.id)||[]).map(k=>`<span class="chip">${esc(k.name)}</span>`);
  if(kids.length)add('Immediate disciples',kids.join(''));
  if(n.brindavana)add('Brindavana / resting place',esc(n.brindavana)+(n.place?` — <span style="color:var(--muted)">${esc(n.place)}</span>`:''));
  else if(n.place)add('Place',esc(n.place));
  const _img=(DATA.brindavana_images||{})[n.id];
  if(_img && _img.image){
    const _cap=[_img.image_credit,_img.image_licence].filter(Boolean).join(' · ');
    add('Brindavana image',`<a href="${_img.image_page||_img.image}" target="_blank" rel="noopener"><img src="${_img.image}" alt="${esc(_img.brindavana||'Brindavana')}" loading="lazy" style="max-width:100%;border-radius:8px;margin-top:4px"></a>`+(_cap?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(_cap)}</div>`:'')+`<div style="font-size:11px;color:var(--muted)">via Wikimedia Commons</div>`);
  }
  if(n.works&&n.works.length)add('Principal works',`<ul class="works">${n.works.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`);
  add('Contribution',esc(n.contrib));
  if(n.contemporaries&&n.contemporaries.length)add('Contemporaries (by overlap)',n.contemporaries.map(c=>`<span class="chip">${esc(c)}</span>`).join(''));
  add('Confidence',`<span class="conf ${n.confidence}">${n.confidence}</span>`);
  if(n.note)add('Note',`<span style="color:var(--muted)">${esc(n.note)}</span>`);
  if(n.sources&&n.sources.length)add('Sources',n.sources.map(esc).join(' · '));
  detail.classList.add('open');
}
</script>
</body>
</html>
