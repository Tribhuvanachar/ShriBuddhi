<!-- Genie favicon -- the round Brahmana murti (gopichandana urdhvapundra, angara, akshata), cropped from the Genie avatar itself; project-lead ask. Root /favicon.ico covers auto-discovery. -->

<link rel="icon" type="image/png" sizes="192x192" href="../images/genie/favicon-192.png">
<link rel="apple-touch-icon" href="../images/genie/apple-touch-icon.png">
</head>
<body>

<header class="top">
  <div class="row">
    <dge-breadcrumb label="काव्यानि" deva home-href="index.html" class="brand"><a href="index.html" title="DGE Home">⌂ DGE</a><span aria-hidden="true">›</span><span class="deva">काव्यानि</span></dge-breadcrumb><small id="totals" style="margin-left:6px;color:var(--muted)">…</small>

    <nav class="seg" aria-label="Related tools">
      <a class="btn" href="vyakarana/ashtadhyayi.html" style="border:0;border-radius:0">सूत्राणि</a>
      <a class="btn" href="vyakarana/dhatu.html" style="border:0;border-radius:0">धातु</a>
    </nav>

    <div class="seg" role="group" aria-label="Script">
      <button type="button" data-script="deva">देव</button>
      <button type="button" data-script="iast">IAST</button>
      <button type="button" data-script="kn">ಕನ್ನಡ</button>
    </div>

    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="read">पठनम् · Read</button>
      <button type="button" data-mode="compare">तुलना · Compare</button>
    </div>

    <button class="btn" id="smaller" type="button" aria-label="Smaller text">A−</button>
    <button class="btn" id="bigger"  type="button" aria-label="Larger text">A+</button>
    <button class="btn" id="theme"   type="button" aria-label="Toggle dark mode">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="pickers">
    <label class="sr" for="workSel">Work</label>
    <select class="btn" id="workSel" style="max-width:min(60vw,380px)"></select>

    <label class="sr" for="unitSel">Sarga / Anka / Ullasa</label>
    <select class="btn" id="unitSel" style="max-width:min(45vw,300px)"></select>

    <form class="jump" id="jumpForm">
      <label class="sr" for="jumpInput">Jump to verse</label>
      <input id="jumpInput" placeholder="1.17  ( / )" inputmode="decimal">
      <button class="btn" type="submit">→</button>
    </form>
  </div>

  <div class="layerbar" id="layerBar" role="group" aria-label="Layers"></div>

  <section id="verses"></section>
</main>

<footer class="pager">
  <button class="btn" id="prev" type="button">← पूर्वम्</button>
  <span class="unit" id="unitNow"></span>
  <button class="btn" id="next" type="button">अग्रिमम् →</button>
</footer>

</html>
