<h3><a name="an_iii">III.</a></h3>
<p>1. The duties of a king are, to protect his people, and to honour the Br&acirc;hma*n*as.</p>
<p>2. He must not levy taxes upon Br&acirc;hma*n*as learned in the Vedas.</p>
<p>3. Let him appoint judges versed in law. <a href="#fn_3">1</a></p>
<div class="footnotes"><a name="fn_3"></a><p>1. See Manu VIII, 1.</p></div>
