<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Guru Vandana guard: bounces anyone arriving by bookmark or deep link
     back to the vandana at the site root. Must stay the first script here. -->
<script src="../js/vandana-guard.js?v=2"></script>
<script src="../js/admin-gate.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvaitaVedanta Extraction · DGE</title>
<!--
  Progress dashboard for the the source edition extraction.
  Reads data/darshana/vedanta/dvaita/DvaitaVedantaIn/_extract_status.json, which is written by
  tools/dvaitavedanta/import_dvaitavedanta.py on every run.

  Design tokens are lifted from admin/library.html so this page sits in the
  same visual system as the rest of DGE. Colour here is status-only (complete /
  partial / pending / failed) — no categorical series palette is introduced, and
  every status is carried by a text label as well as a dot, never colour alone.
-->
<style>
  :root{--bg:#f5efe4;--panel:#fffdf8;--panel2:#fbf4e7;--ink:#2b2117;--muted:#8b7c66;--line:#e6dac6;
    --accent:#9a3b1b;--accent2:#1f6f5c;--gold:#b6862c;
    --ok:#2f9e6f;--part:#c98a2b;--pend:#b9ab90;--bad:#b3402c;
    --shadow:0 2px 16px rgba(90,60,20,.10);--radius:14px}
  body.dark{--bg:#14161c;--panel:#1b1f27;--panel2:#20242f;--ink:#e9e3d5;--muted:#98a0b2;--line:#2b3140;
    --accent:#e0794b;--accent2:#5bb894;--gold:#e0b25a;
    --ok:#5bb894;--part:#e0b25a;--pend:#5a5f6b;--bad:#ef8a72;--shadow:0 6px 26px rgba(0,0,0,.4)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;transition:.3s}
  header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
  .bar{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-weight:700}.brand small{color:var(--muted);font-weight:400}.spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;
    cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
  h2{font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:26px 0 10px}
  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
  .stat b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:12px}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .sec .n{font-weight:700}
  .sec .m{color:var(--muted);font-size:12px;margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .prog{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;background:var(--ok);border-radius:999px}
  .prog i.part{background:var(--part)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;
    cursor:pointer;user-select:none;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dev{font-size:15px}
  .slug{color:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.complete{background:var(--ok)}.dot.partial{background:var(--part)}
  .dot.pending{background:var(--pend)}.dot.failed{background:var(--bad)}
  .layers{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .lay{font-size:11px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;
    padding:1px 8px;color:var(--muted);white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .toolbar input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);
    border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink)}
  .chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 11px;
    cursor:pointer;font-size:13px;color:var(--muted)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:10px;padding:11px 14px;color:var(--muted);font-size:13px;margin-top:10px}
  .note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink)}
  ul.plain{margin:6px 0 0;padding-left:18px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
</style>
<!-- Genie favicon -- the round Brahmana murti (gopichandana urdhvapundra, angara, akshata), cropped from the Genie avatar itself; project-lead ask. Root /favicon.ico covers auto-discovery. -->
<link rel="icon" type="image/png" sizes="48x48" href="../images/genie/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../images/genie/favicon-192.png">
<link rel="apple-touch-icon" href="../images/genie/apple-touch-icon.png">
</head>
<body>
<header>
  <div class="bar">
    <div class="crumb" style="font-size:13px;color:var(--muted)"><a href="index.html" title="DGE Home" style="color:var(--accent);text-decoration:none;font-weight:700">⌂ DGE</a><span style="opacity:.6;margin:0 6px">›</span><b style="color:var(--ink)">DvaitaVedanta Extraction</b></div>
    <div class="brand">DvaitaVedanta Extraction <small>· DGE progress tracker</small></div>
    <div class="spacer"></div>
    <span id="stamp" class="slug"></span>
    <button class="btn" id="theme">◐ Theme</button>
    <button class="btn" id="reload">↻ Reload</button>
  </div>
</header>

<!-- This whole page is an ingestion-progress dashboard for whoever is
     running the the source edition import — not linked from anywhere a
     reader would land, but a direct URL should not hand a visitor an
     internal tracker either (see js/admin-gate.js). -->
<main data-admin-only>
  <div id="app"><div class="empty">Loading <code>data/darshana/vedanta/dvaita/DvaitaVedantaIn/_extract_status.json</code>…</div></div>
</main>
<div class="empty" style="max-width:1100px;margin:40px auto;padding:0 14px;" id="publicNotice">
  This is an internal content-pipeline dashboard, visible only to a signed-in admin.
</div>
<style>body.dge-is-admin #publicNotice{display:none}</style>

<script>
const STATUS_URL = "data/darshana/vedanta/dvaita/DvaitaVedantaIn/_extract_status.json";
const ORDER = ["failed", "partial", "pending", "complete"];
let DATA = null, filter = "", statusFilter = "";

const n = v => (v || 0).toLocaleString();
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pct(part, whole) {
  if (!whole) return 0;
  return Math.max(0, Math.min(100, Math.round((part / whole) * 100)));
}

function statTiles(t) {
  const tiles = [
    ["granthas complete", `${n(t.complete)} / ${n(t.granthas)}`],
    ["items extracted", n(t.items)],
    ["leaf pages with text", n(t.with_text)],
    ["container nodes skipped", n(t.containers)],
    ["failures", n(t.failed)],
    ["on disk", ((t.bytes || 0) / 1048576).toFixed(1) + " MB"],
  ];
  return `<div class="totals">${tiles.map(([label, value]) =>
    `<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join("")}</div>`;
}

function sectionCards(sections) {
  const keys = Object.keys(sections || {});
  if (!keys.length) return "";
  return `<h2>By section</h2><div class="secgrid">${keys.map(key => {
    const s = sections[key];
    const done = pct(s.complete, s.granthas);
    return `<div class="sec">
      <div class="n">${esc(key.replace(/_/g, " "))}</div>
      <div class="m">${n(s.complete)}/${n(s.granthas)} granthas · ${n(s.items)} items${
        s.failed ? ` · ${n(s.failed)} failed` : ""}</div>
      <div class="prog"><i class="${done === 100 ? "" : "part"}" style="width:${done}%"></i></div>
    </div>`;
  }).join("")}</div>`;
}

function granthaRows(granthas) {
  const entries = Object.entries(granthas || {})
    .filter(([key, g]) => {
      if (statusFilter && (g.status || "pending") !== statusFilter) return false;
      if (!filter) return true;
      const hay = (key + " " + (g.title || "")).toLowerCase();
      return hay.includes(filter.toLowerCase());
    })
    .sort((a, b) => {
      const d = ORDER.indexOf(a[1].status || "pending") - ORDER.indexOf(b[1].status || "pending");
      return d !== 0 ? d : a[0].localeCompare(b[0]);
    });

  if (!entries.length) return `<div class="empty">No granthas match.</div>`;

  const rows = entries.map(([key, g]) => {
    const status = g.status || "pending";
    const done = pct(g.with_text + g.containers, g.discovered);
    const layers = Object.entries(g.layers || {})
      .map(([name, count]) => `<span class="lay">${esc(name)} ${n(count)}</span>`).join("");
    return `<tr>
      <td>
        <div class="dev">${esc(g.title || "—")}</div>
        <div class="slug">${esc(key)}</div>
        ${layers ? `<div class="layers">${layers}</div>` : ""}
      </td>
      <td><span class="st"><span class="dot ${status}"></span>${esc(status)}</span></td>
      <td style="min-width:110px">
        <div class="prog"><i class="${done === 100 ? "" : "part"}" style="width:${done}%"></i></div>
        <div class="slug">${n(g.with_text)} of ${n(g.discovered)}</div>
      </td>
      <td class="num">${n(g.items)}</td>
      <td class="num">${n(g.containers)}</td>
      <td class="num">${g.failed ? esc(g.failed) : "—"}</td>
      <td class="num">${((g.bytes || 0) / 1024).toFixed(0)} KB</td>
      <td class="slug">${esc((g.last_run || "").replace("T", " ").replace("+00:00", "Z"))}</td>
    </tr>`;
  }).join("");

  return `<table>
    <thead><tr>
      <th>Grantha</th><th>Status</th><th>Leaves fetched</th>
      <th class="num">Items</th><th class="num">Containers</th>
      <th class="num">Failed</th><th class="num">Size</th><th>Last run</th>
    </tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function extras(data) {
  let html = "";
  const unmapped = data.unmapped_layers || {};
  const names = Object.keys(unmapped);
  if (names.length) {
    html += `<h2>Unmapped commentary layers</h2><div class="note">
      These headings had no entry in <code>layers</code> in
      <code>tools/dvaitavedanta/dv_sources.json</code>, so their folder was
      auto-slugged and the schema defaulted to <code>grantha_tika_text</code>.
      Add them to fix the folder name, schema and author.
      <ul class="plain">${names.sort((a, b) => unmapped[b] - unmapped[a])
        .map(name => `<li><b>${esc(name)}</b> — ${n(unmapped[name])} items</li>`).join("")}</ul>
    </div>`;
  }
  const failures = data.failures || [];
  if (failures.length) {
    html += `<h2>Failures (${n(failures.length)})</h2><div class="note">
      <ul class="plain">${failures.slice(0, 40).map(f =>
        `<li><code>${esc(f.url)}</code> — ${esc(f.error || f.status)}</li>`).join("")}
      ${failures.length > 40 ? `<li>…and ${n(failures.length - 40)} more</li>` : ""}</ul>
    </div>`;
  }
  html += `<div class="note" style="border-left-color:var(--accent2)">
    Source: <b>the source edition</b> — ${esc(data.license_note || "")}
  </div>`;
  return html;
}

function render() {
  const app = document.getElementById("app");
  if (!DATA) return;
  const counts = { complete: 0, partial: 0, pending: 0, failed: 0 };
  Object.values(DATA.granthas || {}).forEach(g => {
    counts[g.status || "pending"] = (counts[g.status || "pending"] || 0) + 1;
  });

  app.innerHTML = statTiles(DATA.totals || {})
    + sectionCards(DATA.sections)
    + `<h2>Granthas</h2>
       <div class="toolbar">
         <input type="search" id="q" placeholder="Filter by title or slug…" value="${esc(filter)}">
         ${["", ...ORDER].map(s => `<button class="chip${statusFilter === s ? " on" : ""}" data-s="${s}">${
            s ? `${s} (${counts[s] || 0})` : "all"}</button>`).join("")}
       </div>`
    + granthaRows(DATA.granthas)
    + extras(DATA);

  document.getElementById("stamp").textContent = DATA.last_run
    ? "last run " + DATA.last_run.replace("T", " ").replace("+00:00", "Z") : "";
  const q = document.getElementById("q");
  q.addEventListener("input", e => { filter = e.target.value; render(); q.focus(); });
  app.querySelectorAll(".chip").forEach(chip =>
    chip.addEventListener("click", () => { statusFilter = chip.dataset.s; render(); }));
}

async function load() {
  const app = document.getElementById("app");
  try {
    const response = await fetch(STATUS_URL + "?t=" + Math.random().toString(36).slice(2));
    if (!response.ok) throw new Error("HTTP " + response.status);
    DATA = await response.json();
    render();
  } catch (error) {
    app.innerHTML = `<div class="empty">
      Could not load <code>${STATUS_URL}</code> — ${esc(error.message)}.<br><br>
      Run the <b>Extract DvaitaVedanta</b> workflow first; it writes this file.
    </div>`;
  }
}

document.getElementById("theme").addEventListener("click",
  () => document.body.classList.toggle("dark"));
document.getElementById("reload").addEventListener("click", load);
if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
  document.body.classList.add("dark");
load();
</script>
</body>
</html>
